<!doctype html>
<html lang="es">
<head>
<title>MolinaLab</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: app shell — sidebar on desktop, tab bar on phone; content reads like an instrument panel of lists, drawers and freezer-box grids. Cap colour encodes record type everywhere. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f5f7f9; --sunk:#e3e8ed; --line:#d7dde4; --line-2:#c2cbd4;
  --fg:#14202b; --fg-2:#4b5966; --fg-3:#768491;
  --accent:#2443c4; --accent-ink:#ffffff; --accent-soft:#e4e9fb; --accent-line:#b7c4f1;
  --c-strain:#c27905; --c-plasmid:#7346c8; --c-oligo:#0a8279; --c-reagent:#c43b61; --c-other:#5d6b78;
  --cap-ink:#ffffff;
  --ok:#1b7a44; --ok-soft:#dbf0e3; --warn:#94600a; --warn-soft:#fbefd5; --bad:#b12626; --bad-soft:#fbe0e0;
  --shadow:0 1px 2px rgba(20,32,43,.06),0 10px 30px rgba(20,32,43,.10);
  --scrim:rgba(14,22,30,.42);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px; --r-sm:7px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1116; --surface:#141b22; --surface-2:#19212a; --sunk:#0f151b; --line:#253039; --line-2:#33414e;
  --fg:#e2e8ee; --fg-2:#a2afbc; --fg-3:#72808e;
  --accent:#8199ff; --accent-ink:#0c1116; --accent-soft:#1b2446; --accent-line:#34449a;
  --c-strain:#f0a73a; --c-plasmid:#a888f1; --c-oligo:#3cc3b7; --c-reagent:#f07899; --c-other:#93a1ae;
  --cap-ink:#0c1116;
  --ok:#5cc88a; --ok-soft:#13301f; --warn:#e7b24f; --warn-soft:#342910; --bad:#f27a7a; --bad-soft:#3a1717;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 34px rgba(0,0,0,.4); --scrim:rgba(0,0,0,.58);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c1116; --surface:#141b22; --surface-2:#19212a; --sunk:#0f151b; --line:#253039; --line-2:#33414e;
  --fg:#e2e8ee; --fg-2:#a2afbc; --fg-3:#72808e;
  --accent:#8199ff; --accent-ink:#0c1116; --accent-soft:#1b2446; --accent-line:#34449a;
  --c-strain:#f0a73a; --c-plasmid:#a888f1; --c-oligo:#3cc3b7; --c-reagent:#f07899; --c-other:#93a1ae;
  --cap-ink:#0c1116;
  --ok:#5cc88a; --ok-soft:#13301f; --warn:#e7b24f; --warn-soft:#342910; --bad:#f27a7a; --bad-soft:#3a1717;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 34px rgba(0,0,0,.4); --scrim:rgba(0,0,0,.58);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3,h4{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-size:1.85rem;font-weight:700;line-height:1.12;letter-spacing:-.015em}
h2{font-family:var(--f-display);font-size:1.18rem;font-weight:700;line-height:1.25;letter-spacing:-.005em}
h3{font-size:.95rem;font-weight:600}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.mono,.code{font-family:var(--f-mono)}
.mute{color:var(--fg-3)}
.small{font-size:.84rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:600}
.lede{color:var(--fg-2);font-size:.92rem;margin-top:4px}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;font-size:.93rem;color:var(--fg);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:.5rem .65rem;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.45}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.48rem .8rem;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:500;font-size:.88rem;white-space:nowrap;text-decoration:none;color:var(--fg);line-height:1.2}
.btn:hover{border-color:var(--fg-3)}
.btn .ico{width:16px;height:16px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.solid{background:var(--bad);color:var(--surface)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:.32rem .6rem;font-size:.8rem}
.btn.icon{padding:.45rem}
.btn:disabled{opacity:.55;cursor:default}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font:inherit}

/* shell */
.side{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center}
.brand-m{display:flex;align-items:center}
.logo{width:30px;height:30px;flex:none}
.gs{position:relative;flex:1;min-width:0;max-width:560px}
.gs label{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-2);border-radius:999px;padding:0 12px;color:var(--fg-3)}
.gs label:focus-within{border-color:var(--accent);outline:2px solid var(--accent-line)}
.gs input{border:0;background:transparent;padding:.5rem 0;outline:none}
.gs kbd{font-family:var(--f-mono);font-size:.7rem;border:1px solid var(--line-2);border-radius:4px;padding:0 5px;color:var(--fg-3)}
.gres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);max-height:min(70vh,520px);overflow-y:auto;z-index:35;padding:6px}
.gres .grp{padding:8px 10px 4px}
.gres button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;min-width:0}
.gres button:hover,.gres button.on{background:var(--surface-2)}
.gres .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.top .addbtn .albl{display:none}
main{padding-block:22px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px;min-width:0}
#banner:empty{display:none}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:var(--r-sm);font-size:.88rem;background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.banner .sp{flex:1}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;font-size:.68rem;font-weight:500;color:var(--fg-3);text-decoration:none;background:none;border:0;cursor:pointer}
.tabbar .ico{width:21px;height:21px}
.tabbar [aria-current=page]{color:var(--accent)}
@media (min-width:900px){
  .app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
  .side{display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding:18px 12px}
  .tabbar,.brand-m{display:none}
  .top .addbtn .albl{display:inline}
  main{padding-block:28px 64px;padding-left:32px;padding-right:max(32px,env(safe-area-inset-right,0px))}
  .top{padding-left:32px;padding-right:max(32px,env(safe-area-inset-right,0px))}
}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.brand b{font-family:var(--f-display);font-size:1.3rem;letter-spacing:-.01em;line-height:1}
.brand small{display:block;color:var(--fg-3);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-sm);color:var(--fg-2);text-decoration:none;font-weight:500;font-size:.9rem}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a[aria-current=page]{background:var(--accent-soft);color:var(--accent)}
.nav .cnt{margin-left:auto;font-family:var(--f-mono);font-size:.74rem;color:var(--fg-3);font-variant-numeric:tabular-nums}
.nav .grp{font-size:.66rem;text-transform:uppercase;letter-spacing:.09em;color:var(--fg-3);padding:14px 10px 4px;font-weight:600}
.side .foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:.84rem;color:var(--fg-2);min-width:0}
.side .foot span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--cap,var(--c-other));box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);flex:none}

/* view head */
.vhead{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;justify-content:space-between}
.vacts{display:flex;flex-wrap:wrap;gap:8px}
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fbar select{width:auto;max-width:100%;font-size:.86rem;padding:.42rem .55rem;background:var(--surface)}
.fsearch{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:0 10px;color:var(--fg-3);flex:1 1 220px;min-width:0}
.fsearch:focus-within{border-color:var(--accent);outline:2px solid var(--accent-line)}
.fsearch input{border:0;padding:.42rem 0;background:transparent;outline:none}

/* tables */
.tblwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-3);font-weight:600;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--fg-2)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tbody tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.mainc{display:flex;align-items:center;gap:9px;min-width:0}
.mainc .code{color:var(--fg-2);font-size:.8rem;white-space:nowrap}
.mainc .nm{color:var(--fg);font-weight:500;min-width:0;overflow-wrap:anywhere}
.tbl .num{font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:.82rem}
.seqcell{font-family:var(--f-mono);font-size:.8rem;letter-spacing:.02em;white-space:nowrap}
.sp-i{font-style:italic}
@media (max-width:760px){
  .tbl thead{display:none}
  .tbl,.tbl tbody{display:block}
  .tbl tr{display:flex;flex-wrap:wrap;gap:3px 14px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .tbl tbody tr:last-child{border-bottom:0}
  .tbl td{display:block;padding:0;border:0;font-size:.8rem}
  .tbl td.c-main{flex-basis:100%;font-size:.95rem;margin-bottom:2px}
  .tbl td.nil{display:none}
  .tbl td[data-l]::before{content:attr(data-l) " · ";color:var(--fg-3)}
}
.res{display:inline-flex;gap:3px;flex-wrap:wrap;vertical-align:middle}
.res span{font-family:var(--f-mono);font-size:.7rem;padding:0 5px;border-radius:4px;background:var(--surface-2);color:var(--fg-2);border:1px solid var(--line-2);line-height:1.5}
.tag{display:inline-block;font-size:.7rem;padding:1px 8px;border-radius:999px;font-weight:600;letter-spacing:.01em;white-space:nowrap;background:var(--surface-2);color:var(--fg-2);border:1px solid var(--line)}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.tag.demo{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.owner{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--fg-2)}
.av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:.58rem;font-weight:600;color:var(--surface);background:var(--avc,var(--fg-3));font-family:var(--f-mono);letter-spacing:-.02em;flex:none}
.av.lg{width:30px;height:30px;font-size:.66rem}
.loc{white-space:nowrap}
.loc b{font-weight:500;color:var(--fg)}

/* empty & cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.card>h2,.card>header{margin-bottom:10px}
.cardh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r);padding:34px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .ico{width:34px;height:34px;color:var(--fg-3);stroke-width:1.4}
.empty p{color:var(--fg-2);max-width:46ch}
.empty .vacts{justify-content:center;margin-top:4px}
.empty.small{padding:18px}
.skel{display:flex;flex-direction:column;gap:10px}
.skel i{display:block;height:44px;border-radius:var(--r-sm);background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sk 1.4s linear infinite}
@keyframes sk{to{background-position:-200% 0}}

/* dashboard */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:8px;min-width:0}
.tile:hover{border-color:var(--line-2)}
.tile .t{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--fg-2);font-weight:500}
.tile .n{font-family:var(--f-display);font-size:2.1rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;color:var(--fg)}
.tile .s{font-size:.76rem;color:var(--fg-3)}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.dgrid{grid-template-columns:minmax(0,1fr)}}
.li{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.li:first-of-type{border-top:0}
.li .body{flex:1;min-width:0}
.li .body b{font-weight:500}
.li .when{font-size:.76rem;color:var(--fg-3);white-space:nowrap}
.li button.lk{background:none;border:0;padding:0;text-align:left;cursor:pointer;min-width:0;flex:1;color:var(--fg-2)}
.sev{width:8px;height:8px;border-radius:50%;flex:none;background:var(--fg-3)}
.sev.bad{background:var(--bad)} .sev.warn{background:var(--warn)} .sev.info{background:var(--accent)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
@media (max-width:760px){.steps{grid-template-columns:minmax(0,1fr)}}
.step{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.step .k{font-family:var(--f-mono);font-size:.72rem;color:var(--fg-3)}
.step.done{opacity:.7}
.step.done .k::after{content:" · hecho";color:var(--ok)}
.welcome{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.act{font-size:.86rem;color:var(--fg-2)}
.act b{color:var(--fg);font-weight:500}

/* drawer / modal / sheet */
.layer{position:fixed;inset:0;z-index:40;display:flex}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .15s ease-out}
.drawer{justify-content:flex-end}
.panel{position:relative;width:min(580px,100%);height:100%;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;animation:slide .2s ease-out}
.panel-h{padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:14px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.panel-h .row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.panel-h .id{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.84rem;color:var(--fg-2)}
.panel-h h2{font-size:1.4rem}
.panel-b{flex:1;overflow-y:auto;padding-top:18px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px}
.pacts{display:flex;flex-wrap:wrap;gap:6px}
.confirm{background:var(--bad-soft);color:var(--bad);border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.88rem}
.confirm span{flex:1 1 200px}
.kvs{display:grid;grid-template-columns:minmax(110px,30%) minmax(0,1fr);gap:9px 14px;margin:0}
.kvs dt{color:var(--fg-3);font-size:.82rem;padding-top:1px}
.kvs dd{margin:0;min-width:0;overflow-wrap:anywhere}
.geno{white-space:pre-wrap}
.dsec{display:flex;flex-direction:column;gap:10px}
.dsec>h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-3)}
.rlinks{display:flex;flex-direction:column;gap:4px}
.rlink{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:3px 0;cursor:pointer;text-align:left;color:var(--fg);min-width:0}
.rlink:hover .nm{text-decoration:underline}
.rlink .code{font-size:.8rem;color:var(--fg-2)}
.meta{font-size:.78rem;color:var(--fg-3);border-top:1px solid var(--line);padding-top:12px}
.seqbox{font-family:var(--f-mono);font-size:.92rem;letter-spacing:.06em;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;overflow-wrap:anywhere;line-height:1.7}
.seqbox .tail{color:var(--fg-3)}
.seqstats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--fg-2);font-family:var(--f-mono)}
.seqstats b{color:var(--fg);font-weight:500}
.modal{align-items:center;justify-content:center;padding:20px}
.mcard{position:relative;width:min(680px,100%);max-height:min(92vh,100%);background:var(--surface);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;animation:pop .16s ease-out}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px 12px;border-bottom:1px solid var(--line)}
.mbody{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.mbody .intro{color:var(--fg-2);font-size:.92rem}
.mfoot{display:flex;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid var(--line)}
.mfoot .sp{flex:1}
@media (max-width:640px){
  .modal{padding:0}
  .mcard{width:100%;height:100%;max-height:100%;border-radius:0}
  .mhead{padding-top:calc(14px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mbody{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mfoot{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
.sheet{align-items:flex-end;justify-content:center}
.spanel{position:relative;width:min(440px,100%);background:var(--surface);border-radius:16px 16px 0 0;box-shadow:var(--shadow);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .18s ease-out}
@media (min-width:640px){.sheet{align-items:center}.spanel{border-radius:16px}}
.slist{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;margin-top:8px}
.slist a,.slist button{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:9px;text-decoration:none;color:var(--fg);background:none;border:0;cursor:pointer;font-weight:500;text-align:left}
.slist a:hover,.slist button:hover{background:var(--surface-2)}
.slist .cap{width:14px;height:14px;margin:0 2px}
@keyframes slide{from{transform:translateX(24px);opacity:.4}}
@keyframes pop{from{transform:scale(.98);opacity:.5}}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* forms */
.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 16px}
.fld{display:flex;flex-direction:column;gap:5px;grid-column:1/-1;min-width:0}
.fld.half{grid-column:auto}
@media (max-width:560px){.fld.half{grid-column:1/-1}}
.lbl{font-size:.8rem;font-weight:600;color:var(--fg-2)}
.lbl.req::after{content:" *";color:var(--bad)}
.help{font-size:.76rem;color:var(--fg-3)}
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.chip-opt{position:relative;cursor:pointer}
.chip-opt input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.chip-opt span{display:inline-block;padding:3px 10px;border-radius:999px;border:1px solid var(--line-2);font-family:var(--f-mono);font-size:.8rem;color:var(--fg-2);background:var(--surface)}
.chip-opt input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip-opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.checklist{max-height:210px;overflow-y:auto;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:4px}
.checklist label{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:5px;font-size:.88rem;cursor:pointer}
.checklist label:hover{background:var(--surface-2)}
.checklist .code{font-size:.78rem;color:var(--fg-2)}
.cl-filter{margin-bottom:4px}
.seqarea{font-family:var(--f-mono);letter-spacing:.04em}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;cursor:pointer}
.ferr{color:var(--bad);font-size:.86rem}
.ferr:empty{display:none}
.row2{display:flex;gap:8px;align-items:center}
.row2>select{flex:1}

/* boxes */
.boxframe{background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:12px 12px 14px;max-width:600px}
.grid-box{display:grid;grid-template-columns:18px repeat(var(--cols),minmax(0,1fr));gap:4px}
.grid-box .lab{font-family:var(--f-mono);font-size:.64rem;color:var(--fg-3);display:grid;place-items:center}
.cell{aspect-ratio:1;border-radius:50%;border:1px dashed var(--line-2);background:var(--surface);display:grid;place-items:center;font-family:var(--f-mono);font-size:.56rem;color:var(--fg-3);cursor:pointer;padding:0;min-width:0;overflow:hidden;line-height:1}
.cell:hover{border-color:var(--accent);border-style:solid}
.cell.occ{border:0;background:var(--cap);color:var(--cap-ink);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),0 1px 2px rgba(0,0,0,.15);font-weight:500}
.cell.sel{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.cell.hi{outline:3px solid var(--fg);outline-offset:2px;animation:pulse 1.2s ease-in-out 2}
.cell:disabled{cursor:not-allowed}
.grid-box.mini .cell{font-size:.5rem}
@keyframes pulse{50%{outline-offset:5px}}
.fz{display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr);gap:20px;align-items:start}
.fz-list{display:flex;flex-direction:column;gap:14px}
.fzg{display:flex;flex-direction:column;gap:6px}
.boxbtn{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;cursor:pointer;width:100%}
.boxbtn:hover{border-color:var(--line-2)}
.boxbtn[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.boxbtn .r1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.boxbtn .r1 b{font-weight:600}
.meter{height:5px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter i.warn{background:var(--warn)} .meter i.bad{background:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--fg-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.fz-back{display:none}
@media (max-width:899px){
  .fz{grid-template-columns:minmax(0,1fr)}
  .fz.has-sel .fz-list{display:none}
  .fz:not(.has-sel) .fz-view{display:none}
  .fz-back{display:inline-flex}
}

/* protocols */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0}
.pcard:hover{border-color:var(--line-2)}
.pcard h3{font-family:var(--f-display);font-size:1.05rem;font-weight:700}
.pcard p{color:var(--fg-2);font-size:.85rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcard .m{font-size:.76rem;color:var(--fg-3);margin-top:auto}
.prose{max-width:66ch;line-height:1.62}
.prose h2{font-size:1.2rem;margin:1.1em 0 .4em}
.prose h3{font-family:var(--f-display);font-size:1.05rem;font-weight:700;margin:1.2em 0 .35em}
.prose h4{font-size:.95rem;margin:1em 0 .3em}
.prose>*:first-child{margin-top:0}
.prose p{margin:.5em 0}
.prose ol,.prose ul{padding-left:1.35em;margin:.4em 0}
.prose li{margin:.3em 0}
.prose ol li::marker{font-family:var(--f-mono);font-size:.85em;color:var(--fg-3)}
.prose code{font-family:var(--f-mono);font-size:.86em;background:var(--sunk);padding:1px 5px;border-radius:4px}
.q{font-family:var(--f-mono);font-size:.86em;background:var(--accent-soft);color:var(--accent);padding:0 5px;border-radius:4px;white-space:nowrap}
.oldver{background:var(--warn-soft);color:var(--warn);border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.88rem}
.oldver span{flex:1 1 200px}

/* theses */
.thgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:16px;align-items:start}
.th-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tline{margin:16px 0 6px;position:relative;height:30px}
.tline .bar{position:absolute;left:0;right:0;top:12px;height:6px;background:var(--sunk);border-radius:99px}
.tline .bar i{position:absolute;inset:0 auto 0 0;background:var(--accent-line);border-radius:99px}
.tline .dot{position:absolute;top:9px;width:12px;height:12px;margin-left:-6px;border-radius:50%;border:2px solid var(--surface);background:var(--fg-3)}
.tline .dot.done{background:var(--ok)} .tline .dot.curso{background:var(--accent)} .tline .dot.late{background:var(--bad)}
.tline .now{position:absolute;top:2px;bottom:2px;width:2px;margin-left:-1px;background:var(--fg)}
.tl-l{display:flex;justify-content:space-between;font-size:.74rem;color:var(--fg-3);font-family:var(--f-mono)}
.ms-head{display:flex;align-items:center;gap:10px;margin:16px 0 4px}
.ms-head h3{flex:1}
.ms{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ms-t{display:flex;flex-direction:column;align-items:flex-start;background:none;border:0;padding:0;text-align:left;cursor:pointer;min-width:0}
.ms-t span:first-child{overflow-wrap:anywhere}
.ms.done .ms-t span:first-child{text-decoration:line-through;color:var(--fg-3)}
.ms-d{font-size:.78rem;color:var(--fg-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.ms-d.bad{color:var(--bad);font-weight:600}
.msdot{width:20px;height:20px;border-radius:50%;border:2px solid var(--fg-3);background:transparent;cursor:pointer;padding:0;display:grid;place-items:center;color:var(--surface)}
.msdot.s-curso{border-color:var(--accent);background:conic-gradient(var(--accent) 0 50%,transparent 50% 100%)}
.msdot.s-hecho{border-color:var(--ok);background:var(--ok)}
.msdot .ico{width:12px;height:12px;stroke-width:3}

/* personal */
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:7px;cursor:pointer;font-weight:500;font-size:.87rem;color:var(--fg-2);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.qadd{display:flex;gap:8px;flex-wrap:wrap}
.qadd input[type=text]{flex:1 1 240px}
.qadd input[type=date]{width:auto;flex:0 1 170px}
.task{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.task.done .tx{text-decoration:line-through;color:var(--fg-3)}
.task input{width:18px;height:18px}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ncard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:120px;min-width:0}
.ncard:hover{border-color:var(--line-2)}
.ncard p{color:var(--fg-2);font-size:.86rem;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.ncard .m{font-size:.74rem;color:var(--fg-3);margin-top:auto}

/* import */
.drop{border:2px dashed var(--line-2);border-radius:var(--r);padding:22px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input[type=file]{max-width:320px}
.maptbl{width:100%;border-collapse:collapse;font-size:.88rem}
.maptbl td,.maptbl th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.maptbl th{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-3)}
.maptbl select{font-size:.86rem;padding:.35rem .5rem}
.maptbl .ex{font-family:var(--f-mono);font-size:.78rem;color:var(--fg-3);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scrollx{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.opts{display:flex;flex-direction:column;gap:8px;font-size:.9rem}
.opts label{display:flex;gap:8px;align-items:center}
.progress{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.stack{display:flex;flex-direction:column;gap:14px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:760px){.two{grid-template-columns:minmax(0,1fr)}}
.member{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.member:first-child{border-top:0}
.member .body{flex:1;min-width:0}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}
#toast div{background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.88rem;box-shadow:var(--shadow);animation:up .18s ease-out}
@media (min-width:900px){#toast{bottom:28px}}

.gate{min-height:100vh;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gcard{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.gcard .brand{padding:0 0 6px}
.or{display:flex;align-items:center;gap:10px;color:var(--fg-3);font-size:.8rem}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.btn.wide{width:100%;padding:.68rem}
</style>

</head>
<body>
<div id="gate" class="gate" hidden></div>
<div class="app" hidden>
  <aside class="side" aria-label="Navegación">
    <div class="brand"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8" fill="var(--fg)"/><circle cx="9" cy="9" r="3.1" fill="var(--c-strain)"/><circle cx="16" cy="9" r="3.1" fill="var(--c-plasmid)"/><circle cx="9" cy="16" r="3.1" fill="var(--c-oligo)"/><circle cx="23" cy="16" r="3.1" fill="var(--c-reagent)"/><circle cx="16" cy="23" r="3.1" fill="var(--c-strain)"/></svg><div><b>MolinaLab</b><small>Gestión del grupo</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="sidefoot"></div>
  </aside>
  <div class="mainwrap">
    <header class="top">
      <a class="brand-m" href="#inicio" aria-label="Inicio"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8" fill="var(--fg)"/><circle cx="9" cy="9" r="3.1" fill="var(--c-strain)"/><circle cx="16" cy="9" r="3.1" fill="var(--c-plasmid)"/><circle cx="9" cy="16" r="3.1" fill="var(--c-oligo)"/><circle cx="23" cy="16" r="3.1" fill="var(--c-reagent)"/><circle cx="16" cy="23" r="3.1" fill="var(--c-strain)"/></svg></a>
      <div class="gs" id="gs">
        <label><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="gsearch" type="search" placeholder="Buscar código, nombre, gen o secuencia…" autocomplete="off" aria-label="Buscar en todo"><kbd>/</kbd></label>
        <div class="gres" id="gres" hidden></div>
      </div>
      <button class="btn primary addbtn" data-a="add-menu" aria-label="Añadir"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="albl">Añadir</span></button>
    </header>
    <main><div class="wrap"><div id="banner"></div><div id="main" class="stack"></div></div></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Secciones"></nav>
</div>
<div id="drawer" class="layer drawer" hidden></div>
<div id="modal" class="layer modal" hidden></div>
<div id="sheet" class="layer sheet" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
'use strict';
/* ---------- icons ---------- */
const IC={
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 strain:'<circle cx="12" cy="12" r="9"/><circle cx="9" cy="10" r="1.6"/><circle cx="14.5" cy="13.5" r="2"/><circle cx="10" cy="15.8" r="1"/>',
 plasmid:'<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 7.6 5.5" stroke-width="3.4"/>',
 oligo:'<path d="M3 12h18"/><path d="M6 8v8M10 9v6M14 8v8M18 9v6"/>',
 reagent:'<path d="M9 3h6M10 3v5l-4.5 7.2A3.5 3.5 0 0 0 8.5 21h7a3.5 3.5 0 0 0 3-5.8L14 8V3"/><path d="M7 15h10"/>',
 freezer:'<rect x="3" y="3" width="18" height="18" rx="2.5"/><circle cx="8" cy="8" r="1.3"/><circle cx="12" cy="8" r="1.3"/><circle cx="16" cy="8" r="1.3"/><circle cx="8" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="16" cy="12" r="1.3"/><circle cx="8" cy="16" r="1.3"/><circle cx="12" cy="16" r="1.3"/><circle cx="16" cy="16" r="1.3"/>',
 protocol:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>',
 thesis:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5M22 9v6"/>',
 me:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',
 import:'<path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v3h16v-3"/>',
 settings:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>',
 edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/>',
 copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
 trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
 more:'<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>',
 download:'<path d="M12 3v12M7 10l5 5 5-5M4 20h16"/>',
 check:'<path d="M5 12l5 5 9-10"/>',
 back:'<path d="M15 5l-7 7 7 7"/>',
 swap:'<path d="M4 8h14l-3-3M20 16H6l3 3"/>',
 cart:'<path d="M3 4h2l2.4 11h11L21 7H6.2"/><circle cx="9" cy="19.5" r="1.4"/><circle cx="17.5" cy="19.5" r="1.4"/>',
 ext:'<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
 note:'<path d="M5 3h14v18H5z"/><path d="M9 8h6M9 12h6M9 16h3"/>'
};
const ic=(n,c='')=>`<svg class="ico ${c}" viewBox="0 0 24 24" aria-hidden="true">${IC[n]||''}</svg>`;

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>new Date().toISOString();
const isoDay=d=>{const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`};
const toDate=s=>{if(!s)return null;const d=new Date(String(s).length===10?s+'T00:00:00':s);return isNaN(d)?null:d};
const dayDiff=s=>{const d=toDate(s);if(!d)return null;d.setHours(0,0,0,0);const t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/86400000)};
const fmtD=s=>{const d=toDate(s);return d?d.toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'}):''};
const rel=s=>{const d=toDate(s);if(!d)return '';const x=(Date.now()-d)/1000;if(x<60)return 'ahora mismo';if(x<3600)return `hace ${Math.floor(x/60)} min`;if(x<86400)return `hace ${Math.floor(x/3600)} h`;const n=Math.floor(x/86400);if(n===1)return 'ayer';if(n<7)return `hace ${n} días`;return fmtD(s)};
const natCmp=(a,b)=>String(a??'').localeCompare(String(b??''),'es',{numeric:true,sensitivity:'base'});
const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const slug=s=>norm(s).replace(/[^a-z0-9]+/g,'-');
const capf=s=>s?s[0].toUpperCase()+s.slice(1):s;
function clean(o){const r={};for(const [k,v] of Object.entries(o)){if(k.startsWith('_')||v===undefined)continue;r[k]=v}return JSON.parse(JSON.stringify(r))}
const fmtBp=n=>{if(n==null||n==='')return '';n=+n;if(!isFinite(n))return '';return n>=1000?`${(n/1000).toFixed(2).replace('.',',')} kb <span class="mute">(${n.toLocaleString('es-ES')} pb)</span>`:`${n} pb`};

const COMP={A:'T',T:'A',G:'C',C:'G',U:'A',R:'Y',Y:'R',S:'S',W:'W',K:'M',M:'K',B:'V',V:'B',D:'H',H:'D',N:'N'};
function revcomp(s){return [...String(s||'').replace(/\s/g,'')].reverse().map(ch=>{const u=ch.toUpperCase();const c=COMP[u]||u;return ch===u?c:c.toLowerCase()}).join('')}
function nstats(s){if(!s)return null;const u=s.toUpperCase();let gc=0,at=0;for(const c of u){if(c==='G'||c==='C')gc++;else if(c==='A'||c==='T'||c==='U')at++}const n=u.length;const tm=n<14?2*at+4*gc:64.9+41*(gc-16.4)/n;return{n,gc:Math.round(gc/n*100),tm:Math.round(tm)}}
function oligoInfo(seq){const s=String(seq||'').replace(/[^A-Za-z]/g,'');const full=nstats(s);if(!full)return null;let ann=null;if(/[a-z]/.test(s)&&/[A-Z]/.test(s))ann=nstats(s.replace(/[a-z]/g,''));return{...full,ann}}
function seqStatsHTML(seq){const i=oligoInfo(seq);if(!i)return '<span class="mute">Escribe la secuencia 5\'→3\'. En minúsculas, las colas que no hibridan (sitios de restricción, solapamientos).</span>';return `<span><b>${i.n}</b> nt</span><span><b>${i.gc}</b> % GC</span><span>Tm <b>${i.tm}</b> °C</span>${i.ann?`<span>· parte que hibrida: <b>${i.ann.n}</b> nt, Tm <b>${i.ann.tm}</b> °C</span>`:''}`}

const mem={},memSubs={};
function memEmit(p){(memSubs[p]||[]).forEach(cb=>cb(new Map(mem[p]||[]),{fromCache:false}))}
const store={
 sub(path,cb){
  if(DB){return DB.collection(path).onSnapshot(snap=>{const m=new Map();snap.docs.forEach(d=>m.set(d.id,{...d.data(),_id:d.id}));cb(m,snap.metadata)},err=>onDbError(path,err))}
  (memSubs[path]=memSubs[path]||[]).push(cb);cb(new Map(mem[path]||[]),{fromCache:false});return ()=>{};
 },
 async set(path,id,data){const body=clean(data);if(DB)return DB.collection(path).doc(id).set(body);(mem[path]=mem[path]||new Map()).set(id,{...body,_id:id});memEmit(path)},
 async del(path,id){if(DB)return DB.collection(path).doc(id).delete();mem[path]&&mem[path].delete(id);memEmit(path)},
 newId(path){if(DB)return DB.collection(path).doc().id;return 'm'+Math.random().toString(36).slice(2,12)}
};

 S.err=(e&&e.code==='revoked')?'Se ha retirado el acceso a los datos del grupo en esta vista.':'No se pudieron cargar algunos datos. Recarga la página más tarde.';

}
function writeErr(e){const c=e&&e.code;if(c==='permission-denied')return 'No se pudo guardar: tu cuenta no tiene permiso. Comprueba que tu correo está en la lista de acceso.';if(c==='resource-exhausted')return 'Se ha alcanzado la cuota gratuita de hoy. Mañana se restablece.';if(c==='invalid-argument')return 'No se pudo guardar: algún dato no es válido.';if(c==='unavailable')return 'Sin conexión con la base de datos. Vuelve a intentarlo en un momento.';return 'No se pudo guardar. Comprueba la conexión y vuelve a intentarlo.'}

/* ---------- boxes ---------- */
const rowL=i=>String.fromCharCode(65+i);
const posOf=(r,c)=>rowL(r)+(c+1);
function parsePos(v,b){if(v==null||!b)return null;const s=String(v).trim().toUpperCase();let m=s.match(/^([A-Z])\s*[-:.]?\s*0*(\d{1,2})$/);if(m){const r=m[1].charCodeAt(0)-65,c=+m[2]-1;return (r>=0&&r<b.rows&&c>=0&&c<b.cols)?posOf(r,c):null}m=s.match(/^0*(\d{1,3})$/);if(m){const n=+m[1]-1;if(n>=0&&n<b.rows*b.cols)return posOf(Math.floor(n/b.cols),n%b.cols)}return null}
function occ(boxId,exclude){const m=new Map();for(const t of ['strains','plasmids','oligos'])for(const d of S.data[t].values())if(d.loc&&d.loc.box===boxId&&d._id!==exclude)m.set(d.loc.pos,{type:t,d});return m}
function sortedBoxes(){return [...S.data.boxes.values()].sort((a,b)=>natCmp(a.freezer,b.freezer)||natCmp(a.name,b.name))}
function locShort(loc){if(!loc||!loc.box)return '';const b=S.data.boxes.get(loc.box);if(!b)return '';return `<span class="loc">${esc(b.name)} · <b class="mono">${esc(loc.pos||'')}</b></span>`}
function locText(loc){if(!loc||!loc.box)return ['',''];const b=S.data.boxes.get(loc.box);return [b?b.name:'',loc.pos||'']}
function firstFree(b,exclude){const o=occ(b._id,exclude);for(let r=0;r<b.rows;r++)for(let c=0;c<b.cols;c++){const p=posOf(r,c);if(!o.has(p))return p}return null}
function boxKind(type){return type==='strains'?'Gliceroles':type==='plasmids'?'Plásmidos':type==='oligos'?'Oligos':'Mixta'}
function gridHTML(b,opts={}){
 const o=occ(b._id,opts.exclude);
 let h=`<div class="grid-box${opts.mini?' mini':''}" style="--cols:${b.cols}"><span></span>`;
 for(let c=0;c<b.cols;c++)h+=`<span class="lab">${c+1}</span>`;
 for(let r=0;r<b.rows;r++){h+=`<span class="lab">${rowL(r)}</span>`;for(let c=0;c<b.cols;c++){const p=posOf(r,c);const x=o.get(p);
  if(opts.picker){
   if(x)h+=`<button type="button" class="cell occ" style="--cap:var(--c-${T[x.type].color})" disabled title="${esc(p+' · '+x.d.code)}" aria-label="${esc(p)} ocupada"></button>`;
   else h+=`<button type="button" class="cell${p===opts.sel?' sel':''}" data-a="loc-pick" data-pos="${p}" title="${p}" aria-pressed="${p===opts.sel}">${p===opts.sel?p:''}</button>`;
  }else if(opts.readonly){
   if(x)h+=`<span class="cell occ${p===opts.hi?' hi':''}" style="--cap:var(--c-${T[x.type].color})" title="${esc(p+' · '+x.d.code)}"></span>`;else h+=`<span class="cell"></span>`;
  }else{
   if(x){const short=String(x.d.code||'').split('-').pop();h+=`<button class="cell occ${p===S.boxHi?' hi':''}" style="--cap:var(--c-${T[x.type].color})" data-a="open" data-type="${x.type}" data-id="${x.d._id}" title="${esc(p+' · '+x.d.code+' · '+x.d.name)}" aria-label="${esc(p+': '+x.d.code+' '+x.d.name)}">${esc(short.slice(-3))}</button>`}
   else h+=`<button class="cell" data-a="cell-empty" data-box="${b._id}" data-pos="${p}" title="${p} · libre" aria-label="${p} libre">${b.cols<=10?p:''}</button>`;
  }}}
 return h+'</div>';
}

/* ---------- codes ---------- */
function nextCode(type,prefix,extra){
 const pre=T[type].pre(prefix||myPrefix()||'XX');let max=0;
 const scan=c=>{if(c&&c.toUpperCase().startsWith(pre.toUpperCase())){const n=parseInt(c.slice(pre.length),10);if(isFinite(n)&&n>max)max=n}};
 for(const d of S.data[type].values())scan(d.code);(extra||[]).forEach(scan);
 return pre+String(max+1).padStart(3,'0');
}

async function saveFile(name,data){try{const type=/\.json$/.test(name)?'application/json':'text/csv;charset=utf-8';const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}catch(_){toast('No se pudo preparar el archivo.')}}

function flush(){raf=0;const d=[...DIRTY];DIRTY.clear();const v=VIEWS[S.route];if(v.deps==='*'||d.includes('names')||d.some(x=>v.deps.includes(x)))renderBody();renderNav();if(S.detail)renderDrawer();if(!$('#gres').hidden)renderGsearch();if(d.some(x=>x!=='names'))scheduleNames();maybeOnboard()}

function loadingHTML(){return `<div class="skel" aria-label="Cargando"><i></i><i></i><i></i><i></i></div><p class="mute small">${S.slow?'No se pueden cargar los datos todavía. Se seguirá intentando.':'Cargando los datos del grupo…'}</p>`}

const NAV=[
 {r:'inicio',l:'Inicio',i:'home'},
 {g:'Colecciones'},

 $('#sidefoot').innerHTML=S.uid?`${avatar(S.uid,true)}<span>${esc(S.names[S.uid]||'Tú')}${myPrefix()?` · <span class="mono">${esc(myPrefix())}</span>`:''}</span><button class="btn ghost sm" data-a="signout" style="margin-left:auto">Salir</button>`:'';

function renderBanner(){
 let h='';
 if(S.err)h=`<div class="banner">${esc(S.err)}</div>`;
 else if(S.offline)h=`<div class="banner info">Sin conexión. Lo que guardes se enviará cuando vuelva la red, siempre que no cierres la página.</div>`;

function onRoute(){

function F(type){return S.filters[type]||(S.filters[type]={q:'',owner:'all',status:'',res:'',sort:'code'})}
function listShell(type){
 const t=T[type],f=F(type);
 const owners=memberIds().map(u=>`<option value="${esc(u)}"${f.owner===u?' selected':''}>${u===S.uid?'Míos':'De '+esc(pfirst(u))}</option>`).join('');
 const st=type==='reagents'?[['','Todo el stock'],['Suficiente','Suficiente'],['Queda poco','Queda poco'],['Agotado','Agotado'],['pedir','Lista de pedidos'],['caduca','Caducados o por caducar']]:[['','Cualquier estado'],...t.status.map(s=>[s,s])];
 return `<div class="vhead"><div><h1>${t.label}</h1><p class="lede" id="vcount">&nbsp;</p></div><div class="vacts">
  ${type==='reagents'?`<button class="btn" data-a="copy-orders">${ic('cart')}Copiar pedidos</button>`:''}
  <button class="btn" data-a="export" data-type="${type}">${ic('download')}CSV</button>
  ${S.canWrite?`<button class="btn" data-a="go-import" data-type="${type}">${ic('import')}Importar</button><button class="btn primary" data-a="new" data-type="${type}">${ic('plus')}${t.nuevo}</button>`:''}
 </div></div>
 <div class="fbar">
  <label class="fsearch">${ic('search')}<input id="flt-q" type="search" placeholder="Filtrar ${t.label.toLowerCase()}…" value="${esc(f.q)}" aria-label="Filtrar"></label>
  <select id="flt-owner" aria-label="Responsable"><option value="all">Todo el grupo</option>${owners}</select>
  <select id="flt-status" aria-label="Estado">${st.map(([v,l])=>`<option value="${esc(v)}"${f.status===v?' selected':''}>${l}</option>`).join('')}</select>
  ${t.hasMark?`<select id="flt-res" aria-label="Marcador"><option value="">Cualquier marcador</option>${MARK.map(([v,l])=>`<option value="${v}"${f.res===v?' selected':''}>${v} · ${l}</option>`).join('')}</select>`:''}
  <select id="flt-sort" aria-label="Orden">${[['code','Por código'],['name','Por nombre'],['updated','Editados recientemente']].map(([v,l])=>`<option value="${v}"${f.sort===v?' selected':''}>${l}</option>`).join('')}</select>
 </div><div id="vb"></div>`;
}
function matchItem(type,d,f){
 if(f.owner!=='all'&&d.owner!==f.owner)return false;
 if(f.res&&!(d.res||[]).includes(f.res))return false;
 if(f.status){
  if(type==='reagents'){
   if(f.status==='pedir'){if(!(d.order||d.stock==='Agotado'||d.stock==='Queda poco'))return false}
   else if(f.status==='caduca'){const n=dayDiff(d.expiry);if(n==null||n>30)return false}
   else if((d.stock||'Suficiente')!==f.status)return false;
  }else if((d.status||T[type].status[0])!==f.status)return false;
 }
 if(f.q){
  if(type==='oligos'&&d.seq){const s=d.seq.toUpperCase(),u=f.q.replace(/\s/g,'').toUpperCase();if(/^[ACGTUN]{4,}$/.test(u)&&(s.includes(u)||s.includes(revcomp(u))))return true}
  if(!norm(T[type].search(d).join(' ')).includes(norm(f.q)))return false;
 }
 return true;
}
function listBody(type){
 const t=T[type],f=F(type);let docs=[...S.data[type].values()];const total=docs.length;
 docs=docs.filter(d=>matchItem(type,d,f));
 docs.sort(f.sort==='name'?(a,b)=>natCmp(a.name,b.name):f.sort==='updated'?(a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')):(a,b)=>natCmp(a.code,b.code));
 const vc=$('#vcount');if(vc)vc.textContent=total?(docs.length===total?`${total} ${total===1?t.one:t.label.toLowerCase()}`:`${docs.length} de ${total}`):'Colección vacía';
 if(!total)return emptyList(type);
 if(!docs.length)return `<div class="empty small"><p>Nada coincide con estos filtros.</p><button class="btn sm" data-a="clear-filters" data-type="${type}">Quitar filtros</button></div>`;
 return `<div class="tblwrap"><table class="tbl"><thead><tr><th>${capf(t.one)}</th>${t.cols.map(c=>`<th>${c.l}</th>`).join('')}</tr></thead><tbody>${docs.map(d=>`<tr data-a="open" data-type="${type}" data-id="${esc(d._id)}" tabindex="0"><td class="c-main"><div class="mainc"><span class="cap" style="--cap:var(--c-${t.color})"></span><span class="code">${esc(d.code)}</span><span class="nm">${esc(d.name)}${statusTag(type,d)}${d.demo?' <span class="tag demo">Ejemplo</span>':''}</span></div></td>${t.cols.map(c=>{const v=c.v(d);return `<td data-l="${c.l}"${v?'':' class="nil"'}>${v||'<span class="mute">—</span>'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function emptyList(type){
 const t=T[type];
 const msg={strains:'Registra cada cepa con su glicerol: descripción, marcadores, plásmidos que porta y en qué hueco del congelador está.',plasmids:'Cada plásmido con su vector base, inserto, marcadores, tamaño y dónde está el ADN.',oligos:'Pega la secuencia y se calculan longitud, %GC y Tm. Las colas en minúsculas se separan de la parte que hibrida.',reagents:'Stock, caducidades y una lista de pedidos que cualquiera del grupo puede completar.'}[type];
 return `<div class="empty">${ic(t.icon)}<h2>Aún no hay ${t.label.toLowerCase()}</h2><p>${msg}</p>${S.canWrite?`<div class="vacts"><button class="btn primary" data-a="new" data-type="${type}">${ic('plus')}${t.nuevo}</button><button class="btn" data-a="go-import" data-type="${type}">${ic('import')}Importar desde Excel</button></div>`:''}</div>`;
}

function dashBody(){
 const d=new Date();const h=d.getHours();const g=h<6?'Buenas noches':h<13?'Buenos días':h<21?'Buenas tardes':'Buenas noches';
 const nm=S.uid&&S.names[S.uid]?pfirst(S.uid):'';
 const total=TK.reduce((a,t)=>a+S.data[t].size,0);
 let out=`<div class="hello"><div><p class="eyebrow">${capf(d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}))}</p><h1>${g}${nm?', '+esc(nm):''}</h1></div></div>`;
 if(hasDemo())out+=`<div class="banner info"><span>Hay datos de ejemplo cargados, marcados como «Ejemplo».</span><span class="sp"></span>${S.canWrite?`<button class="btn sm" data-a="demo-remove">Quitar ejemplos</button>`:''}</div>`;
 if(total<3)out+=welcomeHTML(total);
 out+=`<div class="tiles">${TK.map(t=>{const n=S.data[t].size;const sub=t==='reagents'?(()=>{const k=[...S.data.reagents.values()].filter(r=>r.order||r.stock==='Agotado').length;return k?`${k} por pedir`:'Stock al día'})():(S.uid?`${[...S.data[t].values()].filter(x=>x.owner===S.uid).length} tuyos`:'');return `<a class="tile" href="#${T[t].route}"><span class="t"><span class="cap" style="--cap:var(--c-${T[t].color})"></span>${T[t].label}</span><span class="n">${n}</span><span class="s">${sub}</span></a>`}).join('')}</div>`;

function attentionItems(){
 const items=[];
 for(const r of S.data.reagents.values()){
  if(r.stock==='Agotado')items.push({sev:'bad',w:0,html:`<b>${esc(r.name)}</b> está agotado${r.order?' · en pedidos':''}`,t:'reagents',id:r._id});
  else if(r.stock==='Queda poco')items.push({sev:'warn',w:2,html:`Queda poco de <b>${esc(r.name)}</b>`,t:'reagents',id:r._id});
  else if(r.order)items.push({sev:'info',w:3,html:`<b>${esc(r.name)}</b> en la lista de pedidos`,t:'reagents',id:r._id});
  const n=dayDiff(r.expiry);if(n!=null&&n<0)items.push({sev:'bad',w:1,html:`<b>${esc(r.name)}</b> caducó el ${fmtD(r.expiry)}`,t:'reagents',id:r._id});else if(n!=null&&n<=30)items.push({sev:'warn',w:2,html:`<b>${esc(r.name)}</b> caduca ${n===0?'hoy':`en ${n} días`}`,t:'reagents',id:r._id});
 }
 for(const b of S.data.boxes.values()){const cap=b.rows*b.cols;const n=occ(b._id).size;if(cap&&n/cap>=.9)items.push({sev:n>=cap?'bad':'warn',w:2,html:`Caja <b>${esc(b.name)}</b> ${n>=cap?'llena':'casi llena'} (${n}/${cap})`,box:b._id})}
 return items.sort((a,b)=>a.w-b.w);
}
function attentionCard(){
 const it=attentionItems();
 return `<section class="card"><div class="cardh"><h2>Necesita atención</h2>${it.length?`<span class="tag ${it.some(i=>i.sev==='bad')?'bad':'warn'}">${it.length}</span>`:''}</div>${it.length?it.slice(0,8).map(i=>`<div class="li"><span class="sev ${i.sev}"></span><button class="lk" ${i.box?`data-a="goto-box" data-box="${i.box}"`:`data-a="open" data-type="${i.t}" data-id="${i.id}"`}><span class="small">${i.html}</span></button></div>`).join(''):`<p class="small mute">Todo en orden. Aquí aparecerán reactivos agotados, caducidades próximas y cajas casi llenas.</p>`}</section>`;
}

 const list=Object.entries(groups).map(([fz,bs])=>`<div class="fzg"><p class="eyebrow">${esc(fz)}</p>${bs.map(b=>{const cap=b.rows*b.cols,n=occ(b._id).size,pc=cap?n/cap:0;return `<button class="boxbtn" data-a="box-sel" data-id="${b._id}" aria-pressed="${S.boxSel===b._id}"><span class="r1"><b>${esc(b.name)}</b><span class="mono small mute">${n}/${cap}</span></span><span class="small mute">${esc([b.rack,b.kind,`${b.rows}×${b.cols}`].filter(Boolean).join(' · '))}${b.demo?' · Ejemplo':''}</span><span class="meter"><i class="${pc>=1?'bad':pc>=.9?'warn':''}" style="width:${Math.round(pc*100)}%"></i></span></button>`}).join('')}</div>`).join('');
 let view='<div class="card"><p class="mute">Elige una caja para ver sus posiciones.</p></div>';

/* ---------- protocols ---------- */
function protoShell(){return `<div class="vhead"><div><h1>Protocolos</h1><p class="lede">Versionados: cada cambio guarda la versión anterior.</p></div><div class="vacts">${S.canWrite?`<button class="btn primary" data-a="proto-new">${ic('plus')}Nuevo protocolo</button>`:''}</div></div><div class="fbar"><label class="fsearch">${ic('search')}<input id="flt-proto" type="search" placeholder="Buscar en títulos y pasos…" value="${esc(S.protoQ)}" aria-label="Buscar protocolos"></label></div><div id="vb"></div>`}
function protoBody(){
 const all=[...S.data.protocols.values()];
 if(!all.length)return `<div class="empty">${ic('protocol')}<h2>Aún no hay protocolos</h2><p>Escribe los protocolos del grupo una vez y mantenlos al día. Temperaturas, tiempos y volúmenes se resaltan solos.</p>${S.canWrite?`<div class="vacts"><button class="btn primary" data-a="proto-new">${ic('plus')}Nuevo protocolo</button></div>`:''}</div>`;
 const q=norm(S.protoQ);const ps=all.filter(p=>!q||norm([p.title,p.category,p.body].join(' ')).includes(q)).sort((a,b)=>natCmp(a.category,b.category)||natCmp(a.title,b.title));
 if(!ps.length)return `<div class="empty small"><p>Ningún protocolo coincide.</p></div>`;
 return `<div class="pgrid">${ps.map(p=>`<button class="pcard" data-a="open" data-type="protocols" data-id="${p._id}"><span class="eyebrow">${esc(p.category||'Sin categoría')}${p.demo?' · Ejemplo':''}</span><h3>${esc(p.title)}</h3><p>${esc(String(p.body||'').replace(/[#*`]/g,'').replace(/\s+/g,' ').slice(0,160))}</p><span class="m">v${p.version||1} · ${esc(pfirst(p.updatedBy)||'')} ${rel(p.updatedAt)}</span></button>`).join('')}</div>`;
}
function inl(s){
 return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>')
  .replace(/(\d+(?:[.,]\d+)?(?:\s?[–-]\s?\d+(?:[.,]\d+)?)?\s?(?:°C|ºC|h|min|s|µl|µL|ul|ml|mL|µg|ng|mg|g|rpm|mM|µM|nM|%))(?![\wµ])/g,'<span class="q">$1</span>');
}
function md(src){
 const lines=String(src||'').replace(/\r/g,'').split('\n');let out='',list=null,para=[];
 const fp=()=>{if(para.length){out+=`<p>${inl(para.join(' '))}</p>`;para=[]}};const cl=()=>{if(list){out+=`</${list}>`;list=null}};
 for(const raw of lines){const l=raw.trim();let m;
  if(!l){fp();cl();continue}
  if((m=l.match(/^(#{1,3})\s+(.*)$/))){fp();cl();const n=m[1].length;out+=n===1?`<h2>${inl(m[2])}</h2>`:n===2?`<h3>${inl(m[2])}</h3>`:`<h4>${inl(m[2])}</h4>`;continue}
  if((m=l.match(/^[-*•]\s+(.*)$/))){fp();if(list!=='ul'){cl();out+='<ul>';list='ul'}out+=`<li>${inl(m[1])}</li>`;continue}
  if((m=l.match(/^\d+[.)]\s+(.*)$/))){fp();if(list!=='ol'){cl();out+='<ol>';list='ol'}out+=`<li>${inl(m[1])}</li>`;continue}
  cl();para.push(l)}
 fp();cl();return out;
}
function openProtoForm(id){
 if(!S.canWrite)return;const p=id?S.data.protocols.get(id):null;
 openModal({title:p?`Editar «${p.title}»`:'Nuevo protocolo',values:p?{...p,note:''}:{},
  fields:[{k:'title',l:'Título',req:true},{k:'category',l:'Categoría',ph:'Genética, Microscopía, Rutina…',list:()=>uniq('protocols','category')},
   {k:'body',l:'Protocolo',t:'textarea',rows:16,ph:'## Material\n- …\n\n## Pasos\n1. …',help:'Formato: <span class="mono">## Sección</span>, <span class="mono">- lista</span>, <span class="mono">1. paso</span>, <span class="mono">**negrita**</span>.'},
   ...(p?[{k:'note',l:'Qué cambia en esta versión',ph:'Ajustado el tiempo de incubación'}]:[])],
  onSave:async v=>{
   const nid=id||store.newId('protocols');let doc;
   if(p){const changed=v.title!==p.title||v.body!==p.body||v.category!==p.category;doc={...clean(p)};
    if(changed){doc.history=(p.history||[]).concat([{version:p.version||1,title:p.title,body:p.body,at:p.updatedAt||p.createdAt,by:p.updatedBy||p.createdBy||'',note:p.note||''}]).slice(-30);doc.version=(p.version||1)+1;doc.note=v.note||''}
    Object.assign(doc,{title:v.title,category:v.category,body:v.body,updatedAt:now(),updatedBy:S.uid});
   }else doc={title:v.title,category:v.category,body:v.body,version:1,history:[],note:'',createdAt:now(),createdBy:S.uid,updatedAt:now(),updatedBy:S.uid};
   await store.set('protocols',nid,doc);logActivity(p?'actualizó':'creó','protocols',{title:v.title});toast(p?`Guardada la versión ${doc.version}`:'Protocolo creado');

  }});
}
function protoDrawerHTML(p){

 const opts=[`<option value="">v${p.version||1} · actual</option>`].concat(hist.map((h,i)=>({h,i})).reverse().map(({h,i})=>`<option value="${i}"${vi===i?' selected':''}>v${h.version} · ${fmtD(h.at)}${h.note?' · '+esc(h.note):''}</option>`)).join('');

 <div class="panel-b">${hist.length?`<label class="fld"><span class="lbl">Versión</span><select id="proto-ver">${opts}</select></label>`:''}

function thesisCard(t){
 const ms=[...S.data.milestones.values()].filter(m=>m.thesis===t._id).sort((a,b)=>((a.status==='Hecho')-(b.status==='Hecho'))||natCmp(a.due||'9999',b.due||'9999'));
 const done=ms.filter(m=>m.status==='Hecho').length;
 const st=toDate(t.start),en=toDate(t.end);let tl='';
 if(st&&en&&en>st){const span=en-st;const fr=x=>Math.max(0,Math.min(1,(x-st)/span));const nowF=fr(new Date());const yrs=span/31557600000;const yr=Math.min(Math.max(1,Math.ceil((Date.now()-st)/31557600000)),Math.ceil(yrs));const left=Math.round((en-Date.now())/2629800000);
  tl=`<div class="tline" aria-hidden="true"><div class="bar"><i style="width:${nowF*100}%"></i></div>${ms.filter(m=>toDate(m.due)).map(m=>{const late=m.status!=='Hecho'&&dayDiff(m.due)<0;return `<span class="dot ${m.status==='Hecho'?'done':m.status==='En curso'?'curso':''}${late?' late':''}" style="left:${fr(toDate(m.due))*100}%" title="${esc(m.title)}"></span>`}).join('')}<span class="now" style="left:${nowF*100}%"></span></div><div class="tl-l"><span>${st.getFullYear()}</span><span>${Date.now()<st?'Aún no ha empezado':Date.now()>en?'Fecha prevista superada':`Año ${yr} de ${Math.round(yrs)} · quedan ${left} meses`}</span><span>${en.getFullYear()}</span></div>`}
 else tl=`<p class="small mute" style="margin-top:10px">${S.canWrite?`Añade inicio y fin previsto para ver la línea de tiempo. <button class="link" data-a="thesis-edit" data-id="${t._id}">Añadir fechas</button>`:'Sin fechas.'}</p>`;
 return `<article class="card"><header class="th-h"><div><p class="eyebrow">${esc(t.label||'Sin nombre')}</p><h2>${esc(t.title||'Título por definir')}</h2></div>${S.canWrite?`<button class="btn sm ghost" data-a="thesis-edit" data-id="${t._id}">${ic('edit')}Editar</button>`:''}</header>${tl}
 <div class="ms-head"><h3>Hitos</h3><span class="small mute">${done}/${ms.length} hechos</span>${S.canWrite?`<button class="btn sm" data-a="ms-new" data-id="${t._id}">${ic('plus')}Hito</button>`:''}</div>
 ${ms.length?ms.map(msRow).join(''):`<p class="small mute">Sin hitos. Por ejemplo: plan de investigación, informes anuales, artículos, estancias, congresos y depósito.</p>`}</article>`;
}

async function saveMember(prefix,role,name){
 prefix=norm(prefix).toUpperCase().replace(/[^A-Z0-9]/g,'');
 if(!/^[A-Z][A-Z0-9]{1,4}$/.test(prefix))return 'Las iniciales deben tener de 2 a 5 letras.';
 for(const [u,x] of S.data.members)if(u!==S.uid&&x.prefix===prefix)return `${prefix} ya lo usa ${pname(u)}.`;
 const m=meM();const nm=String(name||(m&&m.name)||S.authName||'').trim();if(!nm)return 'Escribe tu nombre.';await store.set('members',S.uid,{prefix,role:role||'',name:nm,email:S.email||'',joined:(m&&m.joined)||now()});
 if(!m)logActivity('se unió al grupo','members',null,' ');
 return null;
}

const SYN={code:/^(c[oó]d(igo)?|id|code|n[º°o]\.?|num(ero)?|ref(erencia)?( interna)?|#)$/,
 _box:/^(caja|box|gradilla)/,_pos:/^(pos(ici[oó]n)?|position|hueco|well|celda)$/,
 species:/especie|species|organismo|organism/,genotype:/genotipo|genotype|descripci[oó]n|description/,parent:/parental|parent|background/,plasmids:/^pl[aá]smidos?( que porta)?$|^plasmids?$/,
 res:/resist|antibi[oó]tico|antibiotic|marcador|marker|selecci[oó]n/,medium:/^medio|medium|^media$/,temp:/temp/,source:/origen|source|procedencia|fuente|referencia/,status:/^estado|status/,notes:/notas?|notes?|observaciones|comentarios?|comments?/,
 backbone:/backbone|vector/,insert:/inserto|insert|construcci[oó]n/,size:/tama[nñ]o|size|longitud|length|\bpb\b|\bbp\b/,ori:/\bori\b|origen de replicaci/,host:/hu[eé]sped|host|cepa portadora/,verified:/verificad|secuenciad|verified|sequenced/,seqUrl:/mapa|map|url|enlace|link/,method:/m[eé]todo|method/,
 seq:/^secuencia|sequence|^seq|5.?.?3/,target:/diana|target|^gen$|^gene$|regi[oó]n/,purpose:/^uso|purpose|aplicaci[oó]n|finalidad/,partner:/pareja|partner|pair/,plasmid:/pl[aá]smido|plasmid/,
 supplier:/proveedor|supplier|casa comercial|marca|vendor|fabricante/,conc:/concentraci[oó]n|^conc/,cat:/cat[aá]logo|catalog/,cas:/\bcas\b/,amount:/cantidad|amount|quantity|formato/,where:/ubicaci[oó]n|lugar|location|d[oó]nde|estante|nevera/,stock:/stock|existencias/,expiry:/caducidad|expir|vence/,opened:/abierto|apertura|opened/,order:/pedir|pedido|order/,
 name:/^(nombre|name|cepa|strain|pl[aá]smido|plasmid|oligo|primer|cebador|reactivo|producto|designaci[oó]n)$/};
function impTargets(type){const tg=[['code','Código']];if(type!=='reagents')tg.push(['_box','Caja'],['_pos','Posición en la caja']);T[type].fields.filter(f=>f.t!=='loc').forEach(f=>tg.push([f.k,f.l]));return tg}
function guessMap(type,headers){
 const tg=impTargets(type).map(x=>x[0]);const order=['code','_box','_pos',...tg.filter(k=>!['code','_box','_pos','name'].includes(k)),'name'];
 const used=new Set();return headers.map(h=>{const n=norm(h);if(!n)return '';for(const k of order){if(used.has(k))continue;const re=SYN[k];if(re&&re.test(n)){used.add(k);return k}}return ''});
}
function parseCSV(s,d){const rows=[];let row=[],f='',q=false;for(let i=0;i<s.length;i++){const c=s[i];if(q){if(c==='"'){if(s[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else{if(c==='"'&&f==='')q=true;else if(c===d){row.push(f);f=''}else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else f+=c}}if(f!==''||row.length){row.push(f);rows.push(row)}return rows}
function parseText(txt){txt=String(txt||'').replace(/^﻿/,'').replace(/\r\n?/g,'\n');const first=txt.split('\n')[0]||'';const d=first.includes('\t')?'\t':((first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',');return parseCSV(txt,d).map(r=>r.map(c=>String(c).trim())).filter(r=>r.some(c=>c!==''))}
function loadXLSX(){return new Promise((res,rej)=>{if(window.XLSX)return res(window.XLSX);const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>res(window.XLSX);s.onerror=()=>rej(new Error('x'));document.head.appendChild(s)})}
function sheetRows(XLSX,ws){return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''}).map(r=>r.map(v=>v instanceof Date?isoDay(v):String(v).trim())).filter(r=>r.some(c=>c!==''))}
function impState(){return S.imp||(S.imp={step:1,type:'strains',raw:'',headers:[],rows:[],map:[],skipDup:true,mkBoxes:true,owner:null,wb:null,sheet:0,result:null,running:false,done:0,total:0,err:''})}
function setImpRows(rows){const I=impState();if(rows.length<2){I.err='No se encontraron filas con datos debajo de los títulos.';renderBody();return}I.err='';I.headers=rows[0].map((h,i)=>h||`Columna ${i+1}`);I.rows=rows.slice(1);I.map=guessMap(I.type,I.headers);I.step=2;renderBody()}
async function readImpFile(file){
 const I=impState();I.err='';
 try{
  if(/\.(xlsx|xls|xlsm|ods)$/i.test(file.name)){const XLSX=await loadXLSX();const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});I.wb=wb;I.sheet=0;setImpRows(sheetRows(XLSX,wb.Sheets[wb.SheetNames[0]]))}
  else{I.wb=null;setImpRows(parseText(await file.text()))}
 }catch(_){I.err='No se pudo leer el archivo. Prueba a guardarlo como CSV o a pegar las celdas.';renderBody()}
}
function impShell(){return `<div class="vhead"><div><h1>Importar</h1><p class="lede">Trae vuestras listas de gliceroles, plásmidos, oligos o reactivos desde Excel, CSV o copiando y pegando.</p></div></div><div id="vb"></div>`}
function impBody(){
 const I=impState();if(!S.canWrite)return `<div class="empty"><p>Necesitas permiso de edición para importar.</p></div>`;
 const seg=`<div class="seg" role="group" aria-label="Tipo de registro">${TK.map(t=>`<button data-a="imp-type" data-type="${t}" aria-pressed="${I.type===t}"${I.step>1?' disabled':''}>${T[t].label}</button>`).join('')}</div>`;
 if(I.step===1)return `<div class="stack">${seg}
  <div class="drop" id="imp-drop">${ic('import')}<b>Sube un archivo .xlsx, .xls, .csv o .tsv</b><span class="small mute">La primera fila debe tener los nombres de las columnas.</span><input id="imp-file" type="file" accept=".xlsx,.xls,.xlsm,.ods,.csv,.tsv,.txt"></div>

   <li>No hace falta preparar las columnas: se reconocen títulos como «Cepa», «Genotipo», «Resistencia», «Caja» o «Posición».</li>
   <li>Los marcadores se leen escritos como «Km, Gm», «Kan/Amp» o «kanamicina».</li>
   <li>Si una fila no tiene código, se le asigna uno con tus iniciales.</li>
   <li>Las cajas que no existan se pueden crear al importar (9×9).</li></ul></section></div>`;
 if(I.step===2){
  const tg=impTargets(I.type);const sample=i=>{for(const r of I.rows){if(r[i])return r[i]}return ''};
  const mapped=I.map.filter(Boolean);const dup=countDups(I);
  const blocked=!mapped.includes('name')||(I.type==='oligos'&&!mapped.includes('seq'));
  return `<div class="stack">${seg}
  ${I.wb&&I.wb.SheetNames.length>1?`<label class="fld"><span class="lbl">Hoja</span><select id="imp-sheet">${I.wb.SheetNames.map((n,i)=>`<option value="${i}"${I.sheet===i?' selected':''}>${esc(n)}</option>`).join('')}</select></label>`:''}
  <section class="card"><div class="cardh"><h2>Empareja las columnas</h2><span class="small mute">${I.rows.length} filas</span></div>
  <div class="scrollx" style="border:0"><table class="maptbl"><thead><tr><th>Columna del archivo</th><th>Ejemplo</th><th>Guardar como</th></tr></thead><tbody>${I.headers.map((h,i)=>`<tr><td><b>${esc(h)}</b></td><td class="ex">${esc(sample(i))}</td><td><select class="imp-map" data-i="${i}" aria-label="Destino de ${esc(h)}"><option value="">No importar</option>${tg.map(([k,l])=>`<option value="${k}"${I.map[i]===k?' selected':''}>${esc(l)}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div></section>
  <section class="card opts"><h2>Opciones</h2>
   <label><input type="checkbox" id="imp-skip"${I.skipDup?' checked':''}> Saltar filas cuyo código ya existe (${dup} coinciden)</label>
   ${I.type!=='reagents'?`<label><input type="checkbox" id="imp-mkbox"${I.mkBoxes?' checked':''}> Crear las cajas que no existan (9×9)</label>`:''}
   <label style="flex-wrap:wrap">Responsable de lo importado: <select id="imp-owner" style="width:auto">${memberIds().map(u=>`<option value="${esc(u)}"${(I.owner||S.uid)===u?' selected':''}>${esc(pname(u))}</option>`).join('')}</select></label>
  </section>
  ${!mapped.includes('name')?`<p class="ferr">Empareja al menos una columna con «${esc(T[I.type].fields[0].l)}».</p>`:''}
  ${I.type==='oligos'&&!mapped.includes('seq')?`<p class="ferr">Empareja la columna de secuencia.</p>`:''}
  <section class="card"><h2>Vista previa</h2><div class="rlinks" style="margin-top:8px">${I.rows.slice(0,5).map(r=>{const v=rowVals(I,r);return `<div class="small"><span class="mono">${esc(v.code||'(código nuevo)')}</span> · <b>${esc(v.name||'—')}</b>${v.species?` · <i>${esc(v.species)}</i>`:''}${v._box?` · ${esc(v._box)} ${esc(v._pos||'')}`:''}${v.seq?` · <span class="mono">${esc(String(v.seq).slice(0,30))}</span>`:''}</div>`}).join('')}</div></section>
  <div class="vacts"><button class="btn" data-a="imp-back">${ic('back')}Volver</button><button class="btn primary" data-a="imp-run"${blocked?' disabled':''}>Importar ${Math.max(0,I.rows.length-(I.skipDup?dup:0))} ${T[I.type].label.toLowerCase()}</button></div></div>`;
 }
 if(I.running)return `<section class="card stack"><h2>Importando…</h2><div class="progress"><i id="imp-bar" style="width:${I.total?Math.round(I.done/I.total*100):0}%"></i></div><p class="small mute" id="imp-prog">${I.done} de ${I.total}</p></section>`;
 const r=I.result||{};
 return `<section class="card stack"><h2>Importación terminada</h2><p>${r.ok||0} ${T[I.type].label.toLowerCase()} importados${r.skipped?` · ${r.skipped} omitidos por código repetido`:''}${r.boxes?` · ${r.boxes} cajas creadas`:''}${r.noPos?` · ${r.noPos} sin posición (hueco ocupado o no válido)`:''}${r.failed?` · ${r.failed} filas sin nombre o con error`:''}.</p>${r.notes?`<p class="small mute">Lo que no se pudo enlazar (registros que no encontré por código o nombre, valores sin reconocer) quedó escrito en las notas de cada registro.</p>`:''}<div class="vacts"><a class="btn primary" href="#${T[I.type].route}">Ver ${T[I.type].label.toLowerCase()}</a><button class="btn" data-a="imp-reset">Importar otra lista</button></div></section>`;
}
function rowVals(I,r){const v={};I.map.forEach((k,i)=>{if(k&&r[i]!=null&&r[i]!=='')v[k]=v[k]?v[k]+'; '+r[i]:r[i]});return v}
function countDups(I){const ci=I.map.indexOf('code');if(ci<0)return 0;const ex=new Set([...S.data[I.type].values()].map(d=>norm(d.code)));return I.rows.filter(r=>r[ci]&&ex.has(norm(r[ci]))).length}
function parseNum(s){s=String(s).replace(/\s/g,'');if(!s)return null;const mult=/kb/i.test(s)?1000:1;s=s.replace(/[a-zA-Zµ°]+/g,'');if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');s=s.replace(',','.');const n=parseFloat(s);return isFinite(n)?Math.round(n*mult*1000)/1000:null}
function parseDate(s){s=String(s).trim();if(!s)return '';if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);let m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);if(m){let y=+m[3];if(y<100)y+=2000;const d=new Date(y,+m[2]-1,+m[1]);return isNaN(d)?'':isoDay(d)}if(/^\d{5}$/.test(s))return isoDay(new Date(Math.round((+s-25569)*86400000)));return ''}
function matchOpt(opts,s){const n=norm(s);if(!n)return null;for(const o of opts)if(norm(o)===n)return o;for(const o of opts)if(norm(o).startsWith(n)||n.startsWith(norm(o)))return o;return null}
function findRef(type,s){const n=norm(s);if(!n)return null;for(const d of S.data[type].values())if(norm(d.code)===n)return d._id;for(const d of S.data[type].values())if(norm(d.name)===n)return d._id;return null}
async function runImport(){
 const I=impState();const t=T[I.type];const fields=Object.fromEntries(t.fields.map(f=>[f.k,f]));
 const owner=I.owner||S.uid;const existing=new Set([...S.data[I.type].values()].map(d=>norm(d.code)));const madeCodes=[];const seen=new Set();
 const boxByName=new Map([...S.data.boxes.values()].map(b=>[norm(b.name),b]));const usedPos=new Set();
 const res={ok:0,skipped:0,boxes:0,noPos:0,failed:0,notes:0};
 I.step=3;I.running=true;I.total=I.rows.length;I.done=0;renderBody();
 for(const r of I.rows){
  I.done++;const v=rowVals(I,r);
  try{
   if(!v.name){res.failed++;continue}
   let code=(v.code||'').trim();
   if(code&&(existing.has(norm(code))||seen.has(norm(code)))){if(I.skipDup){res.skipped++;continue}code=''}
   if(!code)code=nextCode(I.type,myPrefix(),madeCodes);
   seen.add(norm(code));madeCodes.push(code);
   const doc={code,owner,createdAt:now(),createdBy:S.uid,updatedAt:now(),updatedBy:S.uid};const extra=[];
   for(const [k,raw] of Object.entries(v)){
    const f=fields[k];if(!f||k==='code')continue;
    if(f.t==='chips'){const ok=[],bad=[];String(raw).split(/[,;\/+|\s]+/).filter(Boolean).forEach(x=>{const c=MARK_ALIAS[norm(x).replace(/[^a-z]/g,'')]||(MARKN[x]?x:null);c?(!ok.includes(c)&&ok.push(c)):bad.push(x)});doc[k]=ok;if(bad.length)extra.push(`${f.l} sin reconocer: ${bad.join(', ')}`)}
    else if(f.t==='refs'){const ids=[],bad=[];String(raw).split(/[,;+]/).map(s=>s.trim()).filter(Boolean).forEach(x=>{const id=findRef(f.ref,x);id?ids.push(id):bad.push(x)});doc[k]=ids;if(bad.length)extra.push(`${f.l}: ${bad.join(', ')}`)}
    else if(f.t==='ref1'){const id=findRef(f.ref,raw);if(id)doc[k]=id;else extra.push(`${f.l}: ${raw}`)}
    else if(f.t==='number'){const n=parseNum(raw);if(n!=null)doc[k]=n}
    else if(f.t==='date'){const d=parseDate(raw);if(d)doc[k]=d}
    else if(f.t==='bool'){doc[k]=/^(s[ií]|yes|y|x|1|true|pedir)$/i.test(String(raw).trim())}
    else if(f.t==='select'){const o=matchOpt(f.opts,raw)||(k==='stock'?(/poco|bajo|low/i.test(raw)?'Queda poco':/agot|no hay|^0$|out/i.test(raw)?'Agotado':'Suficiente'):k==='verified'?(/^(s[ií]|yes|ok|x|1)$/i.test(raw)?'Sí':/parc/i.test(raw)?'Parcial':'No'):null);if(o)doc[k]=o;else extra.push(`${f.l}: ${raw}`)}
    else if(f.t==='seq')doc[k]=String(raw).replace(/[^A-Za-z]/g,'');
    else doc[k]=String(raw);
   }
   if(!doc.status&&I.type!=='reagents')doc.status=t.status[0];
   if(I.type==='reagents'&&!doc.stock)doc.stock='Suficiente';
   if(v._box){let b=boxByName.get(norm(v._box));
    if(!b&&I.mkBoxes){const id=store.newId('boxes');b={name:String(v._box),freezer:'Sin congelador asignado',rack:'',rows:9,cols:9,kind:boxKind(I.type),createdAt:now(),createdBy:S.uid,updatedAt:now(),updatedBy:S.uid};await store.set('boxes',id,b);b._id=id;boxByName.set(norm(b.name),b);res.boxes++}
    if(b){let p=parsePos(v._pos,b);const key=b._id+'|'+p;if(p&&(occ(b._id).has(p)||usedPos.has(key)))p=null;if(p){doc.loc={box:b._id,pos:p};usedPos.add(key)}else res.noPos++}
    else res.noPos++;
   }
   if(extra.length){doc.notes=[doc.notes,...extra].filter(Boolean).join('\n');res.notes++}
   await store.set(I.type,store.newId(I.type),doc);res.ok++;
  }catch(e){res.failed++;if(e&&e.code==='quota_exceeded'){toast('El espacio de datos está lleno.');break}}
  if(I.done%5===0||I.done===I.total){const bar=$('#imp-bar'),pr=$('#imp-prog');if(bar)bar.style.width=Math.round(I.done/I.total*100)+'%';if(pr)pr.textContent=`${I.done} de ${I.total}`}
 }
 I.running=false;I.result=res;if(res.ok)logActivity('importó',I.type,null,`${res.ok} ${t.label.toLowerCase()}`);renderBody();
}

/* ---------- export ---------- */
function csvCell(v){const s=String(v??'');return /[;"\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s}
function toCSV(type){
 const t=T[type];const head=['Código'];
 t.fields.forEach(f=>{if(f.t==='loc')head.push('Caja','Posición');else head.push(f.l)});head.push('Responsable','Actualizado');
 const rows=[...S.data[type].values()].sort((a,b)=>natCmp(a.code,b.code)).map(d=>{const r=[d.code];t.fields.forEach(f=>{const v=d[f.k];
  if(f.t==='loc'){const [b,p]=locText(v);r.push(b,p)}else if(f.t==='chips')r.push((v||[]).join(', '));else if(f.t==='refs')r.push((v||[]).map(i=>codeOf(f.ref,i)).filter(Boolean).join(', '));else if(f.t==='ref1')r.push(v?codeOf(f.ref,v):'');else if(f.t==='bool')r.push(v?'Sí':'No');else r.push(v??'')});
  r.push(d.owner?pname(d.owner):'',d.updatedAt?d.updatedAt.slice(0,10):'');return r});
 return '﻿'+[head,...rows].map(r=>r.map(csvCell).join(';')).join('\r\n');
}

function detailBody(type,d){

function readForm(fields){
 const v={};
 for(const f of fields){const id='f-'+f.k;let x;
  if(f.t==='chips'||f.t==='refs')x=$$(`#mform [name="${id}"]:checked`).map(e=>e.value);
  else if(f.t==='bool')x=!!($('#'+id)||{}).checked;
  else if(f.t==='loc'){const b=($('#f-loc-box')||{}).value||'',p=($('#f-loc-pos')||{}).value||'';if(b&&!p)throw new Error('Elige el hueco de la caja o deja la ubicación en «Sin ubicar».');x=b?{box:b,pos:p}:null}

  if(f.req&&(x===''||x==null||(Array.isArray(x)&&!x.length)))throw new Error(`Falta: ${f.l}.`);
  v[f.k]=x}
 return v;
}

function gsResults(q){
 const out=[];if(!q.trim())return out;
 for(const t of TK){const f={q,owner:'all',status:'',res:''};const ds=[...S.data[t].values()].filter(d=>matchItem(t,d,f)).sort((a,b)=>natCmp(a.code,b.code)).slice(0,6);if(ds.length)out.push({g:T[t].label,items:ds.map(d=>({type:t,id:d._id,color:T[t].color,code:d.code,name:d.name}))})}
 const nq=norm(q);
 const ps=[...S.data.protocols.values()].filter(p=>norm([p.title,p.category,p.body].join(' ')).includes(nq)).slice(0,5);if(ps.length)out.push({g:'Protocolos',items:ps.map(p=>({type:'protocols',id:p._id,color:'other',code:'',name:p.title}))});
 const bs=[...S.data.boxes.values()].filter(b=>norm([b.name,b.freezer,b.rack].join(' ')).includes(nq)).slice(0,5);if(bs.length)out.push({g:'Cajas',items:bs.map(b=>({type:'boxes',id:b._id,color:'other',code:'',name:b.name}))});
 return out;
}
