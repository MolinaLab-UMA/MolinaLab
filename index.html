const LAZY={};
function lazySub(c){if(LAZY[c])return;LAZY[c]=1;store.sub(c,m=>{S.data[c]=m;S.got.add(c);dirty(c)})}
const GEL_KIND=[['agarosa','Agarosa (ADN)'],['page','Poliacrilamida (proteína)']];
const GEL_UNIT={agarosa:'pb',page:'kDa'};
const gelDef=()=>({title:'',kind:'agarosa',exp:'',date:new Date().toISOString().slice(0,10),notes:'',strains:[],plasmids:[],
 adj:{rot:0,cl:0,cr:0,ct:0,cb:0,bright:100,contrast:100,invert:false,gray:true},
 lanes:{n:8,x0:0.08,x1:0.92,angle:0,show:true,labels:[]},
 mk:{unit:'pb',show:true,items:[]},
 style:{bg:'white',fs:100,panel:'',title:true}});
function gelState(){if(S.gel)return S.gel;S.gel=null;return null}
function gelOpen(id){
 if(id==='nuevo'){S.gel={_new:true,...gelDef(),img:null,w:0,h:0};S.gelImg=null;return}
 const d=S.data.gels.get(id);if(!d)return;
 S.gel=JSON.parse(JSON.stringify({...gelDef(),...clean(d),_id:id}));S.gelImg=null;S.gelBusy=true;
 store.get('gelimgs',id).then(x=>{S.gelBusy=false;if(x&&x.img){S.gel.img=x.img;gelLoadImg()}else{S.gelErr='No se ha podido cargar la imagen original.';dirty('gels')}}).catch(()=>{S.gelBusy=false;S.gelErr='No se ha podido cargar la imagen original.';dirty('gels')});
}
let GIMG=null;
function gelLoadImg(){
 const G=S.gel;if(!G||!G.img){GIMG=null;gelPaint();return}
 const im=new Image();im.onload=()=>{GIMG=im;if(!G.w){G.w=im.naturalWidth;G.h=im.naturalHeight}gelPaint()};im.onerror=()=>{GIMG=null;gelPaint()};im.src=G.img;
}
async function gelPickFile(file){
 if(!file)return;
 if(!/^image\//.test(file.type)){toast('Eso no es una imagen.');return}
 try{
  const url=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(file)});
  const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
  const G=S.gel;const r=gelShrink(im,2000,0.9,900000);
  G.img=r.url;G.w=r.w;G.h=r.h;G.thumb=gelShrink(im,320,0.7,60000).url;
  if(!G.title)G.title=file.name.replace(/\.[a-z]+$/i,'').slice(0,80);
  gelLoadImg();_renderBody();
  if(r.big)toast('La foto se ha reducido para que quepa en la base de datos.');
 }catch(e){toast('No se ha podido leer la imagen.')}
}
function gelShrink(im,max,q,limit){
 let w=im.naturalWidth,h=im.naturalHeight;const sc=Math.min(1,max/Math.max(w,h));
 w=Math.max(1,Math.round(w*sc));h=Math.max(1,Math.round(h*sc));
 const c=document.createElement('canvas');c.width=w;c.height=h;
 const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
 let url=c.toDataURL('image/jpeg',q),big=false;
 let qq=q;
 while(url.length>limit&&qq>0.4){qq-=0.1;url=c.toDataURL('image/jpeg',qq);big=true}
 while(url.length>limit&&w>400){w=Math.round(w*0.8);h=Math.round(h*0.8);c.width=w;c.height=h;const y=c.getContext('2d');y.fillStyle='#fff';y.fillRect(0,0,w,h);y.drawImage(im,0,0,w,h);url=c.toDataURL('image/jpeg',qq);big=true}
 return {url,w,h,big};
}
function gelCrop(G){
 const a=G.adj,w=G.w,h=G.h;
 const x=Math.round(a.cl*w),y=Math.round(a.ct*h);
 const cw=Math.max(8,Math.round((1-a.cl-a.cr)*w)),ch=Math.max(8,Math.round((1-a.ct-a.cb)*h));
 return {x,y,w:cw,h:ch};
}
function gelBase(G){
 const c=document.createElement('canvas');c.width=G.w;c.height=G.h;const x=c.getContext('2d');
 x.fillStyle='#fff';x.fillRect(0,0,G.w,G.h);
 if(GIMG){x.save();x.translate(G.w/2,G.h/2);x.rotate((G.adj.rot||0)*Math.PI/180);x.drawImage(GIMG,-G.w/2,-G.h/2,G.w,G.h);x.restore()}
 return c;
}
function gelRender(G,scale){
 const cr=gelCrop(G),st=G.style,dark=st.bg==='black';
 const iw=Math.round(cr.w*scale),ih=Math.round(cr.h*scale);
 const fs=Math.max(8,Math.round(ih/24*(st.fs||100)/100));
 const pad=Math.round(fs*0.7);
 const mkOn=G.mk.show&&G.mk.items.length;
 const laOn=G.lanes.show&&G.lanes.n>0;
 const ang=(G.lanes.angle||0)*Math.PI/180;
 const mL=pad+(mkOn?Math.round(fs*3.4):0);
 let mT=pad;
 if(laOn)mT+=ang?Math.round(fs*4.2):Math.round(fs*1.9);
 if(st.panel)mT=Math.max(mT,pad+Math.round(fs*2.2));
 const mR=pad,mB=pad+(st.title&&G.title?Math.round(fs*2):0);
 const c=document.createElement('canvas');c.width=mL+iw+mR;c.height=mT+ih+mB;
 const x=c.getContext('2d');
 x.fillStyle=dark?'#000':'#fff';x.fillRect(0,0,c.width,c.height);
 const base=gelBase(G);
 const f=[];const a=G.adj;
 if(a.gray)f.push('grayscale(1)');
 if(a.bright!==100)f.push(`brightness(${a.bright}%)`);
 if(a.contrast!==100)f.push(`contrast(${a.contrast}%)`);
 if(a.invert)f.push('invert(1)');
 x.save();if(f.length)x.filter=f.join(' ');
 x.imageSmoothingQuality='high';
 x.drawImage(base,cr.x,cr.y,cr.w,cr.h,mL,mT,iw,ih);
 x.restore();
 const ink=dark?'#fff':'#000';
 x.fillStyle=ink;x.strokeStyle=ink;
 const FF=`${fs}px "Helvetica Neue",Helvetica,Arial,sans-serif`;
 x.font=FF;x.textBaseline='alphabetic';
 if(laOn){
  const n=G.lanes.n;
  for(let i=0;i<n;i++){
   const t=n>1?i/(n-1):0.5;
   const px=mL+(G.lanes.x0+(G.lanes.x1-G.lanes.x0)*t)*iw;
   const lab=(G.lanes.labels[i]||'').trim()||String(i+1);
   x.save();x.translate(px,mT-Math.round(fs*0.55));
   if(ang){x.rotate(-ang);x.textAlign='left';x.fillText(lab,0,0)}
   else{x.textAlign='center';x.fillText(lab,0,0)}
   x.restore();
  }
 }
 if(mkOn){
  x.textAlign='right';x.lineWidth=Math.max(1,Math.round(fs*0.08));
  for(const it of G.mk.items){
   const py=mT+it.y*ih;
   x.beginPath();x.moveTo(mL-Math.round(fs*0.5),py);x.lineTo(mL-Math.round(fs*0.1),py);x.stroke();
   x.fillText(String(it.v||''),mL-Math.round(fs*0.7),py+Math.round(fs*0.35));
  }
  x.save();x.translate(mL-Math.round(fs*0.7),mT-Math.round(fs*0.45));x.textAlign='right';
  x.font=`${Math.round(fs*0.85)}px "Helvetica Neue",Helvetica,Arial,sans-serif`;
  x.fillText(G.mk.unit||'',0,0);x.restore();
 }
 if(st.panel){x.font=`700 ${Math.round(fs*1.5)}px "Helvetica Neue",Helvetica,Arial,sans-serif`;x.textAlign='left';x.fillText(st.panel,pad,pad+Math.round(fs*1.3))}
 if(st.title&&G.title){x.font=FF;x.textAlign='left';x.fillText(G.title,mL,mT+ih+Math.round(fs*1.4))}
 return {canvas:c,mL,mT,iw,ih,fs};
}
function gelPaint(){
 const host=$('#gelc');if(!host||!S.gel)return;
 const G=S.gel;
 if(!G.img){host.innerHTML='<p class="mute small">Elige una foto del gel para empezar.</p>';return}
 const maxW=Math.max(240,Math.min(host.clientWidth||600,900));
 const cr=gelCrop(G);const sc=Math.min(1,maxW/ (cr.w*1.25));
 const r=gelRender(G,sc||0.5);
 r.canvas.id='gelcv';r.canvas.style.width='100%';r.canvas.style.height='auto';
 r.canvas.setAttribute('role','img');r.canvas.setAttribute('aria-label','Vista del gel anotado');
 host.innerHTML='';host.appendChild(r.canvas);
 GEOM=r;
}
let GEOM=null;
function gelClick(ev){
 const G=S.gel;if(!G||!G.img||!GEOM)return;
 const cv=$('#gelcv');if(!cv)return;
 const b=cv.getBoundingClientRect();
 const sx=cv.width/b.width;
 const px=(ev.clientX-b.left)*sx,py=(ev.clientY-b.top)*sx;
 const y=(py-GEOM.mT)/GEOM.ih;
 if(y<-0.02||y>1.02)return;
 G.mk.items.push({y:Math.min(1,Math.max(0,y)),v:''});
 G.mk.items.sort((a,b)=>a.y-b.y);
 G.mk.show=true;_renderBody();
 setTimeout(()=>{const list=$$('[data-gelmk="v"]');const i=G.mk.items.findIndex(z=>!z.v);const el=list[i<0?list.length-1:i];el&&el.focus()},30);
}
async function gelSave(){

  w:G.w,h:G.h,adj:G.adj,lanes:G.lanes,mk:G.mk,style:G.style,thumb:G.thumb||'',
  updatedAt:now(),updatedBy:S.uid};
 if(isNew){doc.createdAt=now();doc.createdBy=S.uid;doc.owner=S.uid}else{doc.createdAt=G.createdAt||now();doc.createdBy=G.createdBy||S.uid;doc.owner=G.owner||S.uid}

/* --- Secuenciación (Plasmidsaurus) --- */
const sqClean=t=>String(t||'').toUpperCase().replace(/[^ACGTN]/g,'');
function sqParse(text){
 const t=String(text||'');
 if(/^\s*LOCUS\s/m.test(t)){
  const i=t.search(/^ORIGIN/m);
  if(i>=0)return {name:((t.match(/^LOCUS\s+(\S+)/m)||[])[1]||''),seq:sqClean(t.slice(i).split('\n').slice(1).join('\n'))};
 }
 if(/^\s*>/.test(t)){const L=t.split(/\r?\n/);return {name:L[0].replace(/^>/,'').trim().slice(0,120),seq:sqClean(L.slice(1).join(''))}}
 return {name:'',seq:sqClean(t)};
}
function sqIndex(s,k){const m=new Map();for(let i=0;i+k<=s.length;i++){const q=s.slice(i,i+k);m.set(q,m.has(q)?-1:i)}return m}
function sqAnchors(exp,obs,k,stride){
 const idx=sqIndex(obs,k),out=[];
 for(let i=0;i+k<=exp.length;i+=stride){const p=idx.get(exp.slice(i,i+k));if(p>=0)out.push([i,p])}
 return out;
}
function sqChain(an){
 const out=[];let lastE=-1,lastO=-1;
 for(const [e,o] of an){if(e>lastE&&o>lastO){out.push([e,o]);lastE=e;lastO=o}}
 return out;
}
function sqAlign(a,b){
 const n=a.length,m=b.length;
 if(n===0&&m===0)return [];
 if((n+1)*(m+1)>900000)return null;
 const W=m+1,D=new Int32Array((n+1)*W),P=new Uint8Array((n+1)*W);
 for(let i=1;i<=n;i++){D[i*W]=-2*i;P[i*W]=1}
 for(let j=1;j<=m;j++){D[j]=-2*j;P[j]=2}
 for(let i=1;i<=n;i++){const ai=a[i-1];
  for(let j=1;j<=m;j++){
   const d=D[(i-1)*W+(j-1)]+(ai===b[j-1]?1:-1),u=D[(i-1)*W+j]-2,l=D[i*W+(j-1)]-2;
   let best=d,p=0;if(u>best){best=u;p=1}if(l>best){best=l;p=2}
   D[i*W+j]=best;P[i*W+j]=p;
  }}
 const ops=[];let i=n,j=m;
 while(i>0||j>0){const p=(i>0&&j>0)?P[i*W+j]:(i>0?1:2);
  if(p===0){ops.push([a[i-1],b[j-1]]);i--;j--}
  else if(p===1){ops.push([a[i-1],'-']);i--}
  else{ops.push(['-',b[j-1]]);j--}}
 return ops.reverse();
}
function sqFit(a,b){
 const n=a.length,m=b.length;
 if(n===0||m===0||(n+1)*(m+1)>900000)return null;
 const W=m+1,D=new Int32Array((n+1)*W),P=new Uint8Array((n+1)*W);
 for(let i=1;i<=n;i++){D[i*W]=-2*i;P[i*W]=1}
 for(let j=1;j<=m;j++){D[j]=0;P[j]=2}
 for(let i=1;i<=n;i++){const ai=a[i-1];
  for(let j=1;j<=m;j++){
   const d=D[(i-1)*W+(j-1)]+(ai===b[j-1]?1:-1),u=D[(i-1)*W+j]-2,l=D[i*W+(j-1)]-2;
   let best=d,p=0;if(u>best){best=u;p=1}if(l>best){best=l;p=2}
   D[i*W+j]=best;P[i*W+j]=p;
  }}
 let je=0,bs=-1e9;for(let j=0;j<=m;j++){if(D[n*W+j]>=bs){bs=D[n*W+j];je=j}}
 const ops=[];let i=n,j=je;
 while(i>0){const p=(j>0)?P[i*W+j]:1;
  if(p===0){ops.push([a[i-1],b[j-1]]);i--;j--}
  else if(p===1){ops.push([a[i-1],'-']);i--}
  else{ops.push(['-',b[j-1]]);j--}}
 ops.reverse();return {ops,start:j,end:je};
}
function sqOpsToDiffs(ops,base){
 const out=[];let e=base,cur=null;
 const push=()=>{if(cur){out.push(cur);cur=null}};
 for(const [x,y] of ops){
  if(x===y){push();e++;continue}
  const t=x==='-'?'ins':y==='-'?'del':'sub';
  if(cur&&cur.t===t&&cur.end===e){cur.ref+=x==='-'?'':x;cur.alt+=y==='-'?'':y;cur.end=e+(x==='-'?0:1)}
  else{push();cur={t,pos:e+1,end:e+(x==='-'?0:1),ref:x==='-'?'':x,alt:y==='-'?'':y}}
  if(x!=='-')e++;
 }
 push();return out;
}
function sqCompare(expRaw,obsRaw,circular){
 const exp=sqClean(expRaw),obs0=sqClean(obsRaw);
 const o={exp,diffs:[],notes:[],err:null};
 if(exp.length<20||obs0.length<20){o.err='Las dos secuencias tienen que tener al menos 20 bases.';return o}
 const k=Math.min(24,Math.max(14,Math.floor(Math.min(exp.length,obs0.length)/12)));
 const tries=[{s:obs0,rc:false},{s:revcomp(obs0).toUpperCase(),rc:true}];
 let best=null;
 for(const t of tries){
  const an=sqAnchors(exp,t.s,k,Math.max(1,Math.floor(exp.length/300)));
  if(!an.length)continue;
  const offs=new Map();for(const [e,p] of an){const d=p-e;offs.set(d,(offs.get(d)||0)+1)}
  let bo=0,bn=0;offs.forEach((v,kk)=>{if(v>bn){bn=v;bo=kk}});
  if(!best||an.length>best.n)best={...t,n:an.length,off:bo};
 }
 if(!best){o.err='Las dos secuencias no se parecen en nada. Comprueba que has pegado el plásmido correcto.';return o}
 o.rc=best.rc;if(best.rc)o.notes.push('La secuencia obtenida venía en la hebra contraria: se ha dado la vuelta para compararla.');
 let obs=best.s;
 if(circular&&best.off){const off=((best.off%obs.length)+obs.length)%obs.length;obs=obs.slice(off)+obs.slice(0,off);o.rot=off;
  o.notes.push(`La secuencia obtenida empezaba en otro punto del círculo: se ha girado ${off} bases para alinearla con la esperada.`)}
 o.obs=obs;o.lenExp=exp.length;o.lenObs=obs.length;
 if(exp===obs){o.verdict='ok';return o}
 const an=sqChain(sqAnchors(exp,obs,k,Math.max(1,Math.floor(exp.length/400))));
 if(!an.length){o.err='No se ha podido alinear: hay demasiadas diferencias.';return o}
 const segs=[];let pe=0,po=0;
 for(const [e,p] of an){if(e>pe||p>po)segs.push([pe,e,po,p]);pe=e+k;po=p+k}
 segs.push([pe,exp.length,po,obs.length]);
 for(const [e0,e1,p0,p1] of segs){
  const A=exp.slice(e0,e1),B=obs.slice(p0,p1);
  if(A===B)continue;
  if(A.length>900||B.length>900){o.diffs.push({t:'big',pos:e0+1,end:e1,ref:A.length,alt:B.length});continue}
  const ops=sqAlign(A,B);
  if(!ops){o.diffs.push({t:'big',pos:e0+1,end:e1,ref:A.length,alt:B.length});continue}
  o.diffs.push(...sqOpsToDiffs(ops,e0));
 }
 o.diffs.sort((a,b)=>a.pos-b.pos);
 o.verdict=o.diffs.length?'diff':'ok';
 return o;
}
function sqFind(regionRaw,obsRaw,circular){
 const reg=sqClean(regionRaw);let obs=sqClean(obsRaw);
 const o={diffs:[],notes:[],err:null};
 if(reg.length<12){o.err='La región tiene que tener al menos 12 bases.';return o}
 if(!obs.length){o.err='Falta la secuencia obtenida.';return o}
 const hay=circular&&obs.length>reg.length?obs+obs.slice(0,reg.length-1):obs;
 const rcObs=revcomp(obs).toUpperCase();
 const hayR=circular&&obs.length>reg.length?rcObs+rcObs.slice(0,reg.length-1):rcObs;
 let i=hay.indexOf(reg);
 if(i>=0){o.verdict='ok';o.at=(i%obs.length)+1;o.lenObs=obs.length;return o}
 i=hayR.indexOf(reg);
 if(i>=0){o.verdict='ok';o.at=(i%obs.length)+1;o.rc=true;o.lenObs=obs.length;o.notes.push('La región aparece en la hebra contraria, que en un plásmido es lo mismo.');return o}
 const k=Math.min(20,Math.max(12,Math.floor(reg.length/6)));
 let bestStart=null,bestN=0,bestRc=false;
 for(const [s,isRc] of [[obs,false],[rcObs,true]]){
  const an=sqAnchors(reg,s,k,Math.max(1,Math.floor(reg.length/120)));
  if(an.length>bestN){bestN=an.length;bestStart=an[0][1]-an[0][0];bestRc=isRc}
 }
 if(bestStart==null){o.err='La región no aparece en la secuencia obtenida, ni siquiera parecida.';return o}
 const src=bestRc?rcObs:obs;
 const pad=Math.min(60,Math.ceil(reg.length*0.2));
 const a=Math.max(0,bestStart-pad),b2=Math.min(src.length,bestStart+reg.length+pad);
 const fit=sqFit(reg,src.slice(a,b2));
 if(!fit){o.err='La región aparece pero con demasiadas diferencias para alinearla.';return o}
 o.rc=bestRc;o.lenObs=obs.length;o.at=a+fit.start+1;
 o.diffs=sqOpsToDiffs(fit.ops,0);
 o.verdict=o.diffs.length?'diff':'ok';
 return o;
}

/* --- Secuenciación: estado y vistas --- */
const SQ_VERD={ok:['Correcta','good'],diff:['Con diferencias','warn'],fail:['Fallida','bad'],'':['Sin revisar','']};
const sqDef=()=>({title:'',date:new Date().toISOString().slice(0,10),plasmid:'',exp:'',obs:'',expSeq:'',mode:'full',circular:true,verdict:'',notes:''});
function sqOpen(id){
 if(id==='nuevo'){S.sq={_new:true,...sqDef()};return}
 const d=S.data.seqruns.get(id);if(!d)return;
 S.sq=JSON.parse(JSON.stringify({...sqDef(),...clean(d),_id:id}));
}
function sqResult(){
 const Q=S.sq;if(!Q)return null;
 if(!sqClean(Q.obs))return {err:'Pega o sube la secuencia que te ha devuelto Plasmidsaurus.'};
 if(!sqClean(Q.expSeq))return {err:Q.mode==='full'?'Pega la secuencia completa que esperas.':'Pega el inserto o la región que quieres comprobar.'};
 try{return Q.mode==='full'?sqCompare(Q.expSeq,Q.obs,Q.circular):sqFind(Q.expSeq,Q.obs,Q.circular)}
 catch(e){return {err:'No se ha podido comparar: '+e.message}}
}
async function sqReadFile(file,which){
 if(!file)return;
 try{
  const txt=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsText(file)});
  if(txt.length>900000){toast('El archivo es demasiado grande.');return}
  const p=sqParse(txt);
  if(!p.seq){toast('No se ha encontrado ninguna secuencia en el archivo.');return}
  S.sq[which]=p.seq;
  if(which==='obs'&&!S.sq.title)S.sq.title=(p.name||file.name.replace(/\.[a-z]+$/i,'')).slice(0,80);
  _renderBody();toast(`${p.seq.length.toLocaleString('es-ES')} bases leídas`);
 }catch(e){toast('No se ha podido leer el archivo.')}
}
async function sqSave(){

  mode:Q.mode,circular:!!Q.circular,notes:Q.notes||'',
  verdict:Q.verdict||(r&&!r.err?r.verdict:''),ndiff:r&&!r.err?(r.diffs||[]).length:null,
  len:sqClean(Q.obs).length,updatedAt:now(),updatedBy:S.uid};
 if(isNew){doc.createdAt=now();doc.createdBy=S.uid;doc.owner=S.uid}else{doc.createdAt=Q.createdAt||now();doc.createdBy=Q.createdBy||S.uid;doc.owner=Q.owner||S.uid}
 try{await store.set('seqruns',id,doc);Q._new=false;Q._id=id;
  logActivity(isNew?'guardó':'actualizó',null,null,`la secuenciación «${Q.title}»`);
  toast(isNew?'Secuenciación guardada':'Cambios guardados');
  if(isNew)location.hash='secuenciacion/'+id;else _renderBody();
 }catch(e){toast(e&&e.code==='permission-denied'?'Las reglas de Firebase todavía no permiten guardar secuenciaciones. En Ajustes tienes la lista de colecciones.':writeErr(e))}
}

function pmType(gbType,name){
 const t=String(gbType||'').toLowerCase(),n=String(name||'');
 if(/promoter/.test(t))return 'prom';
 if(/terminator/.test(t))return 'term';
 if(/^rbs$|ribosome/.test(t))return 'rbs';
 if(/rep_origin|^ori/.test(t))return 'ori';
 if(/primer_bind|protein_bind|misc_recomb|misc_binding|oriT/i.test(t))return 'site';
 if(/cds|gene|mat_peptide/.test(t)){
  if(PM_TAG.test(n))return 'tag';

  return 'cds';
 }
 if(PM_TAG.test(n))return 'tag';
 return 'misc';
}

function pmFind(seq,pat,circular){
 const hay=circular&&seq.length>pat.length?seq+seq.slice(0,pat.length-1):seq;
 const re=new RegExp([...pat].map(c=>{const v=PM_IUPAC[c]||c;return v.length>1?'['+v+']':v}).join(''),'g');
 const out=[];let m;while((m=re.exec(hay))){if(m.index<seq.length)out.push(m.index);re.lastIndex=m.index+1}
 return out;
}
function pmSites(seq,e,circular){
 const r=revcomp(e.s).toUpperCase();
 const f=pmFind(seq,e.s,circular).map(i=>({pos:i,strand:1}));
 const b=r===e.s?[]:pmFind(seq,r,circular).map(i=>({pos:i,strand:-1}));
 return f.concat(b).sort((x,y)=>x.pos-y.pos);
}
function pmCut(e,s,L){const p=s.strand===1?s.pos+e.t:s.pos+e.s.length-e.b;return ((p%L)+L)%L}
function pmUnique(seq,circular){
 const out=[];for(const e of PM_ENZ){if(!e.c)continue;const s=pmSites(seq,e,circular);if(s.length===1)out.push({n:e.n,pos:pmCut(e,s[0],seq.length)})}
 return out.sort((a,b)=>a.pos-b.pos);
}
function pmOrfs(seq,circular,minNt){
 const out=[],L=seq.length;
 for(const st of [1,-1]){
  const s=st===1?seq:revcomp(seq).toUpperCase();
  const ext=circular?s+s.slice(0,Math.min(3000,L)):s;
  for(let f=0;f<3;f++){let start=-1;
   for(let i=f;i+2<ext.length;i+=3){const c=ext.substr(i,3);
    if(start<0&&c==='ATG')start=i;
    else if(start>=0&&(c==='TAA'||c==='TAG'||c==='TGA')){
     if(i+3-start>=minNt&&start<L){const a=st===1?start:L-(i+3),b=st===1?i+3:L-start;
      out.push({s:((a%L)+L)%L,e:b>L?b-L:b,st,aa:Math.round((i+3-start)/3)-1})}
     start=-1;}
   }}
 }
 return out;
}
/* --- lectura de archivos --- */
function pmParseGB(txt){
 const out={name:'',seq:'',circular:false,features:[]};
 const loc=txt.match(/^LOCUS\s+(\S+)([^\n]*)/m);
 if(loc){out.name=loc[1];out.circular=/circular/i.test(loc[2])}
 const oi=txt.search(/^ORIGIN/m);
 if(oi>=0)out.seq=sqClean(txt.slice(oi).split('\n').slice(1).join('\n'));
 const fi=txt.search(/^FEATURES/m);
 if(fi>=0){
  const lines=txt.slice(fi,oi<0?undefined:oi).split(/\r?\n/).slice(1);
  let cur=null;
  const push=()=>{if(cur&&!/^(source|gene)$/i.test(cur.type))for(const r of cur.ranges)out.features.push({n:cur.name||cur.type,t:pmType(cur.type,cur.name),s:r[0],e:r[1],st:cur.strand})};
  for(const line of lines){
   const m=line.match(/^ {1,8}(\S+)\s+(.+)$/);
   if(m){push();const clean=m[2].replace(/[<>]/g,'');const ranges=[];const rr=/(\d+)\.\.(\d+)/g;let q;
    while((q=rr.exec(clean)))ranges.push([+q[1]-1,+q[2]]);
    if(!ranges.length){const s1=clean.match(/(\d+)/);if(s1)ranges.push([+s1[1]-1,+s1[1]])}
    cur={type:m[1],strand:/complement/.test(m[2])?-1:1,ranges,name:''};
   }else if(cur){
    const q=line.match(/^\s*\/(label|gene|product|locus_tag|standard_name|note)="?([^"]*)"?/);
    if(q&&!cur.name&&q[2])cur.name=q[2].slice(0,60);
   }
  }
  push();
  out.features=out.features.filter(f=>f.e-f.s<out.seq.length*0.98||!out.seq.length);
 }
 return out;
}
function pmParseDna(buf){
 const dv=new DataView(buf),u8=new Uint8Array(buf),dec=new TextDecoder('utf-8');
 const out={name:'',seq:'',circular:false,features:[]};
 if(u8[0]!==0x09)throw new Error('No parece un archivo .dna de SnapGene');
 let p=0;
 while(p+5<=u8.length){
  const type=u8[p],len=dv.getUint32(p+1,false);p+=5;
  if(p+len>u8.length)break;
  const slice=buf.slice(p,p+len);
  if(type===0){out.circular=!!(u8[p]&1);out.seq=sqClean(dec.decode(buf.slice(p+1,p+len)))}
  else if(type===10){
   const d=new DOMParser().parseFromString(dec.decode(slice),'text/xml');
   d.querySelectorAll('Feature').forEach(f=>{
    const nm=f.getAttribute('name')||'',ty=f.getAttribute('type')||'misc_feature';
    const st=f.getAttribute('directionality')==='2'?-1:1;
    f.querySelectorAll('Segment').forEach(sg=>{
     const r=(sg.getAttribute('range')||'').split('-');
     if(r.length===2){const a=+r[0]-1,b=+r[1];if(isFinite(a)&&isFinite(b))out.features.push({n:nm||ty,t:pmType(ty,nm),s:a,e:b,st})}
    });
   });
  }
  else if(type===6){const m=dec.decode(slice).match(/<CustomMapLabel>([^<]*)<\/CustomMapLabel>/);if(m)out.name=m[1]}
  p+=len;
 }
 if(!out.seq)throw new Error('El archivo .dna no contiene una secuencia legible');
 return out;
}
function pmParseAuto(name,data){
 if(data instanceof ArrayBuffer){
  if(new Uint8Array(data.slice(0,1))[0]===0x09)return pmParseDna(data);
  data=new TextDecoder('utf-8').decode(data);
 }
 const t=String(data).trim();
 if(/^LOCUS/m.test(t))return pmParseGB(t);
 const p=sqParse(t);
 if(!p.seq)throw new Error('No se ha reconocido el formato');
 return {name:p.name||String(name||'').replace(/\.[^.]+$/,''),seq:p.seq,circular:/circular/i.test(t),features:[]};
}

const PM_GBT={cds:'CDS',prom:'promoter',term:'terminator',rbs:'RBS',ori:'rep_origin',res:'CDS',tag:'CDS',site:'misc_binding',misc:'misc_feature'};
function pmToGB(P){
 const L=P.seq.length;
 const d=new Date(),M=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
 const today=`${String(d.getDate()).padStart(2,'0')}-${M[d.getMonth()]}-${d.getFullYear()}`;
 let o=`LOCUS       ${(P.name||'construct').replace(/\s+/g,'_').slice(0,16).padEnd(16)} ${String(L).padStart(7)} bp ds-DNA     ${P.circular?'circular':'linear  '} SYN ${today}\n`;
 o+=`DEFINITION  ${P.name||'construct'}\nACCESSION   .\nVERSION     .\nKEYWORDS    .\nSOURCE      synthetic DNA construct\n  ORGANISM  synthetic DNA construct\n`;
 o+='FEATURES             Location/Qualifiers\n';
 o+=`     source          1..${L}\n                     /organism="synthetic DNA construct"\n`;
 for(const f of (P.features||[]).slice().sort((a,b)=>a.s-b.s)){
  const loc=f.st===-1?`complement(${f.s+1}..${f.e})`:`${f.s+1}..${f.e}`;
  o+=`     ${(PM_GBT[f.t]||'misc_feature').padEnd(15)} ${loc}\n                     /label="${String(f.n).replace(/"/g,'')}"\n`;
 }
 o+='ORIGIN\n';
 for(let i=0;i<L;i+=60){let line=String(i+1).padStart(9)+' ';
  for(let j=0;j<60;j+=10)line+=P.seq.substr(i+j,10).toLowerCase()+(j<50?' ':'');
  o+=line.replace(/\s+$/,'')+'\n';}
 return o+'//\n';
}
function pmToFasta(P){let o='>'+(P.name||'construct')+' '+P.seq.length+' pb '+(P.circular?'circular':'lineal')+'\n';
 for(let i=0;i<P.seq.length;i+=70)o+=P.seq.substr(i,70)+'\n';return o}

function pmCol(t){const i=PM_TYPES.findIndex(x=>x[0]===t);if(i<0||i>7)return pmDark()?'#72808e':'#768491';return (pmDark()?PM_PAL_D:PM_PAL_L)[i]}

const pmSv=(t,a={})=>{const e=document.createElementNS(PMNS,t);for(const[k,v]of Object.entries(a))e.setAttribute(k,v);return e};
function pmTick(L){const r=Math.pow(10,Math.max(2,Math.floor(Math.log10(Math.max(L,100)))-1));return L/r>14?r*2:r}
function pmLay(fs,L){
 const rows=[];const out=fs.map(f=>({...f}));
 out.sort((a,b)=>(a.s-b.s)||(b.e-a.e));
 for(const f of out){let r=0;while(rows[r]!==undefined&&rows[r]>f.s+0.0001)r++;rows[r]=f.e;f._r=r}
 return {fs:out,rows:Math.max(1,rows.length)};
}
function pmCircSVG(P,opts){
 const L=P.seq.length||1,W=620,H=620,cx=W/2,cy=H/2;
 const lay=pmLay(P.features||[],L);
 const R=Math.max(120,182-lay.rows*9);
 const g=pmSv('svg',{viewBox:`0 0 ${W} ${H}`,class:'pmmap',role:'img','aria-label':`Mapa circular de ${P.name||'la construcción'}, ${L} pares de bases`});
 const ang=p=>(p/L)*2*Math.PI-Math.PI/2, pt=(p,r)=>[cx+r*Math.cos(ang(p)),cy+r*Math.sin(ang(p))];
 /* reserva del texto central */
 const boxes=[[cx-96,cy-26,192,66]];
 const free=(x,y,w,h)=>{for(const b of boxes)if(x<b[0]+b[2]&&x+w>b[0]&&y<b[1]+b[3]&&y+h>b[1])return false;boxes.push([x,y,w,h]);return true};
 const label=(p,r,txt,cls,cw,fh)=>{
  const[x,y]=pt(p,r),anc=x<cx-5?'end':(x>cx+5?'start':'middle');
  const room=anc==='end'?x-4:(anc==='start'?W-4-x:Math.min(x,W-x)*2-8);
  let t2=txt;
  if(t2.length*cw>room){const k=Math.floor(room/cw)-1;if(k<6)return false;t2=t2.slice(0,k)+'…'}
  const w=t2.length*cw,x0=anc==='end'?x-w:(anc==='start'?x:x-w/2);
  if(y-fh/2<2||y+fh/2>H-2)return false;
  if(!free(x0-1,y-fh/2-1,w+2,fh+2))return false;
  const t=pmSv('text',{x,y,class:cls,'text-anchor':anc,'dominant-baseline':'middle'});t.textContent=t2;g.append(t);return true;
 };
 g.append(pmSv('circle',{cx,cy,r:R,fill:'none',stroke:'var(--line-2)','stroke-width':7}));
 /* elementos */
 const gap=Math.min(0.014,(2*Math.PI)/Math.max(L,1)*6);
 lay.fs.forEach((f,i)=>{
  const rr=R+14+f._r*17;
  let a0=ang(f.s),a1=ang(f.e<f.s?f.e+L:f.e);
  if(a1-a0>gap*2){a0+=gap/2;a1-=gap/2}
  const big=(a1-a0)>Math.PI?1:0;
  const x0=cx+rr*Math.cos(a0),y0=cy+rr*Math.sin(a0),x1=cx+rr*Math.cos(a1),y1=cy+rr*Math.sin(a1);
  const path=pmSv('path',{d:`M ${x0.toFixed(2)} ${y0.toFixed(2)} A ${rr} ${rr} 0 ${big} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`,fill:'none',stroke:pmCol(f.t),'stroke-width':9,'stroke-linecap':'butt',class:'pmft','data-i':String(i)});
  const ti=pmSv('title');ti.textContent=`${f.n} · ${PM_TL[f.t]} · ${f.s+1}–${f.e} ${f.st===-1?'(−)':'(+)'}`;path.append(ti);
  g.append(path);
 });
 /* nombres de los elementos, los más grandes primero */
 lay.fs.map((f,i)=>({f,i,sp:(f.e<f.s?f.e+L:f.e)-f.s})).sort((a,b)=>b.sp-a.sp).forEach(({f,sp})=>{
  if(sp/L<0.02)return;
  const mid=f.s+sp/2,rr=R+14+f._r*17;
  label(mid,rr+12,(f.st===-1?'◂ ':'')+String(f.n).slice(0,26)+(f.st===1?' ▸':''),'pml',5.6,11);
 });
 /* cortadores únicos */
 (opts.enz||[]).forEach(m=>{
  const[a,b]=pt(m.pos,R-3.5),[c,d]=pt(m.pos,R+3.5);
  if(!label(m.pos,R-16,m.n,'pme',5.3,10))return;
  g.append(pmSv('line',{x1:a,y1:b,x2:c,y2:d,stroke:'var(--fg-2)','stroke-width':1.4}));
 });
 /* coordenadas */
 const step=pmTick(L);
 for(let p=0;p<L;p+=step){
  const[a,b]=pt(p,R-4),[c,d]=pt(p,R-9);
  if(!label(p,R-32,p===0?'1':p.toLocaleString('es-ES'),'pmt',5,9))continue;
  g.append(pmSv('line',{x1:a,y1:b,x2:c,y2:d,stroke:'var(--fg-3)','stroke-width':1}));
 }
 const n1=pmSv('text',{x:cx,y:cy-9,class:'pmn','text-anchor':'middle'});n1.textContent=String(P.code||P.name||'construcción').slice(0,22);
 const n2=pmSv('text',{x:cx,y:cy+13,class:'pmb','text-anchor':'middle'});n2.textContent=L.toLocaleString('es-ES')+' pb';
 const n3=pmSv('text',{x:cx,y:cy+31,class:'pme2','text-anchor':'middle'});n3.textContent=fmtN(codGC(P.seq),1)+' % GC';
 g.append(n1,n2,n3);
 return g;
}
function pmLinSVG(P,opts){
 const L=P.seq.length||1,W=760,pad=38;
 const lay=pmLay(P.features||[],L);
 const H=104+lay.rows*23;
 const g=pmSv('svg',{viewBox:`0 0 ${W} ${H}`,class:'pmmap',role:'img','aria-label':`Mapa lineal de ${P.name||'la construcción'}`});
 const x=p=>pad+(p/L)*(W-2*pad);
 const boxes=[],free=(a,b,w,h)=>{for(const q of boxes)if(a<q[0]+q[2]&&a+w>q[0]&&b<q[1]+q[3]&&b+h>q[1])return false;boxes.push([a,b,w,h]);return true};
 /* cortadores únicos, en dos alturas */
 (opts.enz||[]).forEach(m=>{
  const w=m.n.length*5.3;let y=null;
  for(const yy of [30,16]){if(free(x(m.pos)-w/2,yy-6,w+3,12)){y=yy;break}}
  if(y===null)return;
  g.append(pmSv('line',{x1:x(m.pos),y1:y+7,x2:x(m.pos),y2:57,stroke:'var(--line-2)','stroke-width':1}));
  const t=pmSv('text',{x:x(m.pos),y,class:'pme','text-anchor':'middle','dominant-baseline':'middle'});t.textContent=m.n;g.append(t);
 });
 g.append(pmSv('line',{x1:pad,y1:60,x2:W-pad,y2:60,stroke:'var(--line-2)','stroke-width':6}));
 const step=pmTick(L);
 for(let p=0;p<=L;p+=step){
  g.append(pmSv('line',{x1:x(p),y1:64,x2:x(p),y2:69,stroke:'var(--fg-3)'}));
  const t=pmSv('text',{x:x(p),y:79,class:'pmt','text-anchor':'middle'});t.textContent=(p===0?1:p).toLocaleString('es-ES');g.append(t);
 }
 const ys=f=>90+f._r*23;
 lay.fs.forEach((f,i)=>{
  const w=Math.max(3,x(f.e)-x(f.s)-2),y=ys(f);
  const r=pmSv('rect',{x:x(f.s)+1,y,width:w,height:12,rx:3,fill:pmCol(f.t),class:'pmft','data-i':String(i)});
  const ti=pmSv('title');ti.textContent=`${f.n} · ${PM_TL[f.t]} · ${f.s+1}–${f.e} ${f.st===-1?'(−)':'(+)'}`;r.append(ti);g.append(r);
  boxes.push([x(f.s)+1,y,w,12]);
 });
 lay.fs.slice().sort((a,b)=>(b.e-b.s)-(a.e-a.s)).forEach(f=>{
  const txt=(f.st===-1?'◂ ':'')+String(f.n).slice(0,28)+(f.st===1?' ▸':'');
  const w=txt.length*5.6,y=ys(f),bw=Math.max(3,x(f.e)-x(f.s)-2);
  if(bw>w+10){const t=pmSv('text',{x:x(f.s)+6,y:y+9,class:'pmlin'});t.textContent=txt;g.append(t);return}
  for(const[a,al] of [[x(f.e)+5,'start'],[x(f.s)-5-w,'end']]){
   if(a<2||a+w>W-2)continue;
   if(!free(a-1,y-1,w+2,14))continue;
   const t=pmSv('text',{x:al==='end'?x(f.s)-5:a,y:y+9,class:'pml','text-anchor':al});t.textContent=txt;g.append(t);return;
  }
 });
 return g;
}

async function pmReadFile(file){
 if(!file)return;
 try{
  const isBin=/\.(dna|ab1)$/i.test(file.name);
  const data=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;isBin?fr.readAsArrayBuffer(file):fr.readAsText(file)});
  const p=pmParseAuto(file.name,data);
  if(!p.seq)throw new Error('Sin secuencia');
  S.pm.seq=p.seq;S.pm.circular=p.circular;S.pm.features=p.features||[];S.pm.dirty=true;S.pm.sel=-1;
  _renderBody();toast(`${p.seq.length.toLocaleString('es-ES')} pb y ${(p.features||[]).length} elementos leídos`);
 }catch(e){toast('No se ha podido leer: '+(e.message||'formato no reconocido'))}
}
function pmAuto(){
 const P=S.pm;if(!P.seq){toast('Primero pon la secuencia.');return}
 const add=[];
 for(const [n,m,t] of PM_MOTIFS){
  for(const [pat,st] of [[m,1],[revcomp(m).toUpperCase(),-1]]){
   for(const p of pmFind(P.seq,pat,P.circular)){
    if(P.features.some(f=>f.n===n&&Math.abs(f.s-p)<6)||add.some(f=>f.n===n&&Math.abs(f.s-p)<6))continue;
    add.push({n,t,s:p,e:p+pat.length,st});
   }}
 }
 for(const o of pmOrfs(P.seq,P.circular,300)){
  if(P.features.concat(add).some(f=>(f.t==='cds'||f.t==='res')&&Math.abs(f.s-o.s)<12))continue;
  add.push({n:`ORF ${o.aa} aa`,t:'cds',s:o.s,e:o.e,st:o.st});
 }
 if(!add.length){toast('No se ha encontrado nada nuevo.');return}
 P.features=P.features.concat(add);P.dirty=true;_renderBody();
 toast(`${add.length} elemento${add.length>1?'s':''} añadido${add.length>1?'s':''}`);
}

  if(t.dataset.asmslot){const r=asmState().rows[+t.dataset.asmslot];if(r){r.slot=t.value;asmSave();asmRefresh()}return}
  if(t.dataset.asmlib){const r=asmState().rows[+t.dataset.asmlib];const L=GS_PARTM[norm(t.value)];if(r&&L){r.name=L.name;if(L.bp)r.bp=L.bp;asmSave();_renderBody()}return}
  if(t.dataset.asm==='name'){const r=asmState().rows[+t.dataset.i];if(!r)return;const L=GS_PARTM[norm(t.value)];const d=[...S.data.plasmids.values()].find(x=>norm(x.code)===norm(t.value)||norm(x.name)===norm(t.value));
   if(L){r.name=L.name;if(L.bp)r.bp=L.bp;asmSave();_renderBody()}else if(d){r.name=d.code;if(numV(d.size)>0)r.bp=numV(d.size);asmSave();_renderBody()}return}
 if(t.dataset.asmsel){asmState()[t.dataset.asmsel]=t.value;asmSave();_renderBody();return}
 if(t.dataset.ppsel){const P=ppState();if(t.dataset.ppsel==='prot'){const g=protGroup().find(x=>x.id===t.value);if(g){P.name=g.name;P.seq=g.seq;P.frag=''}}else P.frag=t.value;ppSave();_renderBody();return}
 if(t.dataset.a280sel){const P=a280State();const k=t.dataset.a280sel;
  if(k==='prot'){const g=protGroup().find(x=>x.id===t.value);if(g){P.name=g.name;if(g.seq){P.src='seq';P.seq=g.seq;P.ox=!!g.ox}else{P.src='manual';P.eps=g.eps;P.mw=g.mw??''}}}
  else P[k]=t.value;a280Save();_renderBody();return}
 if(t.dataset.a280chk){a280State()[t.dataset.a280chk]=t.checked;a280Save();_renderBody();return}
 if(t.dataset.bufsel){const B=bufState();const k=t.dataset.bufsel;
  if(k==='preset'){const v=t.value;if(v.startsWith('p:'))bufApply(BPRESETS.find(p=>p.id===v.slice(2)));else if(v.startsWith('g:')){const g=bufGroup().find(x=>x.id===v.slice(2));if(g)bufApply(g)}_renderBody();return}
  if(k==='vu'){B.vu=t.value}else if(k==='mode'){const r=B.rows[+t.dataset.i];if(r){r.mode=t.value;const L=BLIBM.get(norm(r.name));if(r.mode==='stock'&&!(numV(r.sc)>0)&&L&&L.st!=null){r.sc=L.st;r.su=L.su}}}
  bufSave();_renderBody();return}
 if(t.dataset.bufu){const r=bufState().rows[+t.dataset.bufu];if(r){r[t.dataset.f]=t.value;bufSave();_renderBody()}return}
 if(t.dataset.pcrsel){const P=pcrState();const k=t.dataset.pcrsel;P[k]=t.value;if(k==='f'&&t.value&&!P.r){const d=S.data.oligos.get(t.value);if(d&&d.partner&&S.data.oligos.has(d.partner))P.r=d.partner}if(k==='tpl')P.ng='';pcrSave();_renderBody();return}
 if(t.dataset.pcrchk){pcrState()[t.dataset.pcrchk]=t.checked;pcrSave();_renderBody();return}
});

/* ---------- start ---------- */
async function waitClaude(ms){const t0=Date.now();while(!(window.claude&&window.claude.use)&&Date.now()-t0<ms)await new Promise(r=>setTimeout(r,100));return window.claude&&window.claude.use?window.claude:null}
async function boot(){
 renderBanner();onRoute();
 const slowT=setTimeout(()=>{if(isLoading()){S.slow=true;renderBanner();renderBody()}},10000);
 const C=await waitClaude(3000);
 let db=null;
 if(C){try{[db,USER,DL]=await Promise.all([C.use('db'),C.use('user'),C.use('downloads')])}catch(_){}}
 if(db){
  DB=db;S.mode='live';
  try{S.uid=USER?await USER.id():null}catch(_){S.uid=null}
  try{const cw=USER?await USER.can('data.write'):null;S.canWrite=cw!==false}catch(_){}
 }else{S.mode='memory';S.uid='local';S.names.local='Tú';S.canWrite=true}
 renderBanner();
 for(const c of COLLS){store.sub(c,(m,meta)=>{S.data[c]=m;S.got.add(c);if(c==='strains'&&!(meta&&meta.fromCache)){clearTimeout(slowT);if(S.slow){S.slow=false;renderBanner()}}dirty(c)})}
 const p=pcoll();if(p)store.sub(p,m=>{S.data.personal=m;dirty('personal')});
 renderMain();renderNav();scheduleNames();
}

/* ---------- Firebase: acceso y arranque ---------- */
let AUTH=null,SUBS=[];
const GATE=()=>$('#gate'),APP=()=>$('.app');
const LOGO='<svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8" fill="var(--fg)"/><circle cx="9" cy="9" r="3.1" fill="var(--c-strain)"/><circle cx="16" cy="9" r="3.1" fill="var(--c-plasmid)"/><circle cx="9" cy="16" r="3.1" fill="var(--c-oligo)"/><circle cx="23" cy="16" r="3.1" fill="var(--c-reagent)"/><circle cx="16" cy="23" r="3.1" fill="var(--c-strain)"/></svg>';
function showGate(kind,msg){
 const u=AUTH&&AUTH.currentUser;const em=esc((u&&u.email)||'');let b='';
 if(kind==='loading')b=`<p class="lede">Conectando…</p>`;
 else if(kind==='setup')b=`<h2>Falta configurar Firebase</h2><p class="lede">Abre <span class="mono">config.js</span> y pega los datos de tu proyecto de Firebase, tal como explica la guía. Después recarga esta página.</p>`;
 else if(kind==='login')b=`<h2>Entrar</h2><p class="lede">Usa la cuenta con la que te han dado acceso al grupo.</p>
  <button class="btn primary wide" data-g="google">Entrar con Google</button>
  <div class="or">o con correo</div>
  <form id="gform" class="stack" style="gap:10px" novalidate>
   <label class="fld"><span class="lbl">Correo</span><input id="g-email" type="email" autocomplete="email" required></label>
   <label class="fld"><span class="lbl">Contraseña</span><input id="g-pass" type="password" autocomplete="current-password" minlength="6" required></label>
   <div class="row2"><button class="btn primary" type="submit" style="flex:1">Entrar</button><button class="btn" type="button" data-g="register" style="flex:1">Crear cuenta</button></div>
   <button class="link small" type="button" data-g="reset" style="align-self:flex-start">He olvidado la contraseña</button>
  </form>`;
 else if(kind==='verify')b=`<h2>Verifica tu correo</h2><p class="lede">Hemos enviado un enlace a <b>${em}</b>. Ábrelo, pulsa el enlace y vuelve aquí. Si no lo ves, mira en la carpeta de spam.</p><button class="btn primary wide" data-g="verified">Ya lo he verificado</button><div class="row2"><button class="btn" data-g="resend" style="flex:1">Reenviar el correo</button><button class="btn" data-g="signout" style="flex:1">Salir</button></div>`;
 else if(kind==='denied')b=`<h2>Sin acceso</h2><p class="lede">La cuenta <b>${em}</b> no está en la lista de acceso del grupo. Pide a quien gestiona MolinaLab que añada tu correo.</p><p class="small mute">Si lo gestionas tú: consola de Firebase → Firestore Database → Reglas, añade el correo a la lista y pulsa Publicar.</p><button class="btn wide" data-g="signout">Salir y entrar con otra cuenta</button>`;
 GATE().innerHTML=`<div class="gcard"><div class="brand">${LOGO}<div><b>MolinaLab</b><small>Gestión del grupo</small></div></div>${b}<p class="ferr" id="g-err" role="alert">${esc(msg||'')}</p></div>`;
 GATE().hidden=false;APP().hidden=true;
}
function hideGate(){GATE().hidden=true;GATE().innerHTML='';APP().hidden=false}
function authMsg(e){const c=(e&&e.code)||'';return ({
 'auth/invalid-credential':'Correo o contraseña incorrectos.','auth/wrong-password':'Correo o contraseña incorrectos.','auth/user-not-found':'Correo o contraseña incorrectos.',
 'auth/invalid-email':'El correo no es válido.','auth/missing-password':'Escribe la contraseña.','auth/weak-password':'La contraseña debe tener al menos 6 caracteres.',
 'auth/email-already-in-use':'Ya existe una cuenta con ese correo. Entra con ella o recupera la contraseña.',
 'auth/popup-closed-by-user':'','auth/cancelled-popup-request':'',
 'auth/popup-blocked':'El navegador ha bloqueado la ventana de Google. Permite ventanas emergentes para esta web y vuelve a intentarlo.',
 'auth/unauthorized-domain':'Esta dirección web no está autorizada en Firebase. Añádela en Authentication → Configuración → Dominios autorizados.',
 'auth/operation-not-allowed':'Ese método de acceso no está activado. Actívalo en Firebase: Authentication → Método de acceso.',
 'auth/too-many-requests':'Demasiados intentos. Espera unos minutos y vuelve a probar.','auth/network-request-failed':'Sin conexión. Comprueba la red y vuelve a intentarlo.'
}[c]??'No se pudo completar. Vuelve a intentarlo.')}
function gErr(m){const el=$('#g-err');if(el)el.textContent=m||''}
document.addEventListener('click',async e=>{
 const g=e.target.closest('[data-g]');const so=e.target.closest('[data-a="signout"]');
 if(so){AUTH&&AUTH.signOut();return}
 if(!g)return;const k=g.dataset.g;
 try{
  if(k==='google'){gErr('');await AUTH.signInWithPopup(new firebase.auth.GoogleAuthProvider())}
  else if(k==='register'){const em=$('#g-email').value.trim(),pw=$('#g-pass').value;if(!em||!pw)return gErr('Escribe correo y contraseña para crear la cuenta.');const c=await AUTH.createUserWithEmailAndPassword(em,pw);await c.user.sendEmailVerification()}
  else if(k==='reset'){const em=$('#g-email').value.trim();if(!em)return gErr('Escribe tu correo arriba y vuelve a pulsar.');await AUTH.sendPasswordResetEmail(em);gErr('');toast('Te hemos enviado un correo para cambiar la contraseña.')}
  else if(k==='resend'){await AUTH.currentUser.sendEmailVerification();toast('Correo reenviado')}
  else if(k==='verified'){await AUTH.currentUser.reload();const u=AUTH.currentUser;if(u.emailVerified){await u.getIdToken(true);onUser(u)}else gErr('Todavía no consta como verificado. Pulsa el enlace del correo y vuelve a intentarlo.')}
  else if(k==='signout'){await AUTH.signOut()}
 }catch(er){gErr(authMsg(er))}
});
document.addEventListener('submit',async e=>{
 if(e.target.id!=='gform')return;e.preventDefault();
 try{await AUTH.signInWithEmailAndPassword($('#g-email').value.trim(),$('#g-pass').value)}catch(er){gErr(authMsg(er))}
},true);

function resetData(){SUBS.forEach(f=>{try{f()}catch(_){}});SUBS=[];COLLS.forEach(c=>S.data[c]=new Map());S.data.personal=new Map();S.got.clear();S.names={};S.colors={};S.onboardAsked=false;S.detail=null;S.err=null;S.denied=false;S.imp=null}
function onUser(u){
 resetData();closeModal();renderDrawer();
 if(!u){S.uid=null;showGate('login');return}
 const pw=u.providerData.some(p=>p.providerId==='password');
 if(pw&&!u.emailVerified){showGate('verify');return}
 S.uid=u.uid;S.email=(u.email||'').toLowerCase();S.authName=u.displayName||'';S.mode='live';S.canWrite=true;
 hideGate();renderBanner();onRoute();
 const slowT=setTimeout(()=>{if(isLoading()){S.slow=true;renderBanner();renderBody()}},10000);
 for(const c of COLLS)SUBS.push(store.sub(c,(m,meta)=>{S.data[c]=m;S.got.add(c);if(c==='strains'){clearTimeout(slowT);if(S.slow){S.slow=false;renderBanner()}}if(c==='members')resolveNames();dirty(c)}));
 SUBS.push(store.sub(pcoll(),m=>{S.data.personal=m;dirty('personal')}));
}
onDbError=function(path,e){
 if(e&&e.code==='permission-denied'){if(!S.denied){S.denied=true;resetData();showGate('denied')}return}
 S.err='No se pudieron cargar algunos datos. Comprueba la conexión y recarga la página.';renderBanner();
};

/* ---------- restaurar copia ---------- */
async function restoreBackup(file){
 const say=t=>{S.restoreMsg=t;const m=$('#restore-msg');if(m)m.textContent=t};
 let o;try{o=JSON.parse(await file.text())}catch(_){return say('El archivo no es un JSON válido.')}
 const byPrefix=new Map([...S.data.members].map(([u,m])=>[m.prefix,u]));
 const idMap=new Map();(Array.isArray(o.members)?o.members:[]).forEach(m=>{if(m&&m._id&&byPrefix.has(m.prefix))idMap.set(m._id,byPrefix.get(m.prefix))});
 const fix=u=>!u?u:(idMap.get(u)||(S.data.members.has(u)?u:S.uid));
 const writes=[];let dupes=0;
 for(const c of ['strains','plasmids','oligos','reagents','protocols','boxes','theses','milestones'])for(const d of (Array.isArray(o[c])?o[c]:[])){
  if(!d||!d._id||/\//.test(d._id))continue;
  if(d.code&&[...S.data[c].values()].some(x=>x._id!==d._id&&norm(x.code)===norm(d.code))){dupes++;continue}
  const body=clean(d);
  ['owner','createdBy','updatedBy'].forEach(k=>{if(body[k])body[k]=fix(body[k])});
  if(body.member){const m=idMap.get(body.member)||(S.data.members.has(body.member)?body.member:null);if(m)body.member=m;else delete body.member}
  if(Array.isArray(body.history))body.history.forEach(h=>{if(h&&h.by)h.by=fix(h.by)});
  writes.push([c,d._id,body]);
 }
 if(!writes.length)return say(dupes?`No se restauró nada: los ${dupes} registros ya existen con el mismo código.`:'El archivo no contiene registros que restaurar.');
 say(`Restaurando ${writes.length} registros…`);
 try{for(let i=0;i<writes.length;i+=400){const b=DB.batch();writes.slice(i,i+400).forEach(([c,id,body])=>b.set(DB.collection(c).doc(id),body));await b.commit()}
  say(`Restaurados ${writes.length} registros${dupes?`; ${dupes} omitidos porque su código ya existe`:''}.`);logActivity('restauró',null,null,`una copia con ${writes.length} registros`);toast('Copia restaurada')}
 catch(e){say(writeErr(e))}
}
document.addEventListener('change',e=>{if(e.target.id==='restore-file'&&e.target.files[0]){restoreBackup(e.target.files[0]);e.target.value=''}});

 S.offline=!navigator.onLine;
 showGate('loading');
 AUTH.onAuthStateChanged(onUser);
}
