<!doctype html>
<html lang="es">
<head>
<title>MolinaLab</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: app shell — sidebar on desktop, tab bar on phone; content reads like an instrument panel of lists, drawers and freezer-box grids. Cap colour encodes record type everywhere. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f5f7f9; --sunk:#e3e8ed; --line:#d7dde4; --line-2:#c2cbd4;
  --fg:#14202b; --fg-2:#4b5966; --fg-3:#768491;
  --accent:#2443c4; --accent-ink:#ffffff; --accent-soft:#e4e9fb; --accent-line:#b7c4f1;
  --c-exp:#7c5cff;--c-prep:#0e8f7a;--c-strain:#c27905; --c-plasmid:#7346c8; --c-oligo:#0a8279; --c-reagent:#c43b61; --c-other:#5d6b78;
  --cap-ink:#ffffff;
  --ok:#1b7a44; --ok-soft:#dbf0e3; --warn:#94600a; --warn-soft:#fbefd5; --bad:#b12626; --bad-soft:#fbe0e0;
  --shadow:0 1px 2px rgba(20,32,43,.06),0 10px 30px rgba(20,32,43,.10);
  --scrim:rgba(14,22,30,.42);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:12px; --r-sm:7px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1116; --surface:#141b22; --surface-2:#19212a; --sunk:#0f151b; --line:#253039; --line-2:#33414e;
  --fg:#e2e8ee; --fg-2:#a2afbc; --fg-3:#72808e;
  --accent:#8199ff; --accent-ink:#0c1116; --accent-soft:#1b2446; --accent-line:#34449a;
  --c-prep:#3fd0b6;--c-exp:#a99bff;--c-strain:#f0a73a; --c-plasmid:#a888f1; --c-oligo:#3cc3b7; --c-reagent:#f07899; --c-other:#93a1ae;
  --cap-ink:#0c1116;
  --ok:#5cc88a; --ok-soft:#13301f; --warn:#e7b24f; --warn-soft:#342910; --bad:#f27a7a; --bad-soft:#3a1717;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 34px rgba(0,0,0,.4); --scrim:rgba(0,0,0,.58);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c1116; --surface:#141b22; --surface-2:#19212a; --sunk:#0f151b; --line:#253039; --line-2:#33414e;
  --fg:#e2e8ee; --fg-2:#a2afbc; --fg-3:#72808e;
  --accent:#8199ff; --accent-ink:#0c1116; --accent-soft:#1b2446; --accent-line:#34449a;
  --c-strain:#f0a73a; --c-plasmid:#a888f1; --c-oligo:#3cc3b7; --c-reagent:#f07899; --c-other:#93a1ae;
  --cap-ink:#0c1116;
  --ok:#5cc88a; --ok-soft:#13301f; --warn:#e7b24f; --warn-soft:#342910; --bad:#f27a7a; --bad-soft:#3a1717;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 34px rgba(0,0,0,.4); --scrim:rgba(0,0,0,.58);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3,h4{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-size:1.85rem;font-weight:700;line-height:1.12;letter-spacing:-.015em}
h2{font-family:var(--f-display);font-size:1.18rem;font-weight:700;line-height:1.25;letter-spacing:-.005em}
h3{font-size:.95rem;font-weight:600}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.mono,.code{font-family:var(--f-mono)}
.mute{color:var(--fg-3)}
.small{font-size:.84rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);font-weight:600}
.lede{color:var(--fg-2);font-size:.92rem;margin-top:4px}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;font-size:.93rem;color:var(--fg);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:.5rem .65rem;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.45}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.48rem .8rem;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:500;font-size:.88rem;white-space:nowrap;text-decoration:none;color:var(--fg);line-height:1.2}
.btn:hover{border-color:var(--fg-3)}
.btn .ico{width:16px;height:16px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.solid{background:var(--bad);color:var(--surface)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:.32rem .6rem;font-size:.8rem}
.btn.icon{padding:.45rem}
.btn:disabled{opacity:.55;cursor:default}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font:inherit}

/* shell */
.side{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center}
.brand-m{display:flex;align-items:center}
.logo{width:30px;height:30px;flex:none}
.gs{position:relative;flex:1;min-width:0;max-width:560px}
.gs label{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-2);border-radius:999px;padding:0 12px;color:var(--fg-3)}
.gs label:focus-within{border-color:var(--accent);outline:2px solid var(--accent-line)}
.gs input{border:0;background:transparent;padding:.5rem 0;outline:none}
.gs kbd{font-family:var(--f-mono);font-size:.7rem;border:1px solid var(--line-2);border-radius:4px;padding:0 5px;color:var(--fg-3)}
.gres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);max-height:min(70vh,520px);overflow-y:auto;z-index:35;padding:6px}
.gres .grp{padding:8px 10px 4px}
.gres button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;min-width:0}
.gres button:hover,.gres button.on{background:var(--surface-2)}
.gres .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.top .addbtn .albl{display:none}
main{padding-block:22px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px;min-width:0}
#banner:empty{display:none}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:var(--r-sm);font-size:.88rem;background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.banner .sp{flex:1}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;font-size:.68rem;font-weight:500;color:var(--fg-3);text-decoration:none;background:none;border:0;cursor:pointer}
.tabbar .ico{width:21px;height:21px}
.tabbar [aria-current=page]{color:var(--accent)}
@media (min-width:900px){
  .app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
  .side{display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding:18px 12px}
  .tabbar,.brand-m{display:none}
  .top .addbtn .albl{display:inline}
  main{padding-block:28px 64px;padding-left:32px;padding-right:max(32px,env(safe-area-inset-right,0px))}
  .top{padding-left:32px;padding-right:max(32px,env(safe-area-inset-right,0px))}
}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.brand b{font-family:var(--f-display);font-size:1.3rem;letter-spacing:-.01em;line-height:1}
.brand small{display:block;color:var(--fg-3);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-sm);color:var(--fg-2);text-decoration:none;font-weight:500;font-size:.9rem}
.nav a:hover{background:var(--surface-2);color:var(--fg)}
.nav a[aria-current=page]{background:var(--accent-soft);color:var(--accent)}
.nav .cnt{margin-left:auto;font-family:var(--f-mono);font-size:.74rem;color:var(--fg-3);font-variant-numeric:tabular-nums}
.nav .grp{font-size:.66rem;text-transform:uppercase;letter-spacing:.09em;color:var(--fg-3);padding:14px 10px 4px;font-weight:600}
.side .foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:.84rem;color:var(--fg-2);min-width:0}
.side .foot span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--cap,var(--c-other));box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);flex:none}

/* view head */
.vhead{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:flex-end;justify-content:space-between}
.vacts{display:flex;flex-wrap:wrap;gap:8px}
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fbar select{width:auto;max-width:100%;font-size:.86rem;padding:.42rem .55rem;background:var(--surface)}
.fsearch{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:0 10px;color:var(--fg-3);flex:1 1 220px;min-width:0}
.fsearch:focus-within{border-color:var(--accent);outline:2px solid var(--accent-line)}
.fsearch input{border:0;padding:.42rem 0;background:transparent;outline:none}

/* tables */
.tblwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--fg-3);font-weight:600;padding:9px 14px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--fg-2)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl tbody tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.mainc{display:flex;align-items:center;gap:9px;min-width:0}
.mainc .code{color:var(--fg-2);font-size:.8rem;white-space:nowrap}
.mainc .nm{color:var(--fg);font-weight:500;min-width:0;overflow-wrap:anywhere}
.tbl .num{font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:.82rem}
.seqcell{font-family:var(--f-mono);font-size:.8rem;letter-spacing:.02em;white-space:nowrap}
.sp-i{font-style:italic}
@media (max-width:760px){
  .tbl thead{display:none}
  .tbl,.tbl tbody{display:block}
  .tbl tr{display:flex;flex-wrap:wrap;gap:3px 14px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .tbl tbody tr:last-child{border-bottom:0}
  .tbl td{display:block;padding:0;border:0;font-size:.8rem}
  .tbl td.c-main{flex-basis:100%;font-size:.95rem;margin-bottom:2px}
  .tbl td.nil{display:none}
  .tbl td[data-l]::before{content:attr(data-l) " · ";color:var(--fg-3)}
}
.res{display:inline-flex;gap:3px;flex-wrap:wrap;vertical-align:middle}
.res span{font-family:var(--f-mono);font-size:.7rem;padding:0 5px;border-radius:4px;background:var(--surface-2);color:var(--fg-2);border:1px solid var(--line-2);line-height:1.5}
.tag{display:inline-block;font-size:.7rem;padding:1px 8px;border-radius:999px;font-weight:600;letter-spacing:.01em;white-space:nowrap;background:var(--surface-2);color:var(--fg-2);border:1px solid var(--line)}
.tag.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.tag.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.tag.demo{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.owner{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--fg-2)}
.av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:.58rem;font-weight:600;color:var(--surface);background:var(--avc,var(--fg-3));font-family:var(--f-mono);letter-spacing:-.02em;flex:none}
.av.lg{width:30px;height:30px;font-size:.66rem}
.loc{white-space:nowrap}
.loc b{font-weight:500;color:var(--fg)}

/* empty & cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.card>h2,.card>header{margin-bottom:10px}
.cardh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r);padding:34px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty .ico{width:34px;height:34px;color:var(--fg-3);stroke-width:1.4}
.empty p{color:var(--fg-2);max-width:46ch}
.empty .vacts{justify-content:center;margin-top:4px}
.empty.small{padding:18px}
.skel{display:flex;flex-direction:column;gap:10px}
.skel i{display:block;height:44px;border-radius:var(--r-sm);background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sk 1.4s linear infinite}
@keyframes sk{to{background-position:-200% 0}}

/* dashboard */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:8px;min-width:0}
.tile:hover{border-color:var(--line-2)}
.tile .t{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--fg-2);font-weight:500}
.tile .n{font-family:var(--f-display);font-size:2.1rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;color:var(--fg)}
.tile .s{font-size:.76rem;color:var(--fg-3)}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.dgrid{grid-template-columns:minmax(0,1fr)}}
.li{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.li:first-of-type{border-top:0}
.li .body{flex:1;min-width:0}
.li .body b{font-weight:500}
.li .when{font-size:.76rem;color:var(--fg-3);white-space:nowrap}
.li button.lk{background:none;border:0;padding:0;text-align:left;cursor:pointer;min-width:0;flex:1;color:var(--fg-2)}
.sev{width:8px;height:8px;border-radius:50%;flex:none;background:var(--fg-3)}
.sev.bad{background:var(--bad)} .sev.warn{background:var(--warn)} .sev.info{background:var(--accent)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
@media (max-width:760px){.steps{grid-template-columns:minmax(0,1fr)}}
.step{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.step .k{font-family:var(--f-mono);font-size:.72rem;color:var(--fg-3)}
.step.done{opacity:.7}
.step.done .k::after{content:" · hecho";color:var(--ok)}
.welcome{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.act{font-size:.86rem;color:var(--fg-2)}
.act b{color:var(--fg);font-weight:500}

/* drawer / modal / sheet */
.layer{position:fixed;inset:0;z-index:40;display:flex}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .15s ease-out}
.drawer{justify-content:flex-end}
.panel{position:relative;width:min(580px,100%);height:100%;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;animation:slide .2s ease-out}
.panel-h{padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:14px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.panel-h .row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.panel-h .id{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.84rem;color:var(--fg-2)}
.panel-h h2{font-size:1.4rem}
.panel-b{flex:1;overflow-y:auto;padding-top:18px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px}
.pacts{display:flex;flex-wrap:wrap;gap:6px}
.confirm{background:var(--bad-soft);color:var(--bad);border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.88rem}
.confirm span{flex:1 1 200px}
.kvs{display:grid;grid-template-columns:minmax(110px,30%) minmax(0,1fr);gap:9px 14px;margin:0}
.kvs dt{color:var(--fg-3);font-size:.82rem;padding-top:1px}
.kvs dd{margin:0;min-width:0;overflow-wrap:anywhere}
.geno{white-space:pre-wrap}
.dsec{display:flex;flex-direction:column;gap:10px}
.dsec>h3{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-3)}
.rlinks{display:flex;flex-direction:column;gap:4px}
.rlink{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:3px 0;cursor:pointer;text-align:left;color:var(--fg);min-width:0}
.rlink:hover .nm{text-decoration:underline}
.rlink .code{font-size:.8rem;color:var(--fg-2)}
.meta{font-size:.78rem;color:var(--fg-3);border-top:1px solid var(--line);padding-top:12px}
.seqbox{font-family:var(--f-mono);font-size:.92rem;letter-spacing:.06em;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;overflow-wrap:anywhere;line-height:1.7}
.seqbox .tail{color:var(--fg-3)}
.seqstats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--fg-2);font-family:var(--f-mono)}
.seqstats b{color:var(--fg);font-weight:500}
.modal{align-items:center;justify-content:center;padding:20px}
.mcard{position:relative;width:min(680px,100%);max-height:min(92vh,100%);background:var(--surface);border-radius:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;animation:pop .16s ease-out}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px 12px;border-bottom:1px solid var(--line)}
.mbody{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.mbody .intro{color:var(--fg-2);font-size:.92rem}
.mfoot{display:flex;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid var(--line)}
.mfoot .sp{flex:1}
@media (max-width:640px){
  .modal{padding:0}
  .mcard{width:100%;height:100%;max-height:100%;border-radius:0}
  .mhead{padding-top:calc(14px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mbody{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mfoot{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
.sheet{align-items:flex-end;justify-content:center}
.spanel{position:relative;width:min(440px,100%);background:var(--surface);border-radius:16px 16px 0 0;box-shadow:var(--shadow);padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .18s ease-out}
@media (min-width:640px){.sheet{align-items:center}.spanel{border-radius:16px}}
.slist{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;margin-top:8px}
.slist a,.slist button{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:9px;text-decoration:none;color:var(--fg);background:none;border:0;cursor:pointer;font-weight:500;text-align:left}
.slist a:hover,.slist button:hover{background:var(--surface-2)}
.slist .cap{width:14px;height:14px;margin:0 2px}
@keyframes slide{from{transform:translateX(24px);opacity:.4}}
@keyframes pop{from{transform:scale(.98);opacity:.5}}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* forms */
.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 16px}
.fld{display:flex;flex-direction:column;gap:5px;grid-column:1/-1;min-width:0}
.fld.half{grid-column:auto}
@media (max-width:560px){.fld.half{grid-column:1/-1}}
.lbl{font-size:.8rem;font-weight:600;color:var(--fg-2)}
.lbl.req::after{content:" *";color:var(--bad)}
.help{font-size:.76rem;color:var(--fg-3)}
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.chip-opt{position:relative;cursor:pointer}
.chip-opt input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.chip-opt span{display:inline-block;padding:3px 10px;border-radius:999px;border:1px solid var(--line-2);font-family:var(--f-mono);font-size:.8rem;color:var(--fg-2);background:var(--surface)}
.chip-opt input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip-opt input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.checklist{max-height:210px;overflow-y:auto;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:4px}
.checklist label{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:5px;font-size:.88rem;cursor:pointer}
.checklist label:hover{background:var(--surface-2)}
.checklist .code{font-size:.78rem;color:var(--fg-2)}
.cl-filter{margin-bottom:4px}
.seqarea{font-family:var(--f-mono);letter-spacing:.04em}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;cursor:pointer}
.ferr{color:var(--bad);font-size:.86rem}
.ferr:empty{display:none}
.row2{display:flex;gap:8px;align-items:center}
.row2>select{flex:1}

/* boxes */
.boxframe{background:var(--sunk);border:1px solid var(--line);border-radius:14px;padding:12px 12px 14px;max-width:600px}
.grid-box{display:grid;grid-template-columns:18px repeat(var(--cols),minmax(0,1fr));gap:4px}
.grid-box .lab{font-family:var(--f-mono);font-size:.64rem;color:var(--fg-3);display:grid;place-items:center}
.cell{aspect-ratio:1;border-radius:50%;border:1px dashed var(--line-2);background:var(--surface);display:grid;place-items:center;font-family:var(--f-mono);font-size:.56rem;color:var(--fg-3);cursor:pointer;padding:0;min-width:0;overflow:hidden;line-height:1}
.cell:hover{border-color:var(--accent);border-style:solid}
.cell.occ{border:0;background:var(--cap);color:var(--cap-ink);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),0 1px 2px rgba(0,0,0,.15);font-weight:500}
.cell.sel{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.cell.hi{outline:3px solid var(--fg);outline-offset:2px;animation:pulse 1.2s ease-in-out 2}
.cell:disabled{cursor:not-allowed}
.grid-box.mini .cell{font-size:.5rem}
@keyframes pulse{50%{outline-offset:5px}}
.fz{display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr);gap:20px;align-items:start}
.fz-list{display:flex;flex-direction:column;gap:14px}
.fzg{display:flex;flex-direction:column;gap:6px}
.boxbtn{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;cursor:pointer;width:100%}
.boxbtn:hover{border-color:var(--line-2)}
.boxbtn[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.boxbtn .r1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.boxbtn .r1 b{font-weight:600}
.meter{height:5px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter i.warn{background:var(--warn)} .meter i.bad{background:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--fg-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.fz-back{display:none}
@media (max-width:899px){
  .fz{grid-template-columns:minmax(0,1fr)}
  .fz.has-sel .fz-list{display:none}
  .fz:not(.has-sel) .fz-view{display:none}
  .fz-back{display:inline-flex}
}

/* protocols */

.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0}

/* theses */

.tline .now{position:absolute;top:2px;bottom:2px;width:2px;margin-left:-1px;background:var(--fg)}
.tl-l{display:flex;justify-content:space-between;font-size:.74rem;color:var(--fg-3);font-family:var(--f-mono)}
.ms-head{display:flex;align-items:center;gap:10px;margin:16px 0 4px}

/* personal */
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}

.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ncard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:120px;min-width:0}

.ncard .m{font-size:.74rem;color:var(--fg-3);margin-top:auto}

/* import */
.drop{border:2px dashed var(--line-2);border-radius:var(--r);padding:22px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:var(--surface)}

.member{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:max-content;max-width:calc(100% - 32px)}

/* calculators */

.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:6px;min-width:0}

.bgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}

.unit select{width:auto;flex:none;padding:.5rem .4rem;font-size:.85rem}

.rulebox{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;font-size:.8rem;overflow-x:auto;white-space:pre;color:var(--fg-2)}
.card .vacts{flex-wrap:wrap}
.pmview{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}

.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}

.gel{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}

@media (min-width:981px){.gelview{position:sticky;top:76px}}

.codseq{word-break:break-all;line-height:1.7;max-height:260px;overflow:auto}
.codseq .chg{color:var(--accent);font-weight:600}
.pdp{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.pdp-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pdp .seqbox{background:var(--surface);word-break:break-all}
.qplot{width:100%;height:auto;display:block;font-size:10px;fill:var(--fg-3);font-family:var(--f-mono)}
.aacomp{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:6px}
.aacomp span{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:5px 8px;font-size:.84rem;font-family:var(--f-mono);display:flex;gap:6px;align-items:baseline}
.aacomp b{color:var(--fg)}.aacomp i{white-space:nowrap;font-style:normal;color:var(--fg-3);margin-left:auto;font-size:.76rem}
.unit{display:flex;align-items:center;gap:6px}.unit span{font-size:.82rem;color:var(--fg-3);white-space:nowrap}

.gate{min-height:100vh;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.gcard{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.gcard .brand{padding:0 0 6px}
.or{display:flex;align-items:center;gap:10px;color:var(--fg-3);font-size:.8rem}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.btn.wide{width:100%;padding:.68rem}
</style>

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>new Date().toISOString();
const isoDay=d=>{const z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`};
const toDate=s=>{if(!s)return null;const d=new Date(String(s).length===10?s+'T00:00:00':s);return isNaN(d)?null:d};
const dayDiff=s=>{const d=toDate(s);if(!d)return null;d.setHours(0,0,0,0);const t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/86400000)};
const fmtD=s=>{const d=toDate(s);return d?d.toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'}):''};
const rel=s=>{const d=toDate(s);if(!d)return '';const x=(Date.now()-d)/1000;if(x<60)return 'ahora mismo';if(x<3600)return `hace ${Math.floor(x/60)} min`;if(x<86400)return `hace ${Math.floor(x/3600)} h`;const n=Math.floor(x/86400);if(n===1)return 'ayer';if(n<7)return `hace ${n} días`;return fmtD(s)};
const natCmp=(a,b)=>String(a??'').localeCompare(String(b??''),'es',{numeric:true,sensitivity:'base'});
const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const slug=s=>norm(s).replace(/[^a-z0-9]+/g,'-');
const capf=s=>s?s[0].toUpperCase()+s.slice(1):s;
function clean(o){const r={};for(const [k,v] of Object.entries(o)){if(k.startsWith('_')||v===undefined)continue;r[k]=v}return JSON.parse(JSON.stringify(r))}
const fmtBp=n=>{if(n==null||n==='')return '';n=+n;if(!isFinite(n))return '';return n>=1000?`${(n/1000).toFixed(2).replace('.',',')} kb <span class="mute">(${n.toLocaleString('es-ES')} pb)</span>`:`${n} pb`};

/* ---------- sequence tools ---------- */
const COMP={A:'T',T:'A',G:'C',C:'G',U:'A',R:'Y',Y:'R',S:'S',W:'W',K:'M',M:'K',B:'V',V:'B',D:'H',H:'D',N:'N'};
function revcomp(s){return [...String(s||'').replace(/\s/g,'')].reverse().map(ch=>{const u=ch.toUpperCase();const c=COMP[u]||u;return ch===u?c:c.toLowerCase()}).join('')}
function nstats(s){if(!s)return null;const u=s.toUpperCase();let gc=0,at=0;for(const c of u){if(c==='G'||c==='C')gc++;else if(c==='A'||c==='T'||c==='U')at++}const n=u.length;const tm=n<14?2*at+4*gc:64.9+41*(gc-16.4)/n;return{n,gc:Math.round(gc/n*100),tm:Math.round(tm)}}
function oligoInfo(seq){const s=String(seq||'').replace(/[^A-Za-z]/g,'');const full=nstats(s);if(!full)return null;let ann=null;if(/[a-z]/.test(s)&&/[A-Z]/.test(s))ann=nstats(s.replace(/[a-z]/g,''));return{...full,ann}}
function seqStatsHTML(seq){const i=oligoInfo(seq);if(!i)return '<span class="mute">Escribe la secuencia 5\'→3\'. En minúsculas, las colas que no hibridan (sitios de restricción, solapamientos).</span>';return `<span><b>${i.n}</b> nt</span><span><b>${i.gc}</b> % GC</span><span>Tm <b>${i.tm}</b> °C</span>${i.ann?`<span>· parte que hibrida: <b>${i.ann.n}</b> nt, Tm <b>${i.ann.tm}</b> °C</span>`:''}`}
function seqHTML(s){return esc(s).replace(/([a-z]+)/g,'<span class="tail">$1</span>')}

 },

function nextCode(type,prefix,extra){
 const pre=T[type].pre(prefix||myPrefix()||'XX');let max=0;
 const scan=c=>{if(c&&c.toUpperCase().startsWith(pre.toUpperCase())){const n=parseInt(c.slice(pre.length),10);if(isFinite(n)&&n>max)max=n}};
 for(const d of S.data[type].values())scan(d.code);(extra||[]).forEach(scan);

}

  <select id="flt-sort" aria-label="Orden">${[['code','Por código'],['name','Por nombre'],['updated','Editados recientemente']].map(([v,l])=>`<option value="${v}"${f.sort===v?' selected':''}>${l}</option>`).join('')}</select>
 </div><div id="vb"></div>`;
}
function matchItem(type,d,f){
 if(f.owner!=='all'&&d.owner!==f.owner)return false;
 if(f.kind&&String(d.kind||'')!==f.kind)return false;
 if(f.loc&&String(d.where||'')!==f.loc)return false;
 if(f.res&&!(d.res||[]).includes(f.res))return false;
 if(f.status){
  if(type==='reagents'){
   if(f.status==='pedir'){if(!(d.order||d.stock==='Agotado'||d.stock==='Queda poco'))return false}
   else if(f.status==='caduca'){const n=dayDiff(d.expiry);if(n==null||n>30)return false}
   else if((d.stock||'Suficiente')!==f.status)return false;
  }else if((d.status||T[type].status[0])!==f.status)return false;
 }
 if(f.q){
  if(type==='oligos'&&d.seq){const s=d.seq.toUpperCase(),u=f.q.replace(/\s/g,'').toUpperCase();if(/^[ACGTUN]{4,}$/.test(u)&&(s.includes(u)||s.includes(revcomp(u))))return true}
  if(!norm(T[type].search(d).join(' ')).includes(norm(f.q)))return false;
 }
 return true;
}
function listBody(type){

 docs=docs.filter(d=>matchItem(type,d,f));

 const vc=$('#vcount');if(vc)vc.textContent=total?(docs.length===total?`${total} ${total===1?t.one:t.label.toLowerCase()}`:`${docs.length} de ${total}`):'Colección vacía';
 if(!total)return emptyList(type);
 if(!docs.length)return `<div class="empty small"><p>Nada coincide con estos filtros.</p><button class="btn sm" data-a="clear-filters" data-type="${type}">Quitar filtros</button></div>`;
 return `<div class="tblwrap"><table class="tbl"><thead><tr><th>${capf(t.one)}</th>${t.cols.map(c=>`<th>${c.l}</th>`).join('')}</tr></thead><tbody>${docs.map(d=>`<tr data-a="open" data-type="${type}" data-id="${esc(d._id)}" tabindex="0"><td class="c-main"><div class="mainc"><span class="cap" style="--cap:var(--c-${t.color})"></span><span class="code">${esc(d.code)}</span><span class="nm">${esc(d.name)}${statusTag(type,d)}${d.demo?' <span class="tag demo">Ejemplo</span>':''}</span></div></td>${t.cols.map(c=>{const v=c.v(d);return `<td data-l="${c.l}"${v?'':' class="nil"'}>${v||'<span class="mute">—</span>'}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`;

function inl(s){
 return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>')
  .replace(/(\d+(?:[.,]\d+)?(?:\s?[–-]\s?\d+(?:[.,]\d+)?)?\s?(?:°C|ºC|h|min|s|µl|µL|ul|ml|mL|µg|ng|mg|g|rpm|mM|µM|nM|%))(?![\wµ])/g,'<span class="q">$1</span>');
}
function md(src){
 const lines=String(src||'').replace(/\r/g,'').split('\n');let out='',list=null,para=[];
 const fp=()=>{if(para.length){out+=`<p>${inl(para.join(' '))}</p>`;para=[]}};const cl=()=>{if(list){out+=`</${list}>`;list=null}};
 for(const raw of lines){const l=raw.trim();let m;
  if(!l){fp();cl();continue}
  if((m=l.match(/^(#{1,3})\s+(.*)$/))){fp();cl();const n=m[1].length;out+=n===1?`<h2>${inl(m[2])}</h2>`:n===2?`<h3>${inl(m[2])}</h3>`:`<h4>${inl(m[2])}</h4>`;continue}
  if((m=l.match(/^[-*•]\s+(.*)$/))){fp();if(list!=='ul'){cl();out+='<ul>';list='ul'}out+=`<li>${inl(m[1])}</li>`;continue}
  if((m=l.match(/^\d+[.)]\s+(.*)$/))){fp();if(list!=='ol'){cl();out+='<ol>';list='ol'}out+=`<li>${inl(m[1])}</li>`;continue}
  cl();para.push(l)}
 fp();cl();return out;
}

function thesisCard(t){
 const ms=[...S.data.milestones.values()].filter(m=>m.thesis===t._id).sort((a,b)=>((a.status==='Hecho')-(b.status==='Hecho'))||natCmp(a.due||'9999',b.due||'9999'));
 const done=ms.filter(m=>m.status==='Hecho').length;
 const st=toDate(t.start),en=toDate(t.end);let tl='';
 if(st&&en&&en>st){const span=en-st;const fr=x=>Math.max(0,Math.min(1,(x-st)/span));const nowF=fr(new Date());const yrs=span/31557600000;const yr=Math.min(Math.max(1,Math.ceil((Date.now()-st)/31557600000)),Math.ceil(yrs));const left=Math.round((en-Date.now())/2629800000);
  tl=`<div class="tline" aria-hidden="true"><div class="bar"><i style="width:${nowF*100}%"></i></div>${ms.filter(m=>toDate(m.due)).map(m=>{const late=m.status!=='Hecho'&&dayDiff(m.due)<0;return `<span class="dot ${m.status==='Hecho'?'done':m.status==='En curso'?'curso':''}${late?' late':''}" style="left:${fr(toDate(m.due))*100}%" title="${esc(m.title)}"></span>`}).join('')}<span class="now" style="left:${nowF*100}%"></span></div><div class="tl-l"><span>${st.getFullYear()}</span><span>${Date.now()<st?'Aún no ha empezado':Date.now()>en?'Fecha prevista superada':`Año ${yr} de ${Math.round(yrs)} · quedan ${left} meses`}</span><span>${en.getFullYear()}</span></div>`}
 else tl=`<p class="small mute" style="margin-top:10px">${S.canWrite?`Añade inicio y fin previsto para ver la línea de tiempo. <button class="link" data-a="thesis-edit" data-id="${t._id}">Añadir fechas</button>`:'Sin fechas.'}</p>`;
 return `<article class="card"><header class="th-h"><div><p class="eyebrow">${esc(t.label||'Sin nombre')}</p><h2>${esc(t.title||'Título por definir')}</h2></div>${S.canWrite?`<button class="btn sm ghost" data-a="thesis-edit" data-id="${t._id}">${ic('edit')}Editar</button>`:''}</header>${tl}
 <div class="ms-head"><h3>Hitos</h3><span class="small mute">${done}/${ms.length} hechos</span>${S.canWrite?`<button class="btn sm" data-a="ms-new" data-id="${t._id}">${ic('plus')}Hito</button>`:''}</div>
 ${ms.length?ms.map(msRow).join(''):`<p class="small mute">Sin hitos. Por ejemplo: plan de investigación, informes anuales, artículos, estancias, congresos y depósito.</p>`}</article>`;
}

async function saveMember(prefix,role,name){
 prefix=norm(prefix).toUpperCase().replace(/[^A-Z0-9]/g,'');
 if(!/^[A-Z][A-Z0-9]{1,4}$/.test(prefix))return 'Las iniciales deben tener de 2 a 5 letras.';
 for(const [u,x] of S.data.members)if(u!==S.uid&&x.prefix===prefix)return `${prefix} ya lo usa ${pname(u)}.`;
 const m=meM();const nm=String(name||(m&&m.name)||S.authName||'').trim();if(!nm)return 'Escribe tu nombre.';await store.set('members',S.uid,{prefix,role:role||'',name:nm,email:S.email||'',joined:(m&&m.joined)||now()});
 if(!m)logActivity('se unió al grupo','members',null,' ');
 return null;
}

const SYN={code:/^(c[oó]d(igo)?|code)\b|^(id|n[º°o]\.?|num(ero)?|ref(erencia)?( interna)?|#)$/,
 _box:/^(caja|box|gradilla)/,_pos:/^(pos(ici[oó]n)?|position|hueco|well|celda)$/,
 species:/especie|species|organismo|organism/,genotype:/genotipo|genotype|descripci[oó]n|description/,parent:/parental|parent|background/,plasmids:/^pl[aá]smidos?( que porta)?$|^plasmids?$/,
 res:/resist|antibi[oó]tico|antibiotic|marcador|marker|selecci[oó]n/,medium:/^medio|medium|^media$/,temp:/temp/,source:/origen|source|procedencia|fuente|referencia/,status:/^estado|status/,notes:/notas?|notes?|observaciones|comentarios?|comments?/,
 backbone:/backbone|vector/,insert:/inserto|insert|construcci[oó]n/,size:/tama[nñ]o|size|longitud|length|\bpb\b|\bbp\b/,ori:/\bori\b|origen de replicaci/,host:/hu[eé]sped|host|cepa portadora/,verified:/verificad|secuenciad|verified|sequenced/,seqUrl:/mapa|map|url|enlace|link/,method:/m[eé]todo|method/,
 seq:/^secuencia|sequence|^seq|5.?.?3/,target:/diana|target|^gen$|^gene$|regi[oó]n/,purpose:/^uso|purpose|aplicaci[oó]n|finalidad/,partner:/pareja|partner|pair/,plasmid:/pl[aá]smido|plasmid/,
 brand:/^marca|^brand|fabricante/,supplier:/proveedor|supplier|casa (comercial|suministradora)|vendor|distribuidor/,
 kind:/qu[eé] es|categor[ií]a|^tipo$|familia|^clase$/,nameEn:/ingl[eé]s|english/,formula:/f[oó]rmula/,qty:/^cantidad$|^unidades$|^uds/,sds:/^sds$|seguridad|^msds$/,url:/^url$|^enlace|^link$|ficha/,conc:/concentraci[oó]n|^conc/,cat:/cat[aá]logo|catalog|^ref(erencia)?$/,cas:/\bcas\b/,amount:/presentaci[oó]n|formato|amount|quantity|cantidad/,where:/ubicaci[oó]n|lugar|location|d[oó]nde|estante|nevera|congelador|armario|localizaci/,stock:/stock|existencias/,expiry:/caducidad|expir|vence/,opened:/abierto|apertura|opened/,order:/pedir|pedido|order/,
 name:/^(nombre|name|cepa|strain|pl[aá]smido|plasmid|oligo|primer|cebador|reactivo|producto|designaci[oó]n)$/};
function impTargets(type){const tg=[['code','Código']];if(type!=='reagents')tg.push(['_box','Caja'],['_pos','Posición en la caja']);T[type].fields.filter(f=>f.t!=='loc').forEach(f=>tg.push([f.k,f.l]));return tg}
function guessMap(type,headers){
 const tg=impTargets(type).map(x=>x[0]);const order=['code','_box','_pos',...tg.filter(k=>!['code','_box','_pos','name'].includes(k)),'name'];
 const used=new Set();return headers.map(h=>{const n=norm(h);if(!n)return '';for(const k of order){if(used.has(k))continue;const re=SYN[k];if(re&&re.test(n)){used.add(k);return k}}return ''});
}

function rowVals(I,r){const v={};I.map.forEach((k,i)=>{if(k&&r[i]!=null&&r[i]!=='')v[k]=v[k]?v[k]+'; '+r[i]:r[i]});return v}
function countDups(I){const ci=I.map.indexOf('code');if(ci<0)return 0;const ex=new Set([...S.data[I.type].values()].map(d=>norm(d.code)));return I.rows.filter(r=>r[ci]&&ex.has(norm(r[ci]))).length}
function parseNum(s){s=String(s).replace(/\s/g,'');if(!s)return null;const mult=/kb/i.test(s)?1000:1;s=s.replace(/[a-zA-Zµ°]+/g,'');if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');s=s.replace(',','.');const n=parseFloat(s);return isFinite(n)?Math.round(n*mult*1000)/1000:null}

async function runImport(){

 const owner=I.owner||S.uid;const existing=new Set([...S.data[I.type].values()].map(d=>norm(d.code)));const madeCodes=[];const seen=new Set();
 const boxByName=new Map([...S.data.boxes.values()].map(b=>[norm(b.name),b]));const usedPos=new Set();
 const res={ok:0,skipped:0,boxes:0,noPos:0,failed:0,notes:0};
 I.step=3;I.running=true;I.total=I.rows.length;I.done=0;renderBody();
 for(const r of I.rows){
  I.done++;const v=rowVals(I,r);

   if(!v.name){res.failed++;continue}
   let code=(v.code||'').trim();
   if(code&&(existing.has(norm(code))||seen.has(norm(code)))){if(I.skipDup){res.skipped++;continue}code=''}

    else if(f.t==='refs'){const ids=[],bad=[];String(raw).split(/[,;+]/).map(s=>s.trim()).filter(Boolean).forEach(x=>{const id=findRef(f.ref,x);id?ids.push(id):bad.push(x)});doc[k]=ids;if(bad.length)extra.push(`${f.l}: ${bad.join(', ')}`)}

   if(v._box){let b=boxByName.get(norm(v._box));

    if(b){let p=parsePos(v._pos,b);const key=b._id+'|'+p;if(p&&(occ(b._id).has(p)||usedPos.has(key)))p=null;if(p){doc.loc={box:b._id,pos:p};usedPos.add(key)}else res.noPos++}

  if(f.t==='loc'){const [b,p]=locText(v);r.push(b,p)}else if(f.t==='chips')r.push((v||[]).join(', '));else if(f.t==='refs')r.push((v||[]).map(i=>codeOf(f.ref,i)).filter(Boolean).join(', '));else if(f.t==='ref1')r.push(v?codeOf(f.ref,v):'');else if(f.t==='bool')r.push(v?'Sí':'No');else r.push(v??'')});

let MODAL=null;
function fieldHTML(f,v){
 const id='f-'+f.k;const grouped=['chips','refs','loc','bool'].includes(f.t);
 const lab=grouped?`<span class="lbl${f.req?' req':''}">${esc(f.l)}</span>`:`<label class="lbl${f.req?' req':''}" for="${id}">${esc(f.l)}</label>`;
 const ph=esc(f.ph||'');let inner='';
 switch(f.t){
  case 'textarea':inner=`<textarea id="${id}" rows="${f.rows||3}" placeholder="${ph}">${esc(v??'')}</textarea>`;break;
  case 'seq':inner=`<textarea id="${id}" class="seqarea" rows="3" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="ACGT…">${esc(v??'')}</textarea><div class="seqstats" id="seqstats">${seqStatsHTML(v)}</div>`;break;
  case 'number':inner=`<input id="${id}" type="number" inputmode="decimal" step="any" value="${v??''}" placeholder="${ph}">`;break;
  case 'date':inner=`<input id="${id}" type="date" value="${esc(v||'')}">`;break;
  case 'url':inner=`<input id="${id}" type="url" value="${esc(v||'')}" placeholder="${ph}" autocomplete="off">`;break;
  case 'select':inner=`<select id="${id}">${f.blank?`<option value="">${esc(f.blank)}</option>`:''}${f.opts.map(o=>{const [val,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(val)}"${String(v??'')===String(val)?' selected':''}>${esc(l)}</option>`}).join('')}</select>`;break;
  case 'ref1':{const ds=[...S.data[f.ref].values()].filter(d=>d._id!==f.exclude).sort((a,b)=>natCmp(rCode(a)||rName(a),rCode(b)||rName(b)));inner=`<select id="${id}"><option value="">Ninguno</option>${ds.map(d=>`<option value="${esc(d._id)}"${v===d._id?' selected':''}>${esc([rCode(d),rName(d)].filter(Boolean).join(' · '))}</option>`).join('')}</select>`;break}
  case 'chips':inner=`<div class="chipset" role="group" aria-label="${esc(f.l)}">${f.opts.map(([val,title])=>`<label class="chip-opt" title="${esc(title)}"><input type="checkbox" name="${id}" value="${esc(val)}"${(v||[]).includes(val)?' checked':''}><span>${esc(val)}</span></label>`).join('')}</div>`;break;
  case 'refs':{const ds=[...S.data[f.ref].values()].sort((a,b)=>natCmp(rCode(a)||rName(a),rCode(b)||rName(b)));inner=ds.length?`${ds.length>8?`<input class="cl-filter" type="search" placeholder="Filtrar…" aria-label="Filtrar ${esc(f.l)}">`:''}<div class="checklist">${ds.map(d=>`<label data-q="${esc(norm(rCode(d)+' '+rName(d)))}"><input type="checkbox" name="${id}" value="${esc(d._id)}"${(v||[]).includes(d._id)?' checked':''}>${rCode(d)?`<span class="code">${esc(rCode(d))}</span>`:''}<span>${esc(rName(d))}</span></label>`).join('')}</div>`:`<p class="small mute">Aún no hay ${(T[f.ref]?T[f.ref].label:'registros').toLowerCase()} registrados.</p>`;break}
  case 'bool':inner=`<label class="switch"><input id="${id}" type="checkbox"${v?' checked':''}> ${esc(f.cl||'Sí')}</label>`;break;
  case 'loc':inner=locPickerHTML(v,f.exclude);break;
  default:inner=`<input id="${id}" type="text" value="${esc(v??'')}" placeholder="${ph}"${f.list?` list="dl-${f.k}"`:''}${f.mono?' class="mono"':''} autocomplete="off">${f.list?`<datalist id="dl-${f.k}">${f.list().map(x=>`<option value="${esc(x)}"></option>`).join('')}</datalist>`:''}`;
 }
 return `<div class="fld${f.half?' half':''}" data-k="${f.k}">${lab}${inner}${f.help?`<span class="help">${f.help}</span>`:''}</div>`;
}
function locPickerHTML(v,exclude){

 if(!boxes.length)return `<p class="small mute">Aún no hay cajas. Créalas en Congelador y podrás elegir el hueco aquí.</p><input type="hidden" id="f-loc-box" value=""><input type="hidden" id="f-loc-pos" value="">`;

function refreshLoc(pos){const box=$('#f-loc-box').value;const ex=$('#locpick').dataset.exclude||'';$('#f-loc-pos').value=pos||'';$('#locgrid').innerHTML=locGridHTML(box,pos,ex)}
function readForm(fields){
 const v={};
 for(const f of fields){const id='f-'+f.k;let x;
  if(f.t==='chips'||f.t==='refs')x=$$(`#mform [name="${id}"]:checked`).map(e=>e.value);
  else if(f.t==='bool')x=!!($('#'+id)||{}).checked;
  else if(f.t==='loc'){const b=($('#f-loc-box')||{}).value||'',p=($('#f-loc-pos')||{}).value||'';if(b&&!p)throw new Error('Elige el hueco de la caja o deja la ubicación en «Sin ubicar».');x=b?{box:b,pos:p}:null}
  else if(f.t==='number'){const r=($('#'+id)||{}).value;x=r===''||r==null?null:Number(r)}
  else{const el=$('#'+id);x=el?String(el.value).trim():''}
  if(f.req&&(x===''||x==null||(Array.isArray(x)&&!x.length)))throw new Error(`Falta: ${f.l}.`);
  v[f.k]=x}
 return v;
}

const PCR_POL={

 phu:{l:'Phusion',full:'Phusion High-Fidelity (Thermo, tampón HF)',

  tpl:{plasmid:[0.001,10],genomic:[50,250]},def:{plasmid:1,genomic:100}}
};
const PCR_TPL=[['plasmid','Plásmido'],['genomic','ADN genómico'],['cdna','cDNA o volumen fijo'],['colony','Colonia']];
const UBASE={X:1,'%':1,M:1e6,mM:1e3,'µM':1,nM:1e-3};
function pcrState(){
 if(S.pcr)return S.pcr;
 const def={pol:'q5',V:50,n:1,extra:10,tpl:'plasmid',conc:'',ng:'',vol:2,inMix:false,f:'',r:'',tmF:'',tmR:'',len:'',cycles:30,add:false,ov:{}};
 S.pcr={...def,...(lsGet('calc.pcr')||{})};if(!PCR_POL[S.pcr.pol])S.pcr.pol='q5';if(!S.pcr.ov||typeof S.pcr.ov!=='object')S.pcr.ov={};
 return S.pcr;
}
function pcrSave(){lsSet('calc.pcr',S.pcr)}
function pcrComps(P){const pol=PCR_POL[P.pol];const ov=P.ov[P.pol]||{};return pol.comps.map(c=>{const o=ov[c.k]||{};let fin=c.k==='add'?(P.add?c.on:0):c.fin;if(o.fin!=null)fin=o.fin;if(c.k==='add'&&!P.add)fin=0;return {...c,stock:o.stock!=null?o.stock:c.stock,fin,mod:o.stock!=null||o.fin!=null}})}
function oligoTm(id){const d=id&&S.data.oligos.get(id);if(!d)return null;const i=oligoInfo(d.seq);if(!i)return null;return {tm:(i.ann||i).tm,n:(i.ann||i).n,tail:!!i.ann,d}}
function pcrCalc(){
 const P=pcrState(),pol=PCR_POL[P.pol];const out={rows:[],warn:[],info:[],err:null};
 const V=numV(P.V);if(!V||V<=0){out.err='Indica el volumen de reacción.';return out}
 const n=Math.max(1,Math.round(numV(P.n)||1));const extra=Math.max(0,numV(P.extra)||0);const mult=n>1?n*(1+extra/100):1;
 out.V=V;out.n=n;out.mult=mult;
 for(const c of pcrComps(P)){
  if(c.opt&&!(c.fin>0))continue;
  let vol;
  if(c.k==='pol'){vol=c.stock>0?c.fin*(V/50)/c.stock:NaN}
  else{const b1=UBASE[c.su],b2=UBASE[c.fu];vol=c.stock>0?V*(c.fin*b2)/(c.stock*b1):NaN}
  if(!isFinite(vol)){out.err=`Revisa la concentración de ${c.l}.`;return out}
  out.rows.push({l:c.l,st:`${fmtN(c.stock,3)} ${c.su}`,fi:`${fmtN(c.fin,3)} ${c.fu==='U/50 µL'?`U${V!==50?` (${fmtN(c.fin*V/50,3)} U)`:''}`:c.fu}`,v:vol,mix:true});
 }
 /* template */
 let tv=0,tlabel='Molde';const scale=V/50;
 if(P.tpl==='plasmid'||P.tpl==='genomic'){
  const conc=numV(P.conc),ng=numV(P.ng)!=null?numV(P.ng):pol.def[P.tpl]*scale;
  tlabel=P.tpl==='plasmid'?'Plásmido':'ADN genómico';
  if(conc&&conc>0){tv=ng/conc;
   const [lo,hi]=pol.tpl[P.tpl].map(x=>x*scale);
   if(ng<lo||ng>hi)out.warn.push(`Para ${pol.l} se recomiendan ${fmtN(lo,3)}–${fmtN(hi,3)} ng de ${P.tpl==='plasmid'?'plásmido':'ADN genómico'} en ${fmtN(V)} µL.`);
   if(tv>0&&tv<0.5){const f=conc/ng;tv=1;tlabel+=' diluido';out.dil=f;
    const step=f<=200?`Diluye el molde 1:${fmtN(f,f<10?1:0)} (1 µL de stock + ${fmtN(f-1,f<10?1:0)} µL de agua)`:`Diluye el molde 1:100 (1 µL + 99 µL de agua) y esa dilución otra vez 1:${fmtN(f/100,f<1000?1:0)} (1 µL + ${fmtN(f/100-1,f<1000?1:0)} µL de agua)`;
    out.info.push(`${step} y añade 1 µL, que lleva ${fmtN(ng,3)} ng. Sin diluir serían ${fmtN(ng/conc,3)} µL, imposible de pipetear.`)}
  }else out.info.push('Escribe la concentración del molde para calcular el volumen.');
  out.tng=ng;
 }else if(P.tpl==='cdna'){tv=Math.max(0,numV(P.vol)||0);tlabel='Molde'}
 else{tv=0;tlabel='Colonia';out.info.push('Toca la colonia con una punta, resuspende en el tubo y alarga la desnaturalización inicial a 3–5 min para lisar las células.');if(P.pol!=='taq')out.info.push('Las polimerasas de alta fidelidad toleran peor la PCR de colonia; para comprobar clones suele bastar con Taq.')}
 const sum=out.rows.reduce((a,r)=>a+r.v,0);const water=V-sum-tv;
 if(water<-1e-9){out.err=`Los componentes suman ${fmtN(sum+tv)} µL y no caben en ${fmtN(V)} µL. Sube el volumen o usa stocks más concentrados.`;return out}
 const inMix=P.inMix&&tv>0;
 out.rows.push({l:'Agua libre de nucleasas',st:'',fi:'',v:water,mix:true,water:true});
 if(P.tpl!=='colony')out.rows.push({l:tlabel,st:P.tpl==='cdna'?'':(numV(P.conc)?(out.dil?`${fmtN(out.tng,3)} ng/µL`:`${fmtN(numV(P.conc),3)} ng/µL`):''),fi:out.tng!=null?`${fmtN(out.tng,3)} ng`:'',v:tv,mix:inMix,tpl:true});
 out.tv=tv;out.inMix=inMix;out.aliquot=V-(inMix?0:tv);
 if(n===1&&out.rows.some(r=>!r.water&&r.v>0&&r.v<0.5))out.warn.push('Hay volúmenes por debajo de 0,5 µL. Prepara mezcla para varias reacciones o diluye los stocks.');
 /* cycling */
 const tF=P.f?oligoTm(P.f):null,tR=P.r?oligoTm(P.r):null;
 const tmF=tF?tF.tm:numV(P.tmF),tmR=tR?tR.tm:numV(P.tmR);out.tF=tF;out.tR=tR;out.tmF=tmF;out.tmR=tmR;
 let ta=null;
 if(tmF!=null&&tmR!=null){const lo=Math.min(tmF,tmR);
  if(pol.ta==='m5')ta=lo-5;else if(pol.ta==='p3')ta=lo+3;else{const nmin=Math.min(tF?tF.n:99,tR?tR.n:99);ta=nmin<=20?lo:lo+3}
  ta=Math.round(ta);
  if(Math.abs(tmF-tmR)>5)out.warn.push(`Las Tm de los cebadores difieren ${Math.abs(tmF-tmR)} °C. Lo ideal es menos de 5 °C.`);
  if((tF&&tF.tail)||(tR&&tR.tail))out.info.push('La Tm se calcula con la parte que hibrida (en mayúsculas). Las colas no cuentan en los primeros ciclos.');
 }
 out.ta=ta;out.twoStep=ta!=null&&ta>=72&&P.pol!=='taq';
 const len=numV(P.len);const rate=pol.rate[P.tpl]||pol.rate.def;let ext=null;
 if(len&&len>0){ext=Math.max(pol.extMin,Math.ceil(len/1000*rate/5)*5)}
 out.ext=ext;out.cycles=Math.max(1,Math.round(numV(P.cycles)||30));
 const colonyDen=P.tpl==='colony'?Math.max(pol.den0[1],180):pol.den0[1];
 out.prog=[['Desnaturalización inicial',pol.den0[0],fmtSec(colonyDen),'1'],
  ...(out.twoStep?[['Desnaturalización',pol.den[0],fmtSec(pol.den[1]),String(out.cycles)],['Hibridación y extensión',72,ext!=null?fmtSec(Math.max(ext,pol.extMin)):'según tamaño','']]
  :[['Desnaturalización',pol.den[0],fmtSec(pol.den[1]),String(out.cycles)],['Hibridación',ta!=null?Math.min(ta,72):'—',fmtSec(pol.ann),''],['Extensión',pol.ext,ext!=null?fmtSec(ext):'según tamaño','']]),
  ['Extensión final',pol.fin[0],fmtSec(pol.fin[1]),'1'],['Mantener',4,'∞','']];
 if(out.twoStep)out.info.push(`La Ta sale a ${ta} °C, igual o por encima de la extensión: haz la PCR en dos pasos.`);
 if(ta!=null&&ta<(P.pol==='taq'?45:50))out.warn.push(`Ta de ${ta} °C, baja. Comprueba los cebadores o usa una Ta en gradiente.`);
 return out;
}

function pcrHTML(){
 const P=pcrState(),pol=PCR_POL[P.pol];const comps=pcrComps(P);const anyMod=comps.some(c=>c.mod);
 const fld=(id,l,inner,half,help)=>`<div class="fld${half?' half':''}"><label class="lbl" for="${id}">${l}</label>${inner}${help?`<span class="help">${help}</span>`:''}</div>`;
 const num=(id,k,ph,unit,step)=>`<div class="unit"><input id="${id}" data-pcr="${k}" type="number" inputmode="decimal" step="${step||'any'}" min="0" value="${esc(P[k]??'')}" placeholder="${esc(ph||'')}">${unit?`<span>${unit}</span>`:''}</div>`;

 const hasOl=S.data.oligos.size>0;
 const olF=(w)=>{const id=P[w];const t=id?oligoTm(id):null;const W=w==='f'?'F':'R';return `<div class="fld half"><label class="lbl" for="pcr-${w}">Cebador ${W}</label>${hasOl?`<select id="pcr-${w}" data-pcrsel="${w}">${pcrOligoOpts(id)}</select>`:''}${!t?`<div class="unit"${hasOl?' style="margin-top:6px"':''}><input id="pcr-tm${W}" data-pcr="tm${W}" type="number" inputmode="decimal" step="any" placeholder="Tm" value="${esc(P['tm'+W]??'')}" aria-label="Tm del cebador ${W}"><span>°C</span></div>`:`<span class="help mono">${t.n} nt · Tm ${t.tm} °C${t.tail?' (parte que hibrida)':''}</span>`}</div>`};
 return `<div class="calc">

  ${r.rows.map(x=>`<tr><td>${esc(x.l)}</td><td class="n cx">${esc(x.st)}</td><td class="n cx">${esc(x.fi)}</td><td class="n"><b>${fmtN(x.v)}</b> µL</td>${multi?`<td class="n">${x.mix?`<b>${fmtN(x.v*r.mult)}</b> µL`:'<span class="mute">por tubo</span>'}</td>`:''}</tr>`).join('')}
  <tr class="tot"><td>Total</td><td class="cx"></td><td class="cx"></td><td class="n">${fmtN(tot)} µL</td>${multi?`<td class="n">${fmtN(mixTot)} µL</td>`:''}</tr></tbody></table></div>

  <p class="small mute">${r.ta==null?'Elige los dos cebadores o escribe su Tm para calcular la Ta. ':''}${r.ext==null?'Indica el tamaño del producto para el tiempo de extensión. ':''}La Ta es orientativa: sale de la Tm que calcula MolinaLab con una fórmula sencilla. Para Q5 y Phusion conviene contrastarla con el calculador del fabricante o probar un gradiente.</p>

function pcrText(){
 const P=pcrState(),r=pcrCalc();if(r.err)return r.err;const pol=PCR_POL[P.pol];
 const L=[`PCR · ${pol.full}${P.add?' · '+pol.addL.split(' (')[0]:''}`,`${fmtN(r.V)} µL por reacción${r.n>1?` · mezcla para ${r.n} (×${fmtN(r.mult,2)})`:''}`,''];
 r.rows.forEach(x=>L.push(`${x.l}: ${fmtN(x.v)} µL${r.n>1?(x.mix?` · mezcla ${fmtN(x.v*r.mult)} µL`:' · por tubo'):''}`));
 if(r.n>1)L.push('',`Repartir ${fmtN(r.aliquot)} µL por tubo${!r.inMix&&r.tv>0?` + ${fmtN(r.tv)} µL de molde`:''}`);
 const fo=r.tF?`${r.tF.d.code} (Tm ${r.tF.tm} °C)`:r.tmF!=null?`Tm ${r.tmF} °C`:'',ro=r.tR?`${r.tR.d.code} (Tm ${r.tR.tm} °C)`:r.tmR!=null?`Tm ${r.tmR} °C`:'';
 if(fo||ro)L.push('',`Cebadores: ${fo||'—'} / ${ro||'—'}`);
 L.push('','Programa:');r.prog.forEach(p=>L.push(`${p[0]}: ${p[1]} °C, ${p[2]}${p[3]&&p[3]!=='1'?` · ${p[3]} ciclos`:''}`));
 return L.join('\n');
}

/* --- Proteínas: núcleo compartido --- */
/* Masas medias de residuo (Da) y coeficientes de Pace et al. 1995 (W 5500, Y 1490, cistina 125), como ProtParam de ExPASy */
const AA_MASS={A:71.0788,R:156.1875,N:114.1038,D:115.0886,C:103.1388,E:129.1155,Q:128.1307,G:57.0519,H:137.1411,I:113.1594,L:113.1594,K:128.1741,M:131.1926,F:147.1766,P:97.1167,S:87.0782,T:101.1051,W:186.2132,Y:163.1760,V:99.1326,U:150.0388,O:237.3018};
function protParse(raw){
 const txt=String(raw||'').split(/\r?\n/).filter(l=>!/^\s*>/.test(l)).join('').toUpperCase().replace(/[\s\d*.\-]/g,'');
 const bad=[...new Set([...txt].filter(c=>!AA_MASS[c]))];const seq=[...txt].filter(c=>AA_MASS[c]).join('');
 const dna=seq.length>=12&&/^[ACGTUN]+$/.test(txt);return {seq,bad,dna};
}
function protComp(seq){
 if(!seq)return null;const n={};for(const c of seq)n[c]=(n[c]||0)+1;
 const mw=[...seq].reduce((a,c)=>a+AA_MASS[c],0)+18.01524;const W=n.W||0,Y=n.Y||0,C=n.C||0;
 const red=W*5500+Y*1490,ox=red+Math.floor(C/2)*125;
 return {len:seq.length,n,mw,W,Y,C,epsRed:red,epsOx:ox};
}
function protGroup(){return ((S.data.meta.get('proteins')||{}).items)||[]}

/* --- A280 --- */
function a280State(){if(S.a280)return S.a280;S.a280={name:'',src:'seq',seq:'',ox:false,eps:'',mw:'',A:'',A260:'',dil:1,path:1,vol:'',tgt:'',tgtU:'µM',tgtV:'',tgtVU:'µL',...(lsGet('calc.a280')||{})};return S.a280}
function a280Save(){lsSet('calc.a280',S.a280)}
function a280Calc(){
 const P=a280State(),o={warn:[],info:[],err:null};
 let eps=null,mw=null;
 if(P.src==='seq'){const p=protParse(P.seq);o.parse=p;
  if(p.dna)o.warn.push('La secuencia parece ADN. Pega la secuencia de aminoácidos (por ejemplo, la traducción del constructo).');
  if(p.bad.length)o.warn.push(`Se han ignorado caracteres que no son aminoácidos: ${p.bad.join(' ')}.`);
  const c=p.dna?null:protComp(p.seq);o.comp=c;
  if(c){mw=c.mw;eps=P.ox?c.epsOx:c.epsRed;
   if(c.W===0&&c.Y===0)o.warn.push('La proteína no tiene Trp ni Tyr: casi no absorbe a 280 nm y la A280 no sirve para cuantificarla. Usa Bradford o BCA.');
   else if(c.W===0)o.info.push('Sin triptófanos, el ε calculado puede desviarse más de un 10 % del real.');
   if(c.C>=2&&!P.ox)o.info.push(`Tiene ${c.C} cisteínas. Si forman puentes disulfuro (proteína secretada, sin reductor), marca la opción de cisteínas oxidadas.`);}
 }else if(P.src==='abs'){const a=numV(P.eps);mw=numV(P.mw);if(a>0&&mw>0)eps=a*mw;o.abs01=a}
 else{eps=numV(P.eps);mw=numV(P.mw)}
 o.eps=eps;o.mw=mw;
 const A=numV(P.A),dil=numV(P.dil)||1,path=numV(P.path)||1;
 if(A==null){o.err='Escribe la A280 medida.';return o}
 if(!(eps>0)&&P.src!=='generic'){o.err=P.src==='seq'?'Pega la secuencia de la proteína.':'Indica el coeficiente de extinción.';return o}
 const Ac=A*dil/path;
 if(P.src==='generic'){o.mgml=Ac;o.info.push('Con la aproximación 1 A280 = 1 mg/mL el error puede ser grande, de 0,5 a 2 veces según la proteína. Es mejor usar el ε de la secuencia.')}
 else{o.M=Ac/eps;o.uM=o.M*1e6;if(mw>0)o.mgml=o.M*mw}
 if(mw>0&&o.M!=null){o.abs01=eps/mw}
 if(A>1.5)o.warn.push(`A280 de ${fmtN(A,2)}: por encima de 1–1,5 la lectura deja de ser lineal. Diluye la muestra y vuelve a medir.`);
 else if(A<0.1&&A>0)o.warn.push(`A280 de ${fmtN(A,3)}: por debajo de 0,1 la medida es poco precisa. Si puedes, mide una muestra más concentrada.`);
 const A260=numV(P.A260);
 if(A260!=null&&A>0){o.ratio=A260/A;
  if(o.ratio>0.7)o.warn.push(`A260/A280 = ${fmtN(o.ratio,2)}: hay ácidos nucleicos en la muestra y la concentración real de proteína es menor. Una proteína pura da en torno a 0,57.`);
  else if(o.ratio>0.6)o.info.push(`A260/A280 = ${fmtN(o.ratio,2)}: posible algo de ácido nucleico. Una proteína pura da en torno a 0,57.`);
  else o.info.push(`A260/A280 = ${fmtN(o.ratio,2)}: sin señal de ácidos nucleicos.`)}
 const vol=numV(P.vol);if(vol>0&&o.mgml!=null)o.totmg=o.mgml*vol;
 /* dilución a una concentración objetivo */
 const t=numV(P.tgt),tv=numV(P.tgtV);
 if(t>0){let ratio=null;
  if(P.tgtU==='mg/mL'){if(o.mgml)ratio=t/o.mgml}else{const f={M:1e6,mM:1e3,'µM':1,nM:1e-3}[P.tgtU];if(o.uM)ratio=t*f/o.uM}
  if(ratio==null)o.dilErr=P.tgtU==='mg/mL'?'Hace falta la concentración en mg/mL.':'Para concentraciones molares hace falta el ε y el peso molecular.';
  else if(ratio>1)o.dilErr=`La muestra está menos concentrada que el objetivo (necesitarías concentrarla ${fmtN(ratio,2)} veces).`;
  else{o.dilF=1/ratio;if(tv>0){o.dilStock=tv*ratio;o.dilBuf=tv-o.dilStock}}
 }
 return o;
}

function ppCalc(){

 if(p.bad.length)o.warn.push(`Se han ignorado caracteres que no son aminoácidos: ${p.bad.join(' ')}.`);

 let seq=p.seq;o.fragL='Proteína completa';
 const fs=String(P.frag||'').split(':');
 if(fs.length===3){const s=o.feat.sites.find(x=>x.l===fs[0]&&String(x.cut)===fs[1]);if(s){seq=fs[2]==='N'?p.seq.slice(0,s.cut):p.seq.slice(s.cut);o.frag={site:s,side:fs[2]};o.fragL=`Tras cortar con ${s.l}: ${fs[2]==='N'?`aa 1–${s.cut}`:`aa ${s.cut+1}–${p.seq.length}`}`}}

 if(o.frag){const all=protComp(p.seq);o.fullMw=all.mw;}

function ppChargeSVG(seq,n,pI,pH){

 const path=pts.map((p,i)=>`${i?'L':'M'}${xs(p[0]).toFixed(1)},${ys(p[1]).toFixed(1)}`).join('');
 const ticks=[2,4,6,8,10,12].map(v=>`<line x1="${xs(v)}" x2="${xs(v)}" y1="${H-b}" y2="${H-b+4}" stroke="var(--line-2)"/><text x="${xs(v)}" y="${H-b+15}" text-anchor="middle">${v}</text>`).join('');
 const yt=[mx,0,-mx].map(v=>`<text x="${l-6}" y="${ys(v)+3.5}" text-anchor="end">${v>0?'+':''}${v}</text>`).join('');
 const mark=(x,lab,col,dy)=>x>=2&&x<=12?`<line x1="${xs(x)}" x2="${xs(x)}" y1="${t}" y2="${H-b}" stroke="${col}" stroke-dasharray="3 3"/><text x="${xs(x)+4}" y="${t+10+dy}" fill="${col}">${lab}</text>`:'';
 return `<svg viewBox="0 0 ${W} ${H}" class="qplot" role="img" aria-label="Carga neta frente al pH; pI ${fmtN(pI,2)}"><line x1="${l}" x2="${W-r}" y1="${ys(0)}" y2="${ys(0)}" stroke="var(--line-2)"/>${ticks}${yt}<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2"/>${mark(pI,'pI '+fmtN(pI,2),'var(--fg-2)',0)}${pH!=null?mark(pH,'pH '+fmtN(pH,2),'var(--warn)',14):''}<text x="${(l+W-r)/2}" y="${H-1}" text-anchor="middle">pH</text></svg>`;

function asmCalc(){

 if(!parts.length){o.err='Añade al menos un inserto o una parte.';return o}
 o.nFrag=parts.length+1;
 const mk=(r,ng,role)=>{const bp=numV(r.bp),conc=numV(r.conc);const x={name:r.name||role,role,bp,ng,fmol:bp>0?fmolOf(ng,bp):null};

  parts.forEach((r,i)=>{const bp=numV(r.bp);o.rows.push(mk(r,bp>0?gsNg(bp):0,r.slot||`Parte ${i+1}`))});

  parts.forEach((r,i)=>{const bp=numV(r.bp);o.rows.push(mk(r,bp>0?ngOf(f,bp):0,`Parte ${i+1}`))});

  else o.mix=[{l:'Mezcla maestra 2X (NEBuilder o Gibson)',v:V/2}];
 }
 const bad=o.rows.find(r=>r.bad);
 const dnaV=o.rows.reduce((a,r)=>a+(r.v||0),0);o.dnaV=dnaV;
 const cap=M.kind==='gib'?V/2:V-o.mix.reduce((a,m)=>a+m.v,0);
 o.water=cap-dnaV;o.cap=cap;
 if(!bad){
  if(o.water<-1e-9)o.err=`El ADN ocupa ${fmtN(dnaV)} µL y solo caben ${fmtN(cap)} µL. Sube el volumen de reacción o usa ADN más concentrado.`;
  const tiny=o.rows.filter(r=>r.v>0&&r.v<0.5);
  if(tiny.length)o.warn.push(`${tiny.length===1?`${tiny[0].name} necesita`:'Hay componentes que necesitan'} menos de 0,5 µL: dilúyelo${tiny.length===1?'':'s'} 1:10 antes de pipetear.`);
 }

  if(parts.length>1)o.warn.push('Con más de un inserto la ligación clásica baja mucho de eficiencia. Para varias piezas, Golden Gate o Gibson van mejor.');
 }
  if(M.kind==='gs'){
  o.info.push(`Cada parte va a ${fmtN(o.fmol,0)} fmol, no en masa igual. El volumen sale de (fmol × pb × 0,00066) ÷ concentración, como en vuestra hoja.`);
  if(A.level==='0')o.info.push('Nivel 0: el vector receptor es v96 y el enzima, BbsI.');
  if(o.nFrag>8)o.warn.push(`${o.nFrag} fragmentos en un tubo: a partir de ocho conviene subir los ciclos.`);
 }
 if(M.kind==='gg'){
  o.info.push(`Las piezas van en cantidades iguales (${fmtN(o.fmol,0)} fmol de cada una), no en masa igual.`);
  if(A.m==='subti'&&A.level==='2')o.info.push('En el nivel 2, el BsmBI tiene un 25 % de actividad en el tampón de la ligasa: alarga la digestión de cada ciclo a 8 min.');
  if(o.nFrag>7)o.warn.push(`${o.nFrag} fragmentos en un tubo: a partir de seis o siete piezas conviene subir los ciclos y comprobar que ninguna pieza lleva sitios internos del enzima.`);
 }
 if(M.kind==='gib'){
  const tot=o.rows.reduce((a,r)=>a+(r.fmol||0),0)/1000;o.pmol=tot;
  const hi=o.nFrag>=4?1:0.5,lo=o.nFrag>=4?0.2:0.02;

  else if(tot<lo)o.warn.push(`El total son ${fmtN(tot,3)} pmol de ADN, por debajo de los ${lo} pmol recomendados para ${o.nFrag} fragmentos.`);

 }

  const E=asmEnz(),cyc=Math.max(1,Math.round(asmNum('cycles')));o.cycles=cyc;
  const dig=(A.m==='subti'&&A.level==='2')?480:M.dig;
  if(M.kind==='gs')o.info.push('El programa del termociclador no viene en vuestra hoja: estos ciclos son los habituales de un Golden Gate.');

 }else if(M.kind==='gib'){

}

/* --- Diseño de cebadores --- */
/* Tm por vecinos próximos, parámetros unificados de SantaLucia y Hicks (2004); corrección de sal de SantaLucia (1998) */
const NN_DH={AA:-7.6,AT:-7.2,TA:-7.2,CA:-8.5,GT:-8.4,CT:-7.8,GA:-8.2,CG:-10.6,GC:-9.8,GG:-8.0};
const NN_DS={AA:-21.3,AT:-20.4,TA:-21.3,CA:-22.7,GT:-22.4,CT:-21.0,GA:-22.2,CG:-27.2,GC:-24.4,GG:-19.9};
const NCMP={A:'T',T:'A',G:'C',C:'G'};
const PD_CONC=0.5,PD_NA=0.05;
function tmNN(seq){
 const s=String(seq||'').toUpperCase().replace(/[^ACGT]/g,'');if(s.length<8)return null;
 let dH=0.2,dS=-5.7;
 for(let i=0;i<s.length-1;i++){let k=s[i]+s[i+1];if(NN_DH[k]==null)k=NCMP[k[1]]+NCMP[k[0]];if(NN_DH[k]==null)return null;dH+=NN_DH[k];dS+=NN_DS[k]}
 for(const e of [s[0],s[s.length-1]])if(e==='A'||e==='T'){dH+=2.2;dS+=6.9}
 dS+=0.368*(s.length-1)*Math.log(PD_NA);
 return dH*1000/(dS+1.987*Math.log(PD_CONC*1e-6))-273.15;
}
const gcPct=s=>{const u=s.toUpperCase();let g=0;for(const c of u)if(c==='G'||c==='C')g++;return u.length?g/u.length*100:0};
function pd3Dimer(a,b){const A=a.toUpperCase(),B=b.toUpperCase();let best=0;
 for(let off=0;off<B.length;off++){let n=0;for(let i=0;i<Math.min(A.length,B.length-off);i++){if(NCMP[A[A.length-1-i]]===B[off+i])n++;else break}if(n>best)best=n}
 return best}
function pdHairpin(s){const u=s.toUpperCase();let best=0;
 for(let i=0;i<u.length;i++)for(let j=i+7;j<u.length;j++){let k=0;while(i+k<j-k&&(j-k)-(i+k)>=4&&NCMP[u[i+k]]===u[j-k])k++;if(k>best)best=k}

function pdRun(s){let m=1,c=1;for(let i=1;i<s.length;i++){if(s[i]===s[i-1]){c++;if(c>m)m=c}else c=1}return m}

 const tm=tmNN(a);if(tm==null)return null;const gc=gcPct(a),last=a[a.length-1].toUpperCase();
 let sc=Math.abs(tm-tgt);
 sc+=Math.max(0,Math.abs(gc-50)-10)*0.25;
 if(last!=='G'&&last!=='C')sc+=1.2;
 const tail5=a.slice(-5).toUpperCase();let gc5=0;for(const c of tail5)if(c==='G'||c==='C')gc5++;
 if(gc5>3)sc+=1;
 if(pdRun(a.toUpperCase())>=5)sc+=3;
 if(pd3Dimer(a,a)>=5)sc+=2;
 if(pdHairpin(a)>=5)sc+=1.5;
 return {sc,tm,gc,n:a.length,seq:a};
}
function pdCands(region,tgt,lmin,lmax){
 const out=[];for(let L=lmin;L<=lmax&&L<=region.length;L++){const c=pdScore(region.slice(0,L),tgt);if(c)out.push(c)}
 return out.sort((x,y)=>x.sc-y.sc).slice(0,14);
}

const PD_RE=[['EcoRI','GAATTC'],['BamHI','GGATCC'],['HindIII','AAGCTT'],['XbaI','TCTAGA'],['SalI','GTCGAC'],['PstI','CTGCAG'],['SpeI','ACTAGT'],['NdeI','CATATG'],['NcoI','CCATGG'],['XhoI','CTCGAG'],['KpnI','GGTACC'],['SacI','GAGCTC'],['NotI','GCGGCCGC'],['BglII','AGATCT'],['NheI','GCTAGC'],['EcoRV','GATATC'],['SmaI','CCCGGG'],['ApaI','GGGCCC'],['AscI','GGCGCGCC'],['PacI','TTAATTAA']];
const PD_REM=Object.fromEntries(PD_RE);

function pdState(){
 if(S.pd)return S.pd;
 S.pd={name:'',tpl:'',from:'',to:'',tm:'60',lmin:'18',lmax:'30',mode:'gs',fs5:'A',fs3:'B',route:'auto',fixed:true,reF:'EcoRI',reR:'BamHI',flank:'6',vecF:'',vecR:'',ov:'25',...(lsGet('calc.pd')||{})};if(S.pd.mode==='gg')S.pd.mode='gs';
 return S.pd;
}
function pdSave(){lsSet('calc.pd',S.pd)}
function pdClean(x){return String(x||'').toUpperCase().replace(/[^ACGT]/g,'')}
function pdTails(amp){
 const P=pdState(),o={f:'',r:'',notes:[],warn:[]};
 const fl=Math.max(0,Math.round(numV(P.flank)??6));const flank=PD_FLANK.slice(0,fl)||'';
 if(P.mode==='gs'){
  const f5=gsFS(P.fs5),f3=gsFS(P.fs3);
  if(f5.length!==4)o.warn.push('El sitio de fusión 5\' tiene que ser de 4 nt o una letra de la A a la I.');
  if(f3.length!==4)o.warn.push('El sitio de fusión 3\' tiene que ser de 4 nt o una letra de la A a la I.');
  if(f5&&f5===f3)o.warn.push('Los dos sitios de fusión son iguales: la pieza podría entrar al revés. Usa sitios distintos.');
  o.f=GS_BBSI+GS_TAIL_F+f5;o.r=GS_BBSI+GS_TAIL_R+revcomp(f3).toUpperCase();
  for(const [nm,site] of [['BbsI','GAAGAC'],['BsaI','GGTCTC']]){
   const rs=revcomp(site).toUpperCase();
   const hits=(amp.split(site).length-1)+(amp.split(rs).length-1);
   if(hits)o.warn.push(`La parte lleva ${hits} sitio${hits>1?'s':''} de ${nm} por dentro. Hay que domesticarla antes: tienes el modo «solo domesticar» en la calculadora de codones.`);
  }
  o.notes.push(`Cola: TT + GAAGAC (BbsI) + tc + ${GS_TAIL_F} + el sitio de fusión de 4 nt, según vuestro protocolo para v96.`);
 }else if(P.mode==='re'){
  const sF=PD_REM[P.reF]||'',sR=PD_REM[P.reR]||'';
  o.f=flank+sF;o.r=flank+sR;
  for(const [nm,site] of [[P.reF,sF],[P.reR,sR]]){
   if(!site)continue;const rs=revcomp(site).toUpperCase();
   const hits=(amp.split(site).length-1)+(site===rs?0:amp.split(rs).length-1);
   if(hits)o.warn.push(`La región que amplificas lleva ${hits} sitio${hits>1?'s':''} de ${nm} por dentro: elige otro enzima.`);
  }
  if(P.reF===P.reR)o.warn.push('Los dos enzimas son el mismo: el inserto podría entrar en cualquier orientación y el vector recircularizarse.');
  o.notes.push(`Cola: ${fl} bases extra + el sitio del enzima. Las bases extra hacen falta para que el enzima corte cerca del extremo; comprueba cuántas pide el tuyo en la tabla de corte cerca del extremo de NEB.`);
 }else if(P.mode==='gib'){
  const n=Math.max(15,Math.min(40,Math.round(numV(P.ov)??25)));
  const up=pdClean(P.vecF),dn=pdClean(P.vecR);
  if(up)o.f=up.slice(-n);else o.warn.push('Pega el extremo del vector que va justo antes del inserto.');
  if(dn)o.r=revcomp(dn.slice(0,n)).toUpperCase();else o.warn.push('Pega el extremo del vector que va justo después del inserto.');
  if(up&&up.length<n)o.warn.push(`El extremo de antes del inserto solo tiene ${up.length} nt: pega al menos ${n}.`);
  if(dn&&dn.length<n)o.warn.push(`El extremo de después del inserto solo tiene ${dn.length} nt: pega al menos ${n}.`);

 }

}
function pdCalc(){
 const P=pdState(),o={warn:[],info:[],err:null};
 const tpl=pdClean(P.tpl);
 if(!tpl)  {o.err='Pega la secuencia de la región que quieres amplificar.';return o}
 if(tpl.length<40){o.err='La secuencia es demasiado corta: pega al menos 40 nt.';return o}
 o.tplLen=tpl.length;
 let a=numV(P.from),b=numV(P.to);
 a=a!=null&&a>=1?Math.round(a):1;b=b!=null&&b>=1?Math.round(b):tpl.length;
 if(b>tpl.length)b=tpl.length;
 if(a>=b){o.err='La posición inicial tiene que ser menor que la final.';return o}
 const amp=tpl.slice(a-1,b);o.amp=amp;o.from=a;o.to=b;
 if(amp.length<40){o.err='La región elegida es demasiado corta.';return o}
 if(P.mode==='gs'){
  const route=P.route==='auto'?(amp.length<70?'ann':'pcr'):P.route;o.route=route;
  const f5=gsFS(P.fs5),f3=gsFS(P.fs3);o.f5=f5;o.f3=f3;o.f5l=gsFSLabel(P.fs5);o.f3l=gsFSLabel(P.fs3);
  if(f5.length!==4||f3.length!==4){o.err='Elige los dos sitios de fusión (una letra de la A a la I, o cuatro bases).';return o}
  if(f5===f3)o.warn.push('Los dos sitios de fusión son iguales: la pieza podría entrar al revés.');
  for(const [nm,site] of [['BbsI','GAAGAC'],['BsaI','GGTCTC']]){
   const rs=revcomp(site).toUpperCase();const hits=(amp.split(site).length-1)+(amp.split(rs).length-1);
   if(hits)o.warn.push(`La parte lleva ${hits} sitio${hits>1?'s':''} de ${nm} por dentro. Domestícala antes: tienes el modo «solo domesticar» en la calculadora de codones.`);
  }

   if(amp.length>=70)o.warn.push(`La parte mide ${amp.length} pb. Por encima de 70 pb salen oligos muy largos y caros: mejor la ruta de PCR.`);
   if(F.length>100||R.length>100)o.warn.push(`Los oligos salen de ${F.length} y ${R.length} nt. Mira la escala de síntesis que te admite el proveedor.`);
   o.info.push('Los dos oligos se hibridan entre sí: el producto ya lleva los salientes de 4 nt como si BbsI hubiera cortado, así que no hace falta el sitio de BbsI.');

 }
 const tgt=numV(P.tm)??60,lmin=Math.max(15,Math.round(numV(P.lmin)??18)),lmax=Math.min(45,Math.round(numV(P.lmax)??30));
 if(lmax<lmin){o.err='La longitud máxima tiene que ser mayor que la mínima.';return o}
 if(P.mode==='gs'&&P.fixed){
  const mk=x=>{const c=pdScore(x,tgt);return c||{sc:0,tm:tmNN(x),gc:gcPct(x),n:x.length,seq:x}};
  const F=mk(amp.slice(0,20)),R=mk(revcomp(amp).toUpperCase().slice(0,20));

 o.prod=amp.length+t.f.length+t.r.length;
 o.dTm=Math.abs(F.tm-R.tm);
 if(o.dTm>4)o.warn.push(`Las Tm de los dos cebadores se diferencian en ${fmtN(o.dTm,1)} °C. Lo ideal es menos de 4 °C.`);

 const lowGC=[['directo',F],['reverso',R]].filter(([l,x])=>x.gc<35||x.gc>65);
 if(lowGC.length===2)o.warn.push(`Los dos cebadores se salen del 35–65 % de GC (${fmtN(F.gc,0)} % y ${fmtN(R.gc,0)} %). Es lo que da la secuencia; alargarlos ayuda.`);

  if(pdHairpin(x.seq)>=5)o.warn.push(`El cebador ${l} puede plegarse sobre sí mismo (${pdHairpin(x.seq)} pb).`);
  if(pd3Dimer(x.seq,x.seq)>=5)o.warn.push(`El cebador ${l} puede formar dímeros consigo mismo por el extremo 3'.`);

}

function codTbl(org){
 if(COD_CACHE[org])return COD_CACHE[org];
 const f=COD_ORG[org].f,byAA={},rel={},w={};
 COD_LIST.forEach((c,i)=>{(byAA[COD_AA[c]]=byAA[COD_AA[c]]||[]).push(c)});
 for(const a in byAA){const lst=byAA[a];const tot=lst.reduce((x,c)=>x+f[COD_LIST.indexOf(c)],0);
  const mx=Math.max(...lst.map(c=>f[COD_LIST.indexOf(c)]));
  lst.forEach(c=>{const v=f[COD_LIST.indexOf(c)];rel[c]=tot?v/tot:0;w[c]=mx?v/mx:0});

const COD_SITES=[['BsaI','GGTCTC'],['BsmBI (Esp3I)','CGTCTC'],['BpiI (BbsI)','GAAGAC'],['NotI','GCGGCCGC'],['EcoRI','GAATTC'],['XbaI','TCTAGA']];
function codRng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function codTranslate(dna){let aa='';for(let i=0;i+2<dna.length;i+=3)aa+=COD_AA[dna.slice(i,i+3)]||'X';return aa}
function codGC(s){let g=0;for(const c of s)if(c==='G'||c==='C')g++;return s.length?g/s.length*100:0}
function codGC3(dna){let g=0,n=0;for(let i=2;i<dna.length;i+=3){n++;const c=dna[i];if(c==='G'||c==='C')g++}return n?g/n*100:0}
function codCAI(dna,org){const T=codTbl(org);let sum=0,n=0;

function codBad(dna,sites,runs){

 for(const [nm,q] of sites){const r=revcomp(q).toUpperCase();

function codFix(codons,org,sites,runs,rng){

  if(!hits.length){left=0;break}
  left=hits.length;let did=false;
  for(const h of hits){
   const c0=Math.floor(h.i/3),c1=Math.floor((h.i+h.len-1)/3);
   const idx=[];for(let k=c0;k<=c1;k++)idx.push(k);
   idx.sort(()=>rng()-0.5);
   for(const k of idx){
    const cur=codons[k],aa=COD_AA[cur];if(!aa||aa==='X')continue;
    const alts=T.byAA[aa].filter(x=>x!==cur&&T.rel[x]>=0.08);

    for(const alt of alts){const save=codons[k];codons[k]=alt;
     const sub=codons.slice(Math.max(0,k-4),k+5).join('');
     const n=codBad(sub,sites,runs).length;codons[k]=save;
     if(best==null||n<best.n||(n===best.n&&T.rel[alt]>T.rel[best.alt]))best={alt,n};}
    const before=codBad(codons.slice(Math.max(0,k-4),k+5).join(''),sites,runs).length;
    if(best&&best.n<before){codons[k]=best.alt;changed++;did=true;break}
   }

  }

function codSites(){const C=codState();const out=COD_SITES.filter(x=>C.sites.includes(x[0]));

function codCalc(){

 if(!raw){o.err='Pega la secuencia del gen o de la proteína.';return o}
 const clean=raw.replace(/[^A-Z*]/g,'');
 const isDNA=/^[ACGT]+$/.test(clean)&&clean.length>=30;
 o.isDNA=isDNA;
 let aa,orig=null;
 if(isDNA){
  if(clean.length%3){o.err=`La secuencia tiene ${clean.length} nt, que no es múltiplo de 3. Comprueba que has pegado la pauta completa.`;return o}
  orig=clean;aa=codTranslate(clean);

  if(st>=0&&st<aa.length-1)o.warn.push(`Hay un codón de parada en el aminoácido ${st+1}, antes del final. Comprueba la pauta de lectura.`);
  if(aa[0]!=='M')o.warn.push('La secuencia no empieza por ATG.');
 }else{
  aa=clean.replace(/[^ACDEFGHIKLMNPQRSTVWY*]/g,'');

  if(bad.length)o.warn.push(`Se han ignorado caracteres que no son aminoácidos: ${bad.join(' ')}.`);
  if(!aa){o.err='No se reconoce la secuencia.';return o}

 }

 const thr=Math.max(0,Math.min(50,numV(C.thr)??10))/100;
 let codons;
 const dom=C.mode==='dom'&&isDNA;
 if(dom){codons=[];for(let i=0;i<orig.length;i+=3)codons.push(orig.slice(i,i+3))}
 else{
  codons=[...aa].map(a=>{
   if(a==='*')return T.stop;

   const ok=lst.filter(c=>T.rel[c]>=thr);const pool=ok.length?ok:[lst[0]];

   const tot=pool.reduce((x,c)=>x+T.rel[c],0);let r=rng()*tot;

 if(orig){o.caiOrig=codCAI(orig,C.org);o.gcOrig=codGC(orig);o.gc3Orig=codGC3(orig);
  let ch=0;for(let i=0;i<codons.length;i++)if(codons[i]!==orig.slice(i*3,i*3+3))ch++;

}

function bufCalc(){

 const Vml=(numV(B.V)||0)*(VU[B.vu]||1);if(!(Vml>0)){out.err='Indica el volumen final.';return out}
 out.Vml=Vml;let liq=0;const seen=new Set();
 B.rows.forEach((r,i)=>{
  const L=BLIBM.get(norm(r.name))||{};const fc=numV(r.fc),fu=r.fu,mw=numV(r.mw);const nm=r.name||`Componente ${i+1}`;
  const o={i,name:nm,fin:fc!=null?`${fmtN(fc,3)} ${fu}`:'',late:!!L.late};
  if(fc==null||!(fc>0)){o.how='Falta la concentración final';o.bad=true;out.rows.push(o);return}
  const FU=BU[fu];
  if(r.mode==='solid'){
   if(FU.d==='x'||FU.d==='v'){o.how=FU.d==='v'?'Un % v/v se añade como líquido: usa «Desde stock» con el líquido puro al 100 %.':'Las unidades X solo tienen sentido desde un stock.';o.bad=true}
   else{const gl=bConv(fc,fu,'w',mw);if(gl==null){o.how='Falta el peso molecular';o.bad=true}else{o.g=gl*Vml/1000;o.how=`Pesa ${fmtMass(o.g)}`}}
  }else{
   const sc=numV(r.sc),su=r.su;
   if(!(sc>0)){o.how='Falta la concentración del stock';o.bad=true}
   else{const SU=BU[su];let ratio=null;
    if(SU.d===FU.d)ratio=fc*FU.f/(sc*SU.f);
    else if((SU.d==='m'||SU.d==='w')&&(FU.d==='m'||FU.d==='w')){const a=bConv(fc,fu,'m',mw),b=bConv(sc,su,'m',mw);if(a!=null&&b!=null)ratio=a/b}
    if(ratio==null){o.how=`No se puede pasar de ${su} a ${fu}${(SU.d==='m'||FU.d==='m')&&!mw?' sin el peso molecular':''}`;o.bad=true}
    else if(ratio>1){o.how=`El stock (${fmtN(sc,3)} ${su}) está menos concentrado que lo que pides`;o.bad=true}
    else{o.ml=ratio*Vml;liq+=o.ml;o.how=`${fmtVolMl(o.ml)} de ${fmtN(sc,3)} ${su}`;o.st=`${fmtN(sc,3)} ${su}`;
     if(L.rho&&su==='% v/v'&&sc===100)o.how+=` (o pesa ${fmtMass(o.ml*L.rho)})`}
   }
  }
  if(L.n&&!seen.has(L.n)&&!(L.so&&r.mode!=='solid')&&!(L.so&&B.noPh&&/^Ajusta el pH/.test(L.n))){seen.add(L.n);out.notes.push(L.n)}
  out.rows.push(o);
 });

}
